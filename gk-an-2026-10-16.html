<h1>General awareness practice gbcc82f464e</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "gbcc82f464e", "date": "2026-10-16", "qs": [{"id": "Q107", "cat": "CA", "q": "Whose birth anniversary did President Droupadi Murmu mark with floral tributes on 15 October 2026?", "o": ["A. P. J. Abdul Kalam", "Rajendra Prasad", "Sarvepalli Radhakrishnan", "Varahagiri Venkata Giri"], "a": 0, "x": "The President's official photo record identifies the tribute at Vijayawada on 15 October 2026 as one to former President A. P. J. Abdul Kalam.", "s": "President's Secretariat, 15 October 2026", "u": "https://dpl.rashtrapatibhavan.gov.in/view_datails/Mjk5NDI=", "t": "India: public life"}, {"id": "Q108", "cat": "CA", "q": "On which date did the UN mark the International Day of Rural Women in 2026?", "o": ["15 October", "5 October", "24 October", "11 October"], "a": 0, "x": "UN Women's statement of 13 October identifies the International Day of Rural Women as 15 October 2026. It recognises rural women's contributions to farming, communities and nature.", "s": "UN Women, 13 October 2026", "u": "https://www.unwomen.org/en/news-stories/statement/2026/10/un-women-statement-for-the-international-day-of-rural-women-15-october-2026", "t": "World: observances"}, {"id": "Q109", "cat": "GK", "q": "At standard sea-level atmospheric pressure, what is the approximate boiling point of pure water?", "o": ["50 degrees Celsius", "100 degrees Celsius", "75 degrees Celsius", "125 degrees Celsius"], "a": 1, "x": "Water boils at about 100 degrees Celsius at standard sea-level pressure. Its boiling point is lower at higher altitudes because the pressure is lower.", "s": "Britannica, boiling point", "u": "https://www.britannica.com/science/boiling-point", "t": "Science"}, {"id": "Q110", "cat": "GK", "q": "The Prime Meridian is the reference line for which value?", "o": ["0 degrees latitude", "90 degrees latitude", "0 degrees longitude", "180 degrees longitude"], "a": 2, "x": "A prime meridian is chosen as zero degrees longitude. Zero degrees latitude is the Equator. The historic Greenwich line and modern satellite reference meridian are slightly apart.", "s": "Royal Museums Greenwich, Prime Meridian", "u": "https://www.rmg.co.uk/stories/time/what-prime-meridian-why-it-greenwich", "t": "Geography"}, {"id": "Q111", "cat": "GK", "q": "The 1930 Dandi March challenged British laws controlling which everyday product?", "o": ["Tea", "Sugar", "Salt", "Cotton"], "a": 2, "x": "Gandhi and his followers went to Dandi and broke the British salt law by collecting salt. The march was part of civil disobedience against colonial rule.", "s": "Britannica, Salt March", "u": "https://www.britannica.com/event/Salt-March", "t": "History and culture"}, {"id": "Q112", "cat": "GK", "q": "Which institution is at the top of India's judicial system?", "o": ["Supreme Court", "Sessions Court", "High Court", "District Court"], "a": 0, "x": "The Supreme Court of India is the apex judicial body under the Constitution. High Courts and district-level courts are below it in the judicial system.", "s": "Supreme Court of India, history", "u": "https://www.sci.gov.in/about-department/history/", "t": "Civics"}, {"id": "Q113", "cat": "GK", "q": "Which sport uses a shuttlecock rather than a ball during play?", "o": ["Lawn tennis", "Squash", "Badminton", "Table tennis"], "a": 2, "x": "Badminton players hit a shuttlecock across a net with lightweight rackets. The other listed sports use balls.", "s": "Britannica, badminton", "u": "https://www.britannica.com/sports/badminton", "t": "Sports"}, {"id": "Q083", "cat": "GK", "q": "The emperor Ashoka's inscriptions are records of which dynasty's rule?", "o": ["Kushan", "Chola", "Gupta", "Maurya"], "a": 3, "x": "Ashoka ruled the Mauryan empire. The Gupta, Chola and Kushan dynasties were different ruling lines.", "s": "Britannica, Ashoka", "u": "https://www.britannica.com/summary/Ashoka", "t": "History"}, {"id": "Q091", "cat": "GK", "q": "An Indian citizen protects a local lake and treats wildlife with compassion. Article 51A lists this responsibility under which heading?", "o": ["Emergency Provisions", "Fundamental Duties", "Fundamental Rights", "Directive Principles"], "a": 1, "x": "Article 51A(g) names protecting the natural environment and compassion for living creatures as duties of citizens.", "s": "Constitution of India, Article 51A", "u": "https://cdnbbsr.s3waas.gov.in/s35b3b68ffd8758e8114d7df1efa4ac376/uploads/2025/07/202507252048725343.pdf", "t": "Civics"}, {"id": "Q095", "cat": "GK", "q": "A radio signal can reach astronauts across space, but a nearby explosion cannot be heard directly across a vacuum. What does sound require?", "o": ["An electric circuit", "A magnetic field", "A light source", "A material medium"], "a": 3, "x": "Sound is a mechanical disturbance passed through matter. A vacuum contains no material medium to carry it.", "s": "Britannica, sound", "u": "https://www.britannica.com/science/How-Does-Sound-Travel", "t": "Science"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
