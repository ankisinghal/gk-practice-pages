<script>const D={"id": "g939f7d4eaf", "date": "2026-11-18", "qs": [{"id": "Q692", "cat": "CA", "q": "India launched LeadIT 3.0 at COP31 on 17 November 2026 together with which country?", "o": ["Denmark", "Sweden", "Norway", "Finland"], "a": 1, "x": "PIB reported that India and Sweden launched the third phase of the Leadership Group for Industry Transition, aimed at lower-carbon industry. This asks about the announced launch, not later project outcomes.", "s": "PIB, 17 Nov 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2337325&lang=1&reg=48", "t": "India and world: environment"}, {"id": "Q693", "cat": "CA", "q": "Which issue is the focus of the WHO awareness week held from 18 to 24 November 2026?", "o": ["Occupational hearing loss", "Childhood malnutrition", "Indoor air pollution", "Antimicrobial resistance"], "a": 3, "x": "WHO identifies 18-24 November as World AMR Awareness Week. Its 2026 theme is One Health, one action: Prevent AMR now. The campaign concerns microbes becoming resistant to medicines; this is not personal treatment advice.", "s": "WHO, World AMR Awareness Week 2026", "u": "https://www.who.int/news-room/events/detail/2026/11/18/default-calendar/world-amr-awareness-week-2026", "t": "World: public health"}, {"id": "Q694", "cat": "GK", "q": "The Ramsar Convention provides an international framework for conserving and wisely using which environments?", "o": ["Mountains", "Grasslands", "Deserts", "Wetlands"], "a": 3, "x": "The Convention on Wetlands, adopted in Ramsar in 1971, concerns the conservation and wise use of wetlands and their resources.", "s": "Convention on Wetlands, About", "u": "https://www.ramsar.org/about-convention-wetlands", "t": "Environment: international conservation"}, {"id": "Q695", "cat": "GK", "q": "An existing rock changes under heat and pressure without melting. Which rock category can this process produce?", "o": ["Volcanic", "Metamorphic", "Plutonic", "Sedimentary"], "a": 1, "x": "Metamorphism changes an existing rock through heat, pressure or fluids without melting it. Volcanic and plutonic rocks are igneous rocks formed from molten material.", "s": "US Geological Survey, Metamorphic rocks", "u": "https://www.usgs.gov/faqs/what-are-metamorphic-rocks", "t": "Earth science: rock cycle"}, {"id": "Q696", "cat": "GK", "q": "The Sattriya dance tradition is associated with which Indian state?", "o": ["Assam", "Tripura", "Manipur", "Odisha"], "a": 0, "x": "Sangeet Natak Akademi describes Sattriya as a tradition of Assam and maintains a Sattriya Kendra in Guwahati to support it.", "s": "Sangeet Natak Akademi, Sattriya Kendra", "u": "https://www.sangeetnatak.gov.in/centres-of-the-akademi/sattriya-kendra", "t": "Culture: Indian classical dance"}, {"id": "Q697", "cat": "GK", "q": "Under Article 100(3), what fraction of the Lok Sabha total membership forms the quorum for a sitting?", "o": ["One-third", "One-tenth", "One-fifth", "One-fourth"], "a": 1, "x": "The Lok Sabha FAQ gives the quorum as one-tenth of the total membership of the House under Article 100(3). Quorum is the minimum attendance needed to constitute a sitting.", "s": "Lok Sabha, Frequently Asked Questions", "u": "https://sansad.in/ls/faq", "t": "Civics: Parliament"}, {"id": "Q698", "cat": "GK", "q": "Which deficit is the gap between government total expenditure and receipts excluding borrowings?", "o": ["Fiscal deficit", "Trade deficit", "Revenue deficit", "Primary deficit"], "a": 0, "x": "Fiscal deficit compares total expenditure with receipts that do not include borrowing. Revenue deficit concerns revenue expenditure and revenue receipts; primary deficit deducts interest payments from fiscal deficit.", "s": "Government of India, Key to Budget 2026", "u": "https://www.indiabudget.gov.in/doc/Key_to_Budget_Document_2026.pdf", "t": "Economy: public finance"}, {"id": "Q699", "cat": "CA", "q": "A poster for World Habitat Day 2026 is missing its main word: \"Adequate ___ for All\". Which word belongs there?", "o": ["Healthcare", "Education", "Housing", "Employment"], "a": 2, "x": "The UN lists the 2026 World Habitat Day theme as Adequate Housing for All. This asks about the fixed 2026 campaign theme.", "s": "United Nations, World Habitat Day 2026", "u": "https://www.un.org/en/observances/habitat-day", "t": "Review: cities"}, {"id": "Q700", "cat": "CA", "q": "The UN General Assembly session linked to its September 2026 high-level week had which ordinal number?", "o": ["81st", "83rd", "80th", "82nd"], "a": 0, "x": "The UN High-level Week 2026 page identifies the gathering with the General Assembly's 81st session.", "s": "United Nations, High-level Week 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "Review: United Nations"}, {"id": "Q701", "cat": "CA", "q": "A timeline marks the first human-made Earth satellite launch on 4 October 1957. Which name belongs beside that date?", "o": ["Explorer 1", "Luna 2", "Sputnik 1", "Vostok 1"], "a": 2, "x": "The United Nations identifies Sputnik 1 as the first human-made Earth satellite, launched on 4 October 1957. This anniversary starts World Space Week.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Review: space history"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
