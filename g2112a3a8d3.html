<h1>General awareness practice g2112a3a8d3</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "g2112a3a8d3", "date": "2026-10-29", "qs": [{"id": "Q247", "cat": "CA", "q": "A class quiz asks: in 2026, World Post Day, recalling the founding of the Universal Postal Union, was observed in India on which date?", "o": ["5 October", "10 October", "9 October", "24 October"], "a": 2, "x": "World Post Day recalls the Universal Postal Union's founding in 1874 and was observed on 9 October 2026, as the PIB report of 9 October 2026 states.", "s": "PIB, 9 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321604&lang=1&reg=1", "t": "World: postal services"}, {"id": "Q248", "cat": "CA", "q": "A news recap asks: which Indian commission, tasked with protecting and promoting human rights, scheduled its 33rd Foundation Day function for 12 October 2026?", "o": ["National Human Rights Commission", "Election Commission of India", "Reserve Bank of India", "Indian Space Research Organisation"], "a": 0, "x": "The dated PIB announcement identifies the National Human Rights Commission, India, whose 33rd Foundation Day function was planned for 12 October 2026. NHRC works to protect and promote human rights.", "s": "PIB, 9 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321285&lang=1&reg=1", "t": "India: institutions"}, {"id": "Q249", "cat": "CA", "q": "In a current-affairs drill: under the India-New Zealand Free Trade Agreement in force from 20 October 2026, what duty treatment do Indian goods receive in New Zealand?", "o": ["50% reduced duty", "Access only for farm goods", "Access only for services", "Full duty-free access"], "a": 3, "x": "The agreement gives 100 percent of Indian exports duty-free entry into the New Zealand market, as reported on 20 October 2026.", "s": "The Hindu / Akashvani News, 20 October 2026", "u": "https://www.thehindu.com/business/Economy/india-new-zealand-fta-comes-into-force-october-20-2026/article71603429.ece", "t": "India: economy"}, {"id": "Q230", "cat": "CA", "q": "Under the amendment to the Central Motor Vehicles Rules announced by MoRTH in October 2026, which fuel was expressly added alongside E85 in the emission certification provisions for flex-fuel vehicles?", "o": ["E85", "E100", "E20", "B20"], "a": 1, "x": "The MoRTH amendment announced in October 2026 expressly adds E100 alongside E85 in the certification provisions. The release describes E100 as a fuel consisting predominantly of ethanol and E85 as a petrol-ethanol blend with up to 85 per cent ethanol; E denotes ethanol and the number its proportion in the fuel. E20 is petrol blended with 20% ethanol.", "s": "PIB MoRTH (PRID 2328642) + The Hindu, checked 29 October 2026", "u": "https://pib.gov.in/PressReleasePage.aspx?PRID=2328642", "t": "India: energy"}, {"id": "Q231", "cat": "CA", "q": "The 12th BRICS Parliamentary Forum, which adopted a Joint Declaration in October 2026, was hosted by which city?", "o": ["New Delhi", "Moscow", "Beijing", "Cape Town"], "a": 0, "x": "The forum met in New Delhi on 26-27 October 2026 and adopted a Joint Declaration on people-centric development and global governance.", "s": "PIB Joint Declaration, 27 Oct 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10279_20261027_16361601.pdf", "t": "World: diplomacy"}, {"id": "Q024", "cat": "GK", "q": "In which Indian town was Mahatma Gandhi born, on 2 October 1869?", "o": ["Rajkot", "Ahmedabad", "Wardha", "Porbandar"], "a": 3, "x": "Gandhi was born in Porbandar. His birthday, 2 October, is marked as Gandhi Jayanti.", "s": "Britannica, Mahatma Gandhi", "u": "https://www.britannica.com/biography/Mahatma-Gandhi", "t": "History and culture"}, {"id": "Q077", "cat": "GK", "q": "Which Indian state is the largest by area?", "o": ["Maharashtra", "Rajasthan", "Uttar Pradesh", "Madhya Pradesh"], "a": 1, "x": "The Rajasthan government identifies Rajasthan as the largest Indian state by area. Area and population are different measures.", "s": "Rajasthan government, checked 11 October 2026", "u": "https://rising.rajasthan.gov.in/rajasthan-factfile", "t": "Geography"}, {"id": "Q246", "cat": "GK", "q": "Which animal, famous for its speed, has had sprints measured at up to about 114 km/h?", "o": ["Lion", "Leopard", "Cheetah", "Tiger"], "a": 2, "x": "Britannica reports that cheetahs' sprints have been measured at a maximum of 114 km (71 miles) per hour, and that the cheetah is known especially for its speed.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/animal/cheetah-mammal", "t": "Animals and nature"}, {"id": "Q232", "cat": "GK", "q": "Which town is the southernmost tip of the Indian mainland?", "o": ["Rameswaram", "Thiruvananthapuram", "Puducherry", "Kanyakumari"], "a": 3, "x": "Kanyakumari in Tamil Nadu is the mainland's southernmost tip (Cape Comorin, at the tip of the Indian peninsula). Indira Point, on Great Nicobar Island in the Andaman and Nicobar Islands, lies farther south but is not on the mainland.", "s": "Britannica (Kanniyakumari) + DGLL, checked 29 October 2026", "u": "https://www.britannica.com/place/Kanniyakumari", "t": "Geography"}, {"id": "Q233", "cat": "GK", "q": "Who was the first Prime Minister of independent India?", "o": ["Jawaharlal Nehru", "Sardar Vallabhbhai Patel", "Rajendra Prasad", "Lal Bahadur Shastri"], "a": 0, "x": "Nehru took office on 15 August 1947 and remained Prime Minister until his death in 1964.", "s": "Britannica", "u": "https://www.britannica.com/biography/Jawaharlal-Nehru", "t": "History"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
