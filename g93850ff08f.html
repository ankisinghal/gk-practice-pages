 "s": "The Week, 5 November 2026", "u": "https://www.theweek.in/news/sci-tech/2026/11/05/mission-shakthisat-empowers-girls-in-space-education.html", "t": "India: space"}, {"id": "Q470", "cat": "CA", "q": "ISRO's navigation satellite NVS-03, declared fully healthy in November 2026, belongs to which Indian satellite navigation system?", "o": ["NavIC", "INSAT", "GAGAN", "IRS"], "a": 0, "x": "ISRO chairman V. Narayanan said NVS-03, the latest satellite of NavIC - India's own navigation system, an alternative to GPS - is fully healthy (The Hindu, 5 November 2026).", "s": "The Hindu, 5 November 2026", "u": "https://www.thehindu.com/news/cities/chennai/isros-latest-navigation-satellite-nvs-03-is-fully-healthy-says-chairman-v-narayanan/article71670095.ece", "t": "India: space"}, {"id": "Q449", "cat": "GK", "q": "What is the nearest star to the Earth?", "o": ["The Pole Star", "Proxima Centauri", "Alpha Centauri", "The Sun"], "a": 3, "x": "The Sun is the nearest star to Earth, about 150 million km away; Proxima Centauri is the nearest star beyond it (NASA).", "s": "NASA reference", "u": "https://science.nasa.gov/sun/", "t": "Science: space"}, {"id": "Q451", "cat": "GK", "q": "Which is the largest continent by area?", "o": ["Africa", "North America", "Asia", "Europe"], "a": 2, "x": "Asia is the largest continent, covering about 30 per cent of Earth's land area (Britannica/NCERT).", "s": "Britannica / NCERT reference", "u": "https://www.britannica.com/place/Asia", "t": "Geography: world"}, {"id": "Q468", "cat": "GK", "q": "Which light gas is filled in party balloons to make them float in the air?", "o": ["Carbon dioxide", "Helium", "Nitrogen", "Oxygen"], "a": 1, "x": "Helium is lighter than air and does not catch fire, so it lifts balloons safely (NASA).", "s": "NASA reference", "u": "https://science.nasa.gov/resource/helium/", "t": "Science: everyday"}, {"id": "Q480", "cat": "GK", "q": "Who was the first President of India?", "o": ["Dr. Rajendra Prasad", "Jawaharlal Nehru", "Dr. B. R. Ambedkar", "Dr. S. Radhakrishnan"], "a": 0, "x": "Dr. Rajendra Prasad became India's first President in 1950; Radhakrishnan was the first Vice-President, Nehru the first Prime Minister (Britannica).", "s": "Britannica reference", "u": "https://www.britannica.com/biography/Rajendra-Prasad", "t": "History: modern India"}, {"id": "Q481", "cat": "GK", "q": "The Indian Parliament has two houses: the Lok Sabha and which other house?", "o": ["The Vidhan Parishad", "The Vidhan Sabha", "The NITI Aayog", "The Rajya Sabha"], "a": 3, "x": "Parliament's two houses are the Lok Sabha and the Rajya Sabha; Vidhan Sabha and Vidhan Parishad are state-level bodies (NCERT).", "s": "NCERT reference", "u": "https://www.ncert.nic.in/", "t": "Civics: Constitution"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
