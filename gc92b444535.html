<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>General awareness practice gc92b444535</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "gc92b444535", "date": "2026-10-29", "qs": [{"id": "Q240", "cat": "CA", "q": "After beating Sri Lanka in the September 2026 final, India lifted the Women's Asia Cup trophy for which record-extending time?", "o": ["Seventh", "Ninth", "Eighth", "Sixth"], "a": 2, "x": "The 13 September 2026 win over Sri Lanka was India's record-extending eighth Women's Asia Cup title, and the team went unbeaten through the tournament.", "s": "ICC, 13 Sep 2026", "u": "https://www.icc-cricket.com/news/india-cruise-to-record-extending-eighth-women-s-asia-cup-title", "t": "Sports"}, {"id": "Q241", "cat": "CA", "q": "India's provisional CPI retail inflation for August 2026, released in mid-September, came in at about what level?", "o": ["6.90%", "3.15%", "5.40%", "4.82%"], "a": 3, "x": "The provisional August 2026 CPI figure released on 14 September was 4.82%, with food inflation at 5.95%.", "s": "Press Information Bureau, 14 Sep 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?lang=2&PRID=2310058&reg=48", "t": "Economy"}, {"id": "Q239", "cat": "GK", "q": "In a civics quiz, Ria is asked: which directly elected House of India's Parliament is known as the House of the People?", "o": ["Lok Sabha", "Rajya Sabha", "Supreme Court", "Vidhan Parishad"], "a": 0, "x": "Lok Sabha, the directly elected House, means House of the People; Rajya Sabha is the Council of States. The quiz answer is Lok Sabha.", "s": "Digital Sansad", "u": "https://sansad.in/ls/about/introduction", "t": "Civics"}, {"id": "Q230", "cat": "CA", "q": "Under the Central Motor Vehicles Rules amendment notified in October 2026, flex-fuel vehicles may be certified for a fuel consisting of 100% ethanol. What is that fuel called?", "o": ["E100", "E20", "E85", "B20"], "a": 0, "x": "The MoRTH amendment notified on 26 October 2026 adds E100 (fuel comprising 100% ethanol) alongside E85 (up to 85% ethanol) in the Rule 115 certification tables. E20 is the ordinary petrol blend; B20 is a biodiesel blend.", "s": "The Hindu, 26 Oct 2026", "u": "https://www.thehindu.com/news/national/government-amends-motor-vehicle-rules-to-permit-pure-ethanol-flex-fuel-vehicles/article71626824.ece", "t": "India: energy"}, {"id": "Q231", "cat": "CA", "q": "The 12th BRICS Parliamentary Forum, which adopted a Joint Declaration in October 2026, was hosted by which city?", "o": ["Moscow", "New Delhi", "Cape Town", "Beijing"], "a": 1, "x": "The forum met in New Delhi on 26-27 October 2026 and adopted a Joint Declaration on people-centric development and global governance.", "s": "PIB Joint Declaration, 27 Oct 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10279_20261027_16361601.pdf", "t": "World: diplomacy"}, {"id": "Q008", "cat": "GK", "q": "On which date did the Constitution of India come into effect?", "o": ["2 October 1950", "15 August 1947", "26 January 1950", "26 November 1949"], "a": 2, "x": "The Constitution came into effect on 26 January 1950, which India celebrates as Republic Day. It was adopted earlier, on 26 November 1949.", "s": "Britannica", "u": "https://www.britannica.com/topic/Constitution-of-India", "t": "Civics"}, {"id": "Q009", "cat": "GK", "q": "Which is the largest planet in our solar system?", "o": ["Neptune", "Jupiter", "Saturn", "Earth"], "a": 1, "x": "Jupiter is the largest planet. About 1,000 Earths could fit inside it.", "s": "NASA", "u": "https://science.nasa.gov/jupiter/jupiter-facts/", "t": "Science and space"}, {"id": "Q010", "cat": "GK", "q": "Which planet is often called the Red Planet?", "o": ["Venus", "Mercury", "Jupiter", "Mars"], "a": 3, "x": "Mars looks red because iron minerals in its soil and dust have rusted.", "s": "NASA", "u": "https://science.nasa.gov/mars/facts/", "t": "Science and space"}, {"id": "Q232", "cat": "GK", "q": "Which town is the southernmost tip of the Indian mainland?", "o": ["Thiruvananthapuram", "Rameswaram", "Kanyakumari", "Puducherry"], "a": 2, "x": "Kanyakumari in Tamil Nadu is the mainland's southernmost tip, where the Bay of Bengal, the Indian Ocean and the Arabian Sea meet. Indira Point in the Andaman Islands lies farther south but is not on the mainland.", "s": "Britannica", "u": "https://www.britannica.com/place/Kanyakumari", "t": "Geography"}, {"id": "Q233", "cat": "GK", "q": "Who was the first Prime Minister of independent India?", "o": ["Jawaharlal Nehru", "Sardar Vallabhbhai Patel", "Lal Bahadur Shastri", "Rajendra Prasad"], "a": 0, "x": "Nehru took office on 15 August 1947 and remained Prime Minister until his death in 1964. Rajendra Prasad was the first President; Shastri was the second Prime Minister.", "s": "Britannica", "u": "https://www.britannica.com/biography/Jawaharlal-Nehru", "t": "History"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
