<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General awareness practice gaa3e7f8bfd</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>General awareness practice gaa3e7f8bfd</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "gaa3e7f8bfd", "date": "2026-11-19", "qs": [{"id": "Q702", "cat": "CA", "q": "Which Indian state is scheduled to host the 57th International Film Festival of India from 20 to 28 November 2026?", "o": ["Odisha", "Goa", "Kerala", "Assam"], "a": 1, "x": "PIB reported on 18 November that the 57th IFFI was scheduled in Goa from 20 to 28 November 2026. This is a scheduled event, not a claim that it has already concluded.", "s": "PIB, 18 Nov 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2337844&lang=2&reg=48", "t": "India: cinema"}, {"id": "Q703", "cat": "CA", "q": "World Toilet Day 2026 links safe sanitation especially with which goal?", "o": ["Heritage tourism", "Ocean navigation", "Gender equality", "Space exploration"], "a": 2, "x": "UN-Water names the 2026 theme Sanitation and gender equality. The campaign explains how safe sanitation supports health, safety, dignity and opportunity for women and girls.", "s": "UN-Water, World Toilet Day 2026", "u": "https://www.unwater.org/our-work/world-toilet-day", "t": "World: sanitation"}, {"id": "Q704", "cat": "GK", "q": "Which device can use electric current through a coil to magnetise a soft iron core?", "o": ["Electromagnet", "Hydrometer", "Thermocouple", "Barometer"], "a": 0, "x": "An electromagnet uses current in a wire coil to produce a magnetic field, often strengthened by a soft iron core. Its magnetism can be controlled by changing the current.", "s": "Britannica, Electromagnet", "u": "https://kids.britannica.com/scholars/article/electromagnet/32309", "t": "Science: electricity and magnetism"}, {"id": "Q705", "cat": "GK", "q": "On a map, Japan and the Aleutian Islands are examples of which kind of geographical group?", "o": ["Plateau", "Peninsula", "Archipelago", "Isthmus"], "a": 2, "x": "An archipelago is a group of islands. A peninsula projects into water but stays attached to a larger land area; an isthmus is a narrow land link.", "s": "Britannica, Island", "u": "https://kids.britannica.com/kids/article/island/346147", "t": "Geography: landforms"}, {"id": "Q706", "cat": "GK", "q": "Madhubani, also called Mithila painting, is traditionally associated with which Indian state?", "o": ["Odisha", "Bihar", "Maharashtra", "Rajasthan"], "a": 1, "x": "The Madhubani district administration identifies this painting tradition with the Mithila region of Bihar. It uses line drawings, colour and decorative patterns.", "s": "Madhubani District, Handicraft", "u": "https://madhubani.nic.in/handicraft/", "t": "Culture: painting"}, {"id": "Q707", "cat": "GK", "q": "Which writ asks that a detained person be brought before the court so that the legality of the detention can be examined?", "o": ["Habeas corpus", "Quo warranto", "Certiorari", "Mandamus"], "a": 0, "x": "Habeas corpus is a safeguard against unlawful detention. The court calls for the detained person to be produced and examines the legal basis of the detention.", "s": "NCERT, Rights in the Indian Constitution", "u": "https://ncert.nic.in/textbook/pdf/keps202.pdf", "t": "Civics: constitutional remedies"}, {"id": "Q708", "cat": "GK", "q": "What is the defining feature of a demand deposit in a bank?", "o": ["It must remain for a fixed term.", "It is a loan taken from the bank.", "It can only be repaid in shares.", "It is withdrawable on demand."], "a": 3, "x": "The RBI defines a demand deposit as a deposit withdrawable on demand. A term deposit is accepted for a fixed period.", "s": "Reserve Bank of India, Data Definition", "u": "https://rbi.org.in/scripts/DataDefinition.aspx", "t": "Economy: banking"}, {"id": "Q709", "cat": "CA", "q": "Which subject completes the UN World Habitat Day 2026 theme, \"Adequate ___ for All\"?", "o": ["Education", "Healthcare", "Housing", "Employment"], "a": 2, "x": "The UN lists the 2026 World Habitat Day theme as Adequate Housing for All. This asks about the fixed 2026 campaign theme.", "s": "United Nations, World Habitat Day 2026", "u": "https://www.un.org/en/observances/habitat-day", "t": "Review: cities"}, {"id": "Q710", "cat": "CA", "q": "A news archive files the September 2026 UN high-level week under which General Assembly session?", "o": ["81st", "80th", "83rd", "82nd"], "a": 0, "x": "The UN High-level Week 2026 page identifies the gathering with the General Assembly's 81st session.", "s": "United Nations, High-level Week 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "Review: United Nations"}, {"id": "Q711", "cat": "CA", "q": "World Space Week begins on the anniversary of the first artificial Earth satellite launch. Which satellite was it?", "o": ["Explorer 1", "Vostok 1", "Luna 2", "Sputnik 1"], "a": 3, "x": "The United Nations identifies Sputnik 1 as the first human-made Earth satellite, launched on 4 October 1957. This anniversary starts World Space Week.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Review: space history"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.getElementById("copy").textContent="Copy failed - code selected; copy manually"}};
</script></body></html>
