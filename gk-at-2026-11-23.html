ens living abroad"], "a": 0, "x": "GDP measures production within a country's borders over a period. It counts final goods and services, rather than simply adding bank balances or the value of land.", "s": "International Monetary Fund, Gross Domestic Product", "u": "https://www.imf.org/external/pubs/ft/fandd/basics/14%5Fgdp.htm", "t": "General knowledge"}, {"id": "gfcadad25f2-G08", "cat": "GK", "q": "An atlas index sorts rivers by continent. In which list should the Amazon appear?", "o": ["African rivers", "Asian rivers", "South American rivers", "European rivers"], "a": 2, "x": "The Amazon is a South American river.", "s": "Britannica Kids, Amazon River", "u": "https://kids.britannica.com/kids/article/Amazon-River/346079", "t": "Revision"}, {"id": "gfcadad25f2-G09", "cat": "GK", "q": "An expedition plans to climb Africa's highest mountain. Which destination fits that plan?", "o": ["Mount Everest", "Mont Blanc", "Mount Kilimanjaro", "Aconcagua"], "a": 2, "x": "Kilimanjaro is Africa's highest mountain. Everest is in Asia, Aconcagua in South America, and Mont Blanc in Europe.", "s": "UNESCO, Kilimanjaro National Park", "u": "https://whc.unesco.org/en/list/403/", "t": "Revision"}, {"id": "gfcadad25f2-G10", "cat": "GK", "q": "In India, Meera is eighteen and Kabir is seventeen. Both are otherwise eligible. Who meets the minimum-age condition to register as a voter?", "o": ["Both Meera and Kabir", "Neither Meera nor Kabir", "Kabir only", "Meera only"], "a": 3, "x": "The minimum age is eighteen on the applicable qualifying date. Meera meets the age condition; Kabir does not.", "s": "Election Commission of India, Voter Services Portal", "u": "https://www.eci.gov.in/voters-services-portal", "t": "Revision"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
