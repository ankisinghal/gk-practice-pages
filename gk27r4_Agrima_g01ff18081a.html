eges and Anganwadi centres in five southern districts closed for 28-29 October as which cyclonic storm approached the coast?", "o": ["Cyclone Arnab", "Cyclone Fani", "Cyclone Biparjoy", "Cyclone Amphan"], "a": 0, "x": "The cyclonic storm approaching the Odisha coast was Arnab; the state ordered schools, colleges and Anganwadi centres in five southern districts closed for 28-29 October.", "s": "CM Odisha + PIB (NCMC), checked 27 October 2026", "u": "https://cm.odisha.gov.in/en/latest-news/review-preparedness-possible-cyclone", "t": "India: weather"}, {"id": "Q199", "cat": "CA", "q": "Vigilance Awareness Week 2026 is being observed from 26 October to 1 November with which theme?", "o": ["Probity for Prosperity", "Say No to Corruption; Commit to the Nation", "Vigilance: Our Shared Responsibility", "Corruption Free India for a Developed Nation"], "a": 0, "x": "PIB announced Vigilance Awareness Week 2026, observed 26 October-1 November in the week of Sardar Vallabhbhai Patel's birth anniversary, with the theme 'Satyanishtha se Samriddhi' (Probity for Prosperity).", "s": "PIB, 26 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2328490&lang=1&reg=3", "t": "India: governance"}, {"id": "Q200", "cat": "GK", "q": "Which flower is the national flower of India?", "o": ["Rose", "Lotus", "Jasmine", "Marigold"], "a": 1, "x": "The lotus (Nelumbo nucifera) is India's national flower, as stated on the Embassy of India's About India page.", "s": "Embassy of India, Helsinki (gov.in), About India; checked 27 October 2026", "u": "https://www.indembhelsinki.gov.in/about-india.php", "t": "India: symbols"}, {"id": "Q201", "cat": "GK", "q": "Which bird is the national bird of India?", "o": ["Rose-ringed parrot", "House sparrow", "Indian peacock", "Common kingfisher"], "a": 2, "x": "The Indian peacock (Pavo cristatus) is India's national bird, as stated on the Government of India's Know India national bird page.", "s": "knowindia.india.gov.in, National Bird; checked 27 October 2026", "u": "https://knowindia.india.gov.in/national-identity-elements/national-bird.php", "t": "India: symbols"}, {"id": "Q202", "cat": "GK", "q": "Which is the largest mammal in the world?", "o": ["Giraffe", "Hippopotamus", "Blue whale", "African elephant"], "a": 2, "x": "The blue whale is the largest mammal - and the largest animal known to have lived on Earth.", "s": "Britannica, checked 27 October 2026", "u": "https://www.britannica.com/animal/blue-whale", "t": "Animals"}, {"id": "Q203", "cat": "GK", "q": "The original Sanskrit epic Ramayana was composed by which sage?", "o": ["Kalidasa", "Tulsidas", "Ved Vyasa", "Valmiki"], "a": 3, "x": "Valmiki composed the Sanskrit Ramayana. Ved Vyasa is linked with the Mahabharata and Tulsidas wrote the later Ramcharitmanas.", "s": "Britannica, Valmiki biography; checked 27 October 2026", "u": "https://www.britannica.com/biography/Valmiki", "t": "History and culture"}, {"id": "Q204", "cat": "GK", "q": "Which is the smallest state of India by area?", "o": ["Sikkim", "Goa", "Manipur", "Tripura"], "a": 1, "x": "Goa is India's smallest state by area (about 3,702 square kilometres), as stated on the Government of Goa portal.", "s": "goa.gov.in, About Goa State; checked 27 October 2026", "u": "https://www.goa.gov.in/know-goa/about-goa-state/", "t": "Geography: India"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
