<script>const D={"id": "g74edca4628", "date": "2026-11-20", "qs": [{"id": "g74edca4628-G01", "cat": "GK", "q": "Which gas can make a party balloon float and is much less likely to catch fire than hydrogen?", "o": ["Oxygen", "Nitrogen", "Carbon dioxide", "Helium"], "a": 3, "x": "Helium is lighter than air and is not flammable, so it is used to fill floating balloons.", "s": "Royal Society of Chemistry, Helium", "u": "https://periodic-table.rsc.org/element/2/helium", "t": "Science: gases"}, {"id": "g74edca4628-G02", "cat": "GK", "q": "Which instrument-and-measurement pairing is correct?", "o": ["Seismograph - ground motion", "Barometer - air humidity", "Anemometer - rainfall amount", "Hygrometer - wind speed"], "a": 0, "x": "A seismograph records ground motion, including shaking from earthquakes. This item checks the same instrument function through a pairing.", "s": "Britannica, Seismograph", "u": "https://www.britannica.com/technology/seismograph", "t": "Science: instruments"}, {"id": "g74edca4628-G03", "cat": "GK", "q": "Which person-and-office pairing describes India at the start of its republic in 1950?", "o": ["Rajendra Prasad - Prime Minister", "Rajendra Prasad - President", "Jawaharlal Nehru - President", "S. Radhakrishnan - President"], "a": 1, "x": "Rajendra Prasad was the first President of the Republic of India. Jawaharlal Nehru was Prime Minister, and S. Radhakrishnan later became the second President.", "s": "Britannica, Rajendra Prasad", "u": "https://www.britannica.com/biography/Rajendra-Prasad", "t": "History: republic"}, {"id": "g74edca4628-G04", "cat": "CA", "q": "World Children's Day on 20 November 2026 is the global day of action for children led by which organisation?", "o": ["UNESCO", "UNIDO", "UNICEF", "UNWTO"], "a": 2, "x": "UNICEF identifies World Children's Day on 20 November as its global day of action for children and their rights. The date marks adoption of the Convention on the Rights of the Child.", "s": "UNICEF, World Children's Day 2026", "u": "http://www.unicef.org/take-action/campaigns/world-childrens-day", "t": "World: child rights"}, {"id": "g74edca4628-G05", "cat": "CA", "q": "The November 2026 inscriptions of three Indian manuscripts were added to UNESCO's regional Memory of the World register for which area?", "o": ["Latin America and the Caribbean", "Arab States", "Asia and the Pacific", "Europe and North America"], "a": 2, "x": "UNESCO reported the three Indian documentary-heritage inscriptions on 13 November 2026, following the 5 November MOWCAP meeting. This is the regional Memory of the World register, not the World Heritage List.", "s": "UNESCO, 13 November 2026", "u": "https://www.unesco.org/en/articles/unesco-inscribes-arthasastra-mahabharata-and-rajatarangini-memory-world-asia-pacific-regional", "t": "India and world: documentary heritage"}, {"id": "g74edca4628-G06", "cat": "GK", "q": "A power station uses steam heated by rocks deep underground. Which energy source is it using?", "o": ["Solar", "Tidal", "Wind", "Geothermal"], "a": 3, "x": "Geothermal energy is heat from within the Earth. It can be used for heating and electricity generation.", "s": "US EIA, Geothermal explained", "u": "https://www.eia.gov/energyexplained/geothermal/", "t": "Science: energy"}, {"id": "g74edca4628-G07", "cat": "GK", "q": "What is the usual name for a partially enclosed coastal area where a river's fresh water mixes with seawater?", "o": ["Estuary", "Glacier", "Sand dune", "Plateau"], "a": 0, "x": "A typical coastal estuary forms where freshwater from rivers mixes with seawater. Its mixed water is called brackish.", "s": "NOAA, What is an estuary?", "u": "https://oceanservice.noaa.gov/facts/estuary.html", "t": "Geography: coastal waters"}, {"id": "g74edca4628-G08", "cat": "GK", "q": "Which description best fits the Panchatantra?", "o": ["Animal fables teaching practical wisdom", "Hymns used in Vedic fire ceremonies", "Rules governing classical dance steps", "Chronicles of medieval military campaigns"], "a": 0, "x": "The Panchatantra is a Sanskrit collection of animal fables, widely translated and used to communicate wisdom through stories.", "s": "Britannica, Panchatantra", "u": "https://www.britannica.com/topic/Panchatantra-Indian-literature", "t": "Culture: literature"}, {"id": "g74edca4628-G09", "cat": "GK", "q": "A village resident is registered on its electoral roll but has never been elected to office. Is this person a member of the Gram Sabha?", "o": ["Only if the resident owns farmland.", "Yes, electoral registration gives membership.", "Only after nomination by the state.", "No, only elected members can belong."], "a": 1, "x": "Article 243(b) defines the Gram Sabha by the people registered on the electoral rolls for the village within the Panchayat area. It is broader than the elected Gram Panchayat.", "s": "Indian Economic Service, Gram Sabha", "u": "https://ies.gov.in/arthapedia/concept/gram-sabha", "t": "Civics: village government"}, {"id": "g74edca4628-G10", "cat": "GK", "q": "Mira chooses a library visit over her next-best use of the afternoon, a walk. In economics, what is the opportunity cost?", "o": ["The cost of building the whole library", "The value of the walk she gives up", "Every possible activity in the town", "The enjoyment of the library visit"], "a": 1, "x": "Opportunity cost is the value of the next-best alternative given up. Here, that is the walk, rather than the chosen library visit or every other possible activity.", "s": "Federal Reserve Bank of St Louis, Opportunity cost", "u": "https://www.stlouisfed.org/open-vault/2020/march/three-ways-think-like-an-economist", "t": "Economy: choice"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
