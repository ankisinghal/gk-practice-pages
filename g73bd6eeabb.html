 normal human heart?", "o": ["Three", "Six", "Four", "Two"], "a": 2, "x": "The heart has two atria and two ventricles, making four chambers.", "s": "Britannica, checked 6 October 2026; rechecked 7 October 2026", "u": "https://www.britannica.com/science/heart", "t": "Biology"}, {"id": "Q035", "cat": "CA", "q": "The PIB announcement of 5 October placed the HAL Koraput aero-engine milestone event in which state?", "o": ["Maharashtra", "Karnataka", "Tamil Nadu", "Odisha"], "a": 3, "x": "The announcement locates HAL Koraput Division in Odisha and schedules the 2000th aero-engine milestone event for 6 October. This question asks the location, not whether the event has finished.", "s": "PIB, 5 October 2026; rechecked 7 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2319187&lang=1&reg=3", "t": "India: industry"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
