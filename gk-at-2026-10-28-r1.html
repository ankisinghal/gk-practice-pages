overnor of an Indian state?", "o": ["The Speaker of the Lok Sabha", "The President", "The Chief Minister", "The Chief Justice of India"], "a": 1, "x": "The President appoints a state Governor. The Chief Minister heads the state Council of Ministers.", "s": "Know India, The States", "u": "https://knowindia.gov.in/profile/the-states.php", "t": "Civics: state government"}, {"id": "Q219", "cat": "GK", "q": "A farmer exchanges a bag of rice directly for a basket of vegetables, without using money. What is this exchange called?", "o": ["Barter", "Taxation", "Saving", "Credit"], "a": 0, "x": "Barter is the direct exchange of goods or services for other goods or services without money.", "s": "NCERT, From Barter to Money", "u": "https://ncert.nic.in/textbook/pdf/gees111.pdf", "t": "Everyday economy"}, {"id": "Q220", "cat": "GK", "q": "The Great Stupa at Sanchi is in which Indian state?", "o": ["Uttar Pradesh", "Bihar", "Odisha", "Madhya Pradesh"], "a": 3, "x": "Sanchi is in Raisen district, Madhya Pradesh. It is known for its ancient Buddhist stupas and other monuments.", "s": "District Raisen, Government of Madhya Pradesh", "u": "https://raisen.nic.in/en/tourist-place/sanchi/", "t": "History and culture"}, {"id": "Q224", "cat": "GK", "q": "A display about Anne Carson's 2026 Nobel award should place her in which prize category?", "o": ["Economic Sciences", "Chemistry", "Literature", "Peace"], "a": 2, "x": "The Nobel Prize website names Anne Carson as the 2026 Literature laureate in its 8 October announcement.", "s": "NobelPrize.org, 8 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/press-release/", "t": "World: literature"}, {"id": "Q225", "cat": "GK", "q": "An exhibitor makes wind turbines, gearboxes and offshore-wind equipment. Which October 2026 event in PIB's announcement best matches these products?", "o": ["International Tourism Mart 2026", "Windergy India 2026", "India Mobile Congress 2026", "World Food India 2026"], "a": 1, "x": "PIB's 5 October announcement describes Windergy India 2026 as a wind-energy trade fair, with turbine technology, gearboxes and offshore-wind exhibits.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q226", "cat": "GK", "q": "Two astronauts outside a spacecraft cannot hear each other directly through the near-vacuum of space. What is missing for ordinary sound to travel between them?", "o": ["A source of visible light", "A strong magnetic field", "A material medium", "A lower temperature"], "a": 2, "x": "Sound needs matter, such as a solid, liquid or gas, to travel. It cannot propagate through a vacuum.", "s": "NCERT, Sound Waves: Characteristics and Applications", "u": "https://ncert.nic.in/textbook/pdf/iesc110.pdf", "t": "Science: sound"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
