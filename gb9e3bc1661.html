<script>const D={"id": "gb9e3bc1661", "date": "2026-10-08", "qs": [{"id": "Q046", "cat": "CA", "q": "Who was awarded the 2026 Nobel Prize in Literature on 8 October?", "o": ["Anne Carson", "Margaret Atwood", "Haruki Murakami", "Salman Rushdie"], "a": 0, "x": "The official Nobel homepage names Canadian author Anne Carson. The announcement was also reported by BBC on 8 October.", "s": "NobelPrize.org and BBC, 8 October 2026", "u": "https://www.nobelprize.org/", "t": "World: literature"}, {"id": "Q047", "cat": "CA", "q": "The JOSH Teams initiative announced by PIB on 8 October supports efforts to eliminate which disease?", "o": ["Polio", "Malaria", "Tuberculosis", "Measles"], "a": 2, "x": "The dated health ministry release describes youth-led community action by JOSH Teams to support tuberculosis elimination.", "s": "PIB, 8 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2320653&lang=1&reg=48", "t": "India: health"}, {"id": "Q048", "cat": "CA", "q": "Which city hosts Windergy India 2026, according to the PIB announcement of 5 October?", "o": ["New Delhi", "Chennai", "Ahmedabad", "Mumbai"], "a": 1, "x": "The dated announcement places Windergy India at Chennai Trade Centre from 7 to 9 October. This question asks the venue city, not whether an inauguration has finished.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q049", "cat": "CA", "q": "What is the theme of India Mobile Congress 2026, according to PIB on 5 October?", "o": ["Adequate Housing for All", "Imagine One Asia", "Rocket Revolution", "Scale Without Boundaries"], "a": 3, "x": "The telecom ministry release gives Scale Without Boundaries as the theme of India Mobile Congress 2026.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319395&reg=48", "t": "India: technology"}, {"id": "Q050", "cat": "CA", "q": "A PIB report on 2 October described a tigress release at Buxa Tiger Reserve. In which state is Buxa?", "o": ["West Bengal", "Bihar", "Assam", "Rajasthan"], "a": 0, "x": "The dated wildlife release locates Buxa Tiger Reserve in West Bengal and describes a phased tiger reintroduction programme.", "s": "PIB, 2 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2318110&lang=1&reg=3", "t": "India: wildlife"}, {"id": "Q051", "cat": "GK", "q": "Which gas makes up the largest share of Earth's atmosphere?", "o": ["Carbon dioxide", "Oxygen", "Nitrogen", "Helium"], "a": 2, "x": "NASA describes the air mixture as about 78 percent nitrogen and 21 percent oxygen. Nitrogen therefore makes up the largest share.", "s": "NASA, checked 8 October 2026", "u": "https://science.nasa.gov/solar-system/10-things-planetary-atmospheres/", "t": "Science"}, {"id": "Q052", "cat": "GK", "q": "During evaporation, liquid water changes into what?", "o": ["Ice", "Water vapour", "Salt", "Liquid oxygen"], "a": 1, "x": "Evaporation changes water from liquid into gas at the surface. Water vapour is the gaseous form of water.", "s": "Britannica, checked 8 October 2026", "u": "https://www.britannica.com/science/evaporation", "t": "Science"}, {"id": "Q036", "cat": "CA", "q": "What was the theme of World Habitat Day on 5 October 2026?", "o": ["Clean Oceans for All", "Rocket revolution", "Digital Education for All", "Adequate Housing for All"], "a": 3, "x": "UN News reports that World Habitat Day 2026 focused on Adequate Housing for All. The commemoration took place in Muscat, Oman.", "s": "UN News, 5 October 2026; rechecked 7 October 2026; rechecked 8 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "World: cities"}, {"id": "Q037", "cat": "GK", "q": "How many chambers are in a normal human heart?", "o": ["Four", "Two", "Six", "Three"], "a": 0, "x": "The heart has two atria and two ventricles, making four chambers.", "s": "Britannica, checked 6 October 2026; rechecked 7 October 2026; rechecked 8 October 2026", "u": "https://www.britannica.com/science/heart", "t": "Biology"}, {"id": "Q035", "cat": "CA", "q": "The PIB announcement of 5 October placed the HAL Koraput aero-engine milestone event in which state?", "o": ["Tamil Nadu", "Odisha", "Maharashtra", "Karnataka"], "a": 1, "x": "The announcement locates HAL Koraput Division in Odisha and schedules the 2000th aero-engine milestone event for 6 October. This question asks the location, not whether the event has finished.", "s": "PIB, 5 October 2026; rechecked 7 October 2026; rechecked 8 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2319187&lang=1&reg=3", "t": "India: industry"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
