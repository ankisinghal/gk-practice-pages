 "x": "The Ganga, about 2,525 km long, is India's longest river. The Brahmaputra carries more water but is shorter within India.", "s": "Standard geography reference, checked 25 October 2026", "u": "https://www.jagranjosh.com/general-knowledge/longest-river-in-india-1746695506-1", "t": "Geography"}, {"id": "Q170", "cat": "GK", "q": "The Red Fort in Delhi was built by which Mughal emperor?", "o": ["Shah Jahan", "Akbar", "Aurangzeb", "Jahangir"], "a": 0, "x": "UNESCO describes the Red Fort Complex as the palace fort of Shahjahanabad, the new capital of the fifth Mughal emperor Shah Jahan, built from 1639 onwards.", "s": "UNESCO World Heritage Centre, checked 25 October 2026", "u": "https://whc.unesco.org/en/list/231/", "t": "History and culture"}, {"id": "Q171", "cat": "GK", "q": "How many Fundamental Rights does the Constitution of India guarantee today?", "o": ["Five", "Eight", "Seven", "Six"], "a": 3, "x": "Part III of the Constitution guarantees six Fundamental Rights: equality, freedom, against exploitation, freedom of religion, cultural and educational rights, and constitutional remedies. The right to property was removed from the list in 1978.", "s": "Constitution of India Part III reference, checked 25 October 2026", "u": "https://en.wikipedia.org/wiki/Fundamental_rights_in_India", "t": "Civics"}, {"id": "Q172", "cat": "GK", "q": "In which city is the headquarters of the Reserve Bank of India?", "o": ["Kolkata", "Chennai", "Mumbai", "New Delhi"], "a": 2, "x": "The RBI was established on 1 April 1935 and its central office is in Mumbai. It began in Kolkata and moved to Mumbai in 1937.", "s": "Reserve Bank of India, About Us, checked 25 October 2026", "u": "https://www.rbi.org.in/Scripts/AboutusDisplay.aspx", "t": "Economy"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
