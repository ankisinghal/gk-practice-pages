vices and decisions about mental health care.", "s": "WHO, World Mental Health Day 2026", "u": "https://www.who.int/campaigns/world-mental-health-day/2026", "t": "World: health"}, {"id": "Q087", "cat": "CA", "q": "In which city were electric buses flagged off and new air-quality monitoring stations inaugurated on 13 October 2026?", "o": ["Hyderabad", "Mumbai", "Bengaluru", "Delhi"], "a": 3, "x": "PIB reported the bus flag-off at Anand Vihar and the inauguration of air-quality monitoring stations across Delhi on 13 October.", "s": "PIB, 13 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2322719&lang=2&reg=48", "t": "India: environment"}, {"id": "Q088", "cat": "GK", "q": "The stratospheric ozone layer protects life mainly by absorbing which radiation from the Sun?", "o": ["Microwaves", "Infrared", "Ultraviolet", "Radio waves"], "a": 2, "x": "Stratospheric ozone absorbs harmful ultraviolet radiation. It does not block all sunlight.", "s": "Britannica, checked 13 October 2026", "u": "https://www.britannica.com/science/ozone-layer", "t": "Science and environment"}, {"id": "Q089", "cat": "GK", "q": "The Ganges-Brahmaputra delta opens into which body of water?", "o": ["Gulf of Kachchh", "Arabian Sea", "Bay of Bengal", "Gulf of Mannar"], "a": 2, "x": "The Ganges and Brahmaputra reach the Bay of Bengal through their delta. The Arabian Sea lies on the other side of India.", "s": "Britannica, checked 13 October 2026", "u": "https://www.britannica.com/place/Ganges-River", "t": "Geography"}, {"id": "Q090", "cat": "GK", "q": "Which feature is strongly associated with the cities of the Indus civilization?", "o": ["Gothic church spires", "Marble imperial tombs", "Rock-cut prayer halls", "Brick drains and baths"], "a": 3, "x": "Indus cities such as Mohenjo-daro had brick-built bathrooms and drainage. The other features belong to much later traditions.", "s": "Britannica, checked 13 October 2026", "u": "https://www.britannica.com/place/India/The-Indus-civilization", "t": "History and culture"}, {"id": "Q091", "cat": "GK", "q": "Under Article 51A, protecting the natural environment and showing compassion for living creatures is a:", "o": ["Fundamental Duty", "Directive Principle", "Emergency Power", "Fundamental Right"], "a": 0, "x": "Article 51A(g) lists this among the Fundamental Duties of citizens. Duties, rights and Directive Principles are separate constitutional categories.", "s": "Constitution of India, Article 51A", "u": "https://cdnbbsr.s3waas.gov.in/s35b3b68ffd8758e8114d7df1efa4ac376/uploads/2025/07/202507252048725343.pdf", "t": "Civics"}, {"id": "Q092", "cat": "GK", "q": "Which instrument would you use to check whether a liquid has become hotter?", "o": ["Thermometer", "Anemometer", "Hydrometer", "Barometer"], "a": 0, "x": "A thermometer measures temperature. A hydrometer measures relative density, a barometer pressure and an anemometer wind speed.", "s": "Britannica, checked 13 October 2026", "u": "https://www.britannica.com/technology/thermometer", "t": "Science: instruments"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
