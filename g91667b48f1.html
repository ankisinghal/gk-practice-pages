<script>const D={"id": "g91667b48f1", "date": "2026-10-03", "qs": [{"id": "Q001", "cat": "CA", "q": "India won the men's cricket gold at the 2026 Asian Games in Japan. Which team did India beat in the final on 3 October 2026?", "o": ["Afghanistan", "Pakistan", "Sri Lanka", "Bangladesh"], "a": 1, "x": "India made 211-6 and won the final in Nagoya by 19 runs after Pakistan finished on 192-6. It was India's second Asian Games men's gold in a row.", "s": "BBC Sport, 3 Oct 2026", "u": "https://www.bbc.com/sport/cricket/articles/c64g1dpgg247o", "t": "Sports"}, {"id": "Q002", "cat": "CA", "q": "Which team did India beat in the women's cricket final at the 2026 Asian Games on 22 September 2026?", "o": ["Pakistan", "Japan", "Sri Lanka", "Bangladesh"], "a": 2, "x": "India won by 147 runs and kept their Asian Games gold medal. Sri Lanka took silver and Pakistan took bronze.", "s": "Al Jazeera, 22 Sep 2026", "u": "https://www.aljazeera.com/sports/liveblog/2026/9/22/india-vs-sri-lanka-live-asian-games-womens-cricket-final", "t": "Sports"}, {"id": "Q003", "cat": "CA", "q": "What is the theme of the Swachhata Hi Seva 2026 campaign?", "o": ["Clean Rivers Clean India", "Plastic Free Bharat", "Swachh Gaon Swasth Gaon", "Swachhata Mein Sahbhag"], "a": 3, "x": "The theme stresses shared ownership, youth involvement and steady cleanliness habits. The Swachh Bharat Mission began on 2 October 2014, and the campaign ended with Gandhi Jayanti and Swachh Bharat Diwas on 2 October 2026.", "s": "Press Information Bureau, 18 Sep 2026; The Tribune, 2 Oct 2026", "u": "https://www.pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=160036&lang=1&reg=3", "t": "Government"}, {"id": "Q004", "cat": "CA", "q": "Which session of the United Nations General Assembly held its high-level week in September 2026?", "o": ["81st", "79th", "80th", "82nd"], "a": 0, "x": "The 81st session of the UN General Assembly opened on 8 September 2026. Its high-level week with world leaders ran in late September in New York.", "s": "United Nations, High-level Week 2026; US State Department schedule, 21 Sep 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "World"}, {"id": "Q005", "cat": "CA", "q": "The 2026 Nobel Prize announcements start in the coming week. On which date do they begin?", "o": ["9 October", "5 October", "12 October", "1 October"], "a": 1, "x": "The announcements run from 5 to 12 October 2026. The Peace Prize is announced on 9 October.", "s": "nobelprize.org", "u": "https://www.nobelprize.org/prizes/about/prize-announcement-dates/", "t": "World"}, {"id": "Q006", "cat": "GK", "q": "Who became the first Indian to win an individual Olympic gold medal, at the 2008 Beijing Games?", "o": ["Mary Kom", "Sushil Kumar", "Leander Paes", "Abhinav Bindra"], "a": 3, "x": "Abhinav Bindra, a shooter, won India's first individual Olympic gold in Beijing in 2008.", "s": "Olympics.com", "u": "https://www.olympics.com/en/news/india-s-first-individual-gold-medal", "t": "Sports"}, {"id": "Q007", "cat": "GK", "q": "In which year did India's Chandrayaan-3 lander soft-land on the Moon?", "o": ["2021", "2019", "2023", "2025"], "a": 2, "x": "Chandrayaan-3 soft-landed on the Moon on 23 August 2023.", "s": "ISRO", "u": "https://www.isro.gov.in/Chandrayaan3.html", "t": "Science and space"}, {"id": "Q008", "cat": "GK", "q": "On which date did the Constitution of India come into effect?", "o": ["26 November 1949", "26 January 1950", "15 August 1947", "2 October 1950"], "a": 1, "x": "The Constitution came into effect on 26 January 1950, which India celebrates as Republic Day. It was adopted earlier, on 26 November 1949.", "s": "Britannica", "u": "https://www.britannica.com/topic/Constitution-of-India", "t": "Civics"}, {"id": "Q009", "cat": "GK", "q": "Which is the largest planet in our solar system?", "o": ["Saturn", "Neptune", "Jupiter", "Earth"], "a": 2, "x": "Jupiter is the largest planet. About 1,000 Earths could fit inside it.", "s": "NASA", "u": "https://science.nasa.gov/jupiter/jupiter-facts/", "t": "Science and space"}, {"id": "Q010", "cat": "GK", "q": "Which planet is often called the Red Planet?", "o": ["Mars", "Mercury", "Venus", "Jupiter"], "a": 0, "x": "Mars looks red because iron minerals in its soil and dust have rusted.", "s": "NASA", "u": "https://science.nasa.gov/mars/facts/", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
