l honour on 8 October 2026?", "o": ["The Booker Prize", "The Pulitzer Prize for Fiction", "The Sahitya Akademi Award", "The Nobel Prize in Literature"], "a": 3, "x": "The official Nobel homepage names Canadian author Anne Carson as the 2026 Nobel Prize in Literature laureate, announced 8 October.", "s": "NobelPrize.org and BBC, 8 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/summary/", "t": "World: literature"}, {"id": "Q177", "cat": "CA", "q": "Chennai Trade Centre was the venue of which wind-energy trade fair announced for 7 to 9 October 2026?", "o": ["Green Energy Corridor Expo", "India Mobile Congress 2026", "World Food India 2026", "Windergy India 2026"], "a": 3, "x": "The PIB announcement placed Windergy India 2026 at Chennai Trade Centre from 7 to 9 October. The question asks the fair's name, not its outcome.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/", "t": "India: energy"}, {"id": "Q178", "cat": "CA", "q": "The National Maritime Heritage Complex is coming up at which ancient Harappan port town in Gujarat?", "o": ["Lothal", "Kalibangan", "Dholavira", "Ropar"], "a": 0, "x": "The PIB lighthouse feature locates the planned National Maritime Heritage Complex at Lothal, the ancient Harappan port in Gujarat. Dholavira, Kalibangan and Ropar are other Harappan sites, not the NMHC location.", "s": "PIB, 10 October 2026", "u": "https://www.pib.gov.in/", "t": "India: heritage"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
