kids.nasa.gov/whats-in-the-atmosphere/", "t": "Physical geography"}, {"id": "Q632", "cat": "GK", "q": "Which charter did King John of England grant in 1215 after pressure from rebel barons?", "o": ["Magna Carta", "Bill of Rights", "Petition of Right", "Act of Settlement"], "a": 0, "x": "King John granted Magna Carta in 1215. It addressed grievances against his rule and became important in the history of limits on royal power.", "s": "UK Parliament, 1215 Magna Carta", "u": "https://www.parliament.uk/about/living-heritage/evolutionofparliament/2015-parliament-in-the-making/get-involved1/2015-banners-exhibition/ruth-ewan/1215-magna-carta-gallery/", "t": "History: law"}, {"id": "Q633", "cat": "GK", "q": "Which Mughal emperor built Fatehpur Sikri as an imperial capital in the 1500s?", "o": ["Akbar", "Babur", "Shah Jahan", "Humayun"], "a": 0, "x": "UNESCO identifies Akbar as the emperor who built Fatehpur Sikri in the second half of the sixteenth century.", "s": "UNESCO World Heritage, Fatehpur Sikri", "u": "https://whc.unesco.org/en/list/255/", "t": "History and culture: India"}, {"id": "Q634", "cat": "GK", "q": "In a repo transaction, a security is sold with an agreement to do what at a later date?", "o": ["Replace it with ordinary shares", "Repurchase the security", "Cancel the security entirely", "Convert it into banknotes"], "a": 1, "x": "A repo is a sale of securities with an agreement to repurchase them at a predetermined date and rate. It provides collateralised short-term borrowing; no current interest rate is being asked.", "s": "Reserve Bank of India, Repo report", "u": "https://m.rbi.org.in/Scripts/PublicationReportDetails.aspx?ID=34", "t": "Economy: banking"}, {"id": "Q635", "cat": "CA", "q": "Which phrase completes the UN's World Habitat Day 2026 theme: \"Adequate _____ for All\"?", "o": ["Nutrition", "Transport", "Schooling", "Housing"], "a": 3, "x": "The United Nations named Adequate Housing for All as the 2026 World Habitat Day theme.", "s": "United Nations, World Habitat Day 2026", "u": "https://www.un.org/en/observances/habitat-day", "t": "Review: cities"}, {"id": "Q636", "cat": "CA", "q": "Choose the correct pairing for the General Assembly high-level week held in September 2026.", "o": ["2026 - 79th session", "2026 - 81st session", "2026 - 80th session", "2026 - 82nd session"], "a": 1, "x": "The UN's High-level Week 2026 page identifies the gathering as part of the 81st session of the General Assembly.", "s": "United Nations, High-level Week 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "Review: United Nations"}, {"id": "Q637", "cat": "CA", "q": "Which satellite links the date 4 October 1957 to the opening date of World Space Week?", "o": ["Vanguard 1", "Aryabhata", "Sputnik 1", "Explorer 1"], "a": 2, "x": "The launch of Sputnik 1, the first human-made Earth satellite, took place on 4 October 1957. World Space Week begins on that anniversary.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Review: space history"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
