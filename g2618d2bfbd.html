lephant", "Blue whale"], "a": 3, "x": "The blue whale is the largest mammal - and the largest animal known to have lived on Earth.", "s": "Britannica, checked 27 October 2026", "u": "https://www.britannica.com/animal/blue-whale", "t": "Animals"}, {"id": "Q203", "cat": "GK", "q": "The original Sanskrit epic Ramayana was composed by which sage?", "o": ["Valmiki", "Tulsidas", "Ved Vyasa", "Kalidasa"], "a": 0, "x": "Valmiki composed the Sanskrit Ramayana. Ved Vyasa is linked with the Mahabharata and Tulsidas wrote the later Ramcharitmanas.", "s": "Britannica, checked 27 October 2026", "u": "https://www.britannica.com/topic/Ramayana", "t": "History and culture"}, {"id": "Q204", "cat": "GK", "q": "Which is the smallest state of India by area?", "o": ["Sikkim", "Goa", "Manipur", "Tripura"], "a": 1, "x": "Goa is India's smallest state by area (about 3,702 square kilometres).", "s": "Britannica, checked 27 October 2026", "u": "https://www.britannica.com/place/Goa", "t": "Geography: India"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
