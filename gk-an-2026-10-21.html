ame India's national anthem?", "o": ["Bankim Chandra Chattopadhyay", "Subhas Chandra Bose", "Sarojini Naidu", "Rabindranath Tagore"], "a": 3, "x": "Rabindranath Tagore wrote 'Jana Gana Mana', adopted as the national anthem. Bankim Chandra Chattopadhyay wrote 'Vande Mataram', the national song.", "s": "india.gov.in, national symbols", "u": "https://www.india.gov.in/india-glance/national-symbols", "t": "History and culture"}, {"id": "Q126", "cat": "GK", "q": "Who won India's first individual Olympic gold medal?", "o": ["Milkha Singh", "Abhinav Bindra", "Leander Paes", "Major Dhyan Chand"], "a": 1, "x": "Abhinav Bindra won the men's 10 metre air rifle event at the Beijing 2008 Olympics, India's first individual gold.", "s": "Olympics.com, Abhinav Bindra", "u": "https://www.olympics.com/en/athletes/abhinav-bindra", "t": "Sports"}, {"id": "Q127", "cat": "GK", "q": "Which institution has the sole right to issue currency notes in India?", "o": ["State Bank of India", "Ministry of Finance", "Reserve Bank of India", "NITI Aayog"], "a": 2, "x": "The Reserve Bank of India is the sole authority for issuing currency notes, except the one-rupee note issued by the Government of India.", "s": "Reserve Bank of India, currency management", "u": "https://www.rbi.org.in/commonperson/English/Scripts/Currency.aspx", "t": "Economy"}, {"id": "Q097", "cat": "GK", "q": "The Ajanta cave temples in Maharashtra are celebrated chiefly as monuments of which religion?", "o": ["Buddhism", "Hinduism", "Jainism", "Islam"], "a": 0, "x": "Ajanta's rock-cut caves are Buddhist temples and monasteries famous for their paintings. They are not mainly Hindu, Jain or Sikh sites.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/place/Ajanta-Caves", "t": "History and culture"}, {"id": "Q095", "cat": "GK", "q": "As air is pumped out of a jar, a ringing bell inside grows fainter. What does this show?", "o": ["Sound travels faster in a vacuum", "Light needs air to move", "Air always makes sound louder", "Sound needs a material medium"], "a": 3, "x": "Sound is a vibration carried by matter. Removing the air removes the medium, so less sound reaches the ear.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/science/sound-physics", "t": "Science"}, {"id": "Q072", "cat": "GK", "q": "In the human circulatory system, which organ works as the pump that moves blood?", "o": ["Lungs", "Liver", "Heart", "Stomach"], "a": 2, "x": "The heart is the muscular pump of the circulatory system. The lungs add oxygen to blood but do not pump it around the body.", "s": "Britannica, checked 11 October 2026", "u": "https://www.britannica.com/science/heart", "t": "Science"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
