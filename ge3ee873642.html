<h1>General awareness practice ge3ee873642</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "ge3ee873642", "date": "2026-10-07", "qs": [{"id": "Q039", "cat": "CA", "q": "Which pair received the 2026 Nobel Prize in Chemistry announced on 7 October?", "o": ["Henri B. Kagan and Kenso Soai", "Francis Halzen and Peter Hegemann", "Emmanuelle Charpentier and Jennifer Doudna", "Karl Deisseroth and Georg Nagel"], "a": 0, "x": "The official Nobel announcement names Henri B. Kagan and Kenso Soai for discoveries about non-linear effects and autocatalysis in asymmetric organic synthesis.", "s": "Nobel Academy, 7 October 2026", "u": "https://www.nobelprize.org/prizes/chemistry/2026/press-release/", "t": "World: science"}, {"id": "Q040", "cat": "CA", "q": "What is the name of the first indigenous Fleet Support Ship launched at Hindustan Shipyard in Visakhapatnam on 6 October 2026?", "o": ["Arihant", "Vikrant", "Surya", "Vikramaditya"], "a": 2, "x": "The 6 October report names the Fleet Support Ship Surya. The question asks the name, not its operational service status.", "s": "The Print, 6 October 2026; PIB release list, checked 7 October", "u": "https://theprint.in/defence/hindustan-shipyard-delivers-surya-1st-of-5-logistics-vessels-to-boost-navys-high-seas-endurance/3063366/", "t": "India: maritime"}, {"id": "Q041", "cat": "CA", "q": "What was the official slogan of the 2026 Asian Games in Aichi-Nagoya, according to PIB on 6 October?", "o": ["Faster Together", "Imagine One Asia", "United by Emotion", "One World One Dream"], "a": 1, "x": "The PIB overview dated 6 October identifies Imagine One Asia as the official slogan of the Aichi-Nagoya 2026 Asian Games.", "s": "PIB, 6 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2319703&lang=1&reg=3", "t": "Sports"}, {"id": "Q042", "cat": "CA", "q": "The PIB factsheet of 17 September 2026 describes ECMS as a scheme supporting manufacturing of what?", "o": ["Agricultural fertilisers", "Railway coaches", "Cotton clothing", "Electronic components"], "a": 3, "x": "ECMS means Electronics Components Manufacturing Scheme. The dated factsheet describes support for India's electronic-component production.", "s": "PIB, 17 September 2026", "u": "https://www.pib.gov.in/FactsheetDetails.aspx?Id=151016&lang=1&reg=3+", "t": "India: manufacturing"}, {"id": "Q043", "cat": "CA", "q": "The El Nino pattern discussed by UN News on 6 October is linked to unusual warming in which ocean?", "o": ["Pacific Ocean", "Indian Ocean", "Atlantic Ocean", "Arctic Ocean"], "a": 0, "x": "UN News describes the El Nino pattern in the tropical Pacific and how it can change rainfall far away. This question does not ask for a forecast outcome.", "s": "UN News, 6 October 2026", "u": "https://news.un.org/en/story/2026/10/1168537", "t": "World: climate"}, {"id": "Q044", "cat": "GK", "q": "The femur is the bone in which part of the human body?", "o": ["Chest", "Forearm", "Thigh", "Skull"], "a": 2, "x": "The femur is the upper leg bone, joining the hip and knee.", "s": "Britannica, checked 7 October 2026", "u": "https://www.britannica.com/science/femur", "t": "Biology"}, {"id": "Q045", "cat": "GK", "q": "Which gas do green plants use from the air during photosynthesis?", "o": ["Hydrogen", "Carbon dioxide", "Helium", "Neon"], "a": 1, "x": "Photosynthesis uses carbon dioxide and water, with light energy, to produce sugars and release oxygen.", "s": "Britannica, checked 7 October 2026", "u": "https://www.britannica.com/science/photosynthesis", "t": "Science"}, {"id": "Q026", "cat": "CA", "q": "According to the PIB update of 4 October 2026, how many supercomputers had India deployed under the National Supercomputing Mission by September 2026?", "o": ["14", "68", "100", "40"], "a": 3, "x": "The dated PIB update reports 40 deployed supercomputers with a combined capacity of 68 petaflops as of September 2026. The count and capacity are different measures.", "s": "PIB, 4 October 2026; rechecked 6 October 2026; rechecked 7 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10085_20261004_17525901.pdf", "t": "India: science"}, {"id": "Q032", "cat": "CA", "q": "Which observatory is named in the citation for the 2026 Nobel Prize in Physics announced on 6 October?", "o": ["IceCube Neutrino Observatory", "Hubble Space Telescope", "James Webb Space Telescope", "LIGO Observatory"], "a": 0, "x": "The Nobel citation recognises Francis Halzen for his contributions to IceCube and the discovery of high-energy neutrinos from astrophysical sources.", "s": "Nobel Academy, 6 October 2026; rechecked 7 October 2026", "u": "https://www.nobelprize.org/prizes/physics/2026/press-release/", "t": "World: science"}, {"id": "Q033", "cat": "CA", "q": "The Green Energy Corridor Phase-III scheme approved on 30 September 2026 mainly strengthens transmission for which type of energy?", "o": ["Coal mining", "Renewable energy", "Diesel road transport", "Petrol refining"], "a": 1, "x": "The PIB release says the scheme strengthens intra-state transmission so electricity from renewable sources can reach the grid.", "s": "PIB, 30 September 2026; rechecked 7 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2316950&lang=1&reg=3", "t": "India: energy"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
