<h1>General awareness practice ge78c5b5d6e</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "ge78c5b5d6e", "date": "2026-10-16", "qs": [{"id": "Q107", "cat": "CA", "q": "Whose birth anniversary did President Droupadi Murmu mark with floral tributes on 15 October 2026?", "o": ["Varahagiri Venkata Giri", "Rajendra Prasad", "Sarvepalli Radhakrishnan", "A. P. J. Abdul Kalam"], "a": 3, "x": "The President's official photo record identifies the tribute at Vijayawada on 15 October 2026 as one to former President A. P. J. Abdul Kalam.", "s": "President's Secretariat, 15 October 2026", "u": "https://dpl.rashtrapatibhavan.gov.in/view_datails/Mjk5NDI=", "t": "India: public life"}, {"id": "Q108", "cat": "CA", "q": "On which date did the UN mark the International Day of Rural Women in 2026?", "o": ["5 October", "15 October", "24 October", "11 October"], "a": 1, "x": "UN Women's statement of 13 October identifies the International Day of Rural Women as 15 October 2026. It recognises rural women's contributions to farming, communities and nature.", "s": "UN Women, 13 October 2026", "u": "https://www.unwomen.org/en/news-stories/statement/2026/10/un-women-statement-for-the-international-day-of-rural-women-15-october-2026", "t": "World: observances"}, {"id": "Q109", "cat": "GK", "q": "At standard sea-level atmospheric pressure, what is the approximate boiling point of pure water?", "o": ["75 degrees Celsius", "125 degrees Celsius", "100 degrees Celsius", "50 degrees Celsius"], "a": 2, "x": "Water boils at about 100 degrees Celsius at standard sea-level pressure. Its boiling point is lower at higher altitudes because the pressure is lower.", "s": "Britannica, boiling point", "u": "https://www.britannica.com/science/boiling-point", "t": "Science"}, {"id": "Q110", "cat": "GK", "q": "The Prime Meridian is the reference line for which value?", "o": ["180 degrees longitude", "0 degrees latitude", "90 degrees latitude", "0 degrees longitude"], "a": 3, "x": "A prime meridian is chosen as zero degrees longitude. Zero degrees latitude is the Equator. The historic Greenwich line and modern satellite reference meridian are slightly apart.", "s": "Royal Museums Greenwich, Prime Meridian", "u": "https://www.rmg.co.uk/stories/time/what-prime-meridian-why-it-greenwich", "t": "Geography"}, {"id": "Q111", "cat": "GK", "q": "The 1930 Dandi March challenged British laws controlling which everyday product?", "o": ["Cotton", "Tea", "Salt", "Sugar"], "a": 2, "x": "Gandhi and his followers went to Dandi and broke the British salt law by collecting salt. The march was part of civil disobedience against colonial rule.", "s": "Britannica, Salt March", "u": "https://www.britannica.com/event/Salt-March", "t": "History and culture"}, {"id": "Q112", "cat": "GK", "q": "Which institution is at the top of India's judicial system?", "o": ["Supreme Court", "High Court", "Sessions Court", "District Court"], "a": 0, "x": "The Supreme Court of India is the apex judicial body under the Constitution. High Courts and district-level courts are below it in the judicial system.", "s": "Supreme Court of India, history", "u": "https://www.sci.gov.in/about-department/history/", "t": "Civics"}, {"id": "Q113", "cat": "GK", "q": "Which sport uses a shuttlecock rather than a ball during play?", "o": ["Table tennis", "Badminton", "Lawn tennis", "Squash"], "a": 1, "x": "Badminton players hit a shuttlecock across a net with lightweight rackets. The other listed sports use balls.", "s": "Britannica, badminton", "u": "https://www.britannica.com/sports/badminton", "t": "Sports"}, {"id": "Q094", "cat": "CA", "q": "The World Food Day global ceremony announced for 16 October 2026 was to take place at which UN agency's headquarters?", "o": ["UNESCO", "WHO", "WFP", "FAO"], "a": 3, "x": "FAO's announcement locates its World Food Day ceremony at FAO headquarters. This uses the announced arrangement, not a claim that the event finished.", "s": "FAO, World Food Day 2026", "u": "https://www.fao.org/webcast/detail/world-food-day-ceremony/en", "t": "World: food"}, {"id": "Q098", "cat": "GK", "q": "A civics class lists national bodies and their constitutional work. Which one is assigned control of elections to Parliament under Article 324?", "o": ["Election Commission", "Finance Commission", "National Human Rights Commission", "Public Service Commission"], "a": 0, "x": "Article 324 vests superintendence, direction and control over parliamentary elections in the Election Commission.", "s": "Constitution of India, Article 324", "u": "https://indiacode.ecourtsindia.com/constitution-of-india/article/324/", "t": "Civics"}, {"id": "Q089", "cat": "GK", "q": "After crossing Bangladesh, water from the Ganges-Brahmaputra delta reaches which bay?", "o": ["Bay of Biscay", "Hudson Bay", "Bay of Bengal", "James Bay"], "a": 2, "x": "The Ganges-Brahmaputra river system drains through its delta into the Bay of Bengal, on the eastern side of the Indian subcontinent.", "s": "Britannica, Ganges River", "u": "https://www.britannica.com/place/Ganges-River", "t": "Geography"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
