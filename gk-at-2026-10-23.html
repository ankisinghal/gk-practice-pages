tion of AUSTRAHIND runs from 19 October to 1 November 2026 at Thiruvananthapuram, Kerala, with about 240 personnel from India and Australia. Reported 19 October 2026.", "s": "Press Information Bureau, 19 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2325246&lang=1&reg=3", "t": "India: international exercise"}, {"id": "Q131", "cat": "GK", "q": "Which star is nearest to the Earth?", "o": ["Mars", "The Sun", "Polaris", "The Moon"], "a": 1, "x": "The Sun is our nearest star, about 150 million kilometres away. The Moon is not a star, and Mars is a planet.", "s": "Britannica, Sun", "u": "https://www.britannica.com/place/Sun", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
