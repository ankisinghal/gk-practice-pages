<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>General awareness practice</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "g118136e2ab", "date": "2026-11-17", "qs": [{"id": "G01", "cat": "GK", "q": "A caption says, 'New Guinea is the world's largest island, excluding continents.' Which island name should replace New Guinea to correct it?", "o": ["Madagascar", "Greenland", "Borneo", "Great Britain"], "a": 1, "x": "Greenland is the world's largest island when continental landmasses are excluded. New Guinea is not the correct name for this distinction.", "s": "Britannica: largest islands", "u": "https://kids.britannica.com/scholars/article/The-Largest-Islands-in-the-World/649276", "t": "", "role": "review"}, {"id": "G02", "cat": "GK", "q": "A middle-ear model labels the stapes as the 'anvil'. Which everyday name should replace 'anvil' on that label?", "o": ["Eardrum", "Anvil", "Stirrup", "Hammer"], "a": 2, "x": "The stapes is also called the stirrup. This identifies the same middle-ear bone using its everyday name.", "s": "NIH NIDCD: middle-ear bones", "u": "https://www.nidcd.nih.gov/health/otosclerosis", "t": "", "role": "review"}, {"id": "G03", "cat": "GK", "q": "Complete this bird fact file: HUMMINGBIRD. Distinctive powered-flight ability: ___.", "o": ["Moving backward only by swimming", "Moving backward only by walking", "Flying forward but never backward", "Flying backward under its own power"], "a": 3, "x": "Hummingbirds can fly backward under their own power. The fact file reverses the usual question: it gives the bird and asks for its flight ability.", "s": "Britannica: hummingbird", "u": "https://kids.britannica.com/students/article/hummingbird/274986", "t": "", "role": "review"}, {"id": "G04", "cat": "CA", "q": "WHO lists World AMR Awareness Week for 18-24 November 2026. What does the campaign mainly address?", "o": ["Exposure to loud workplace noise", "Resistance to antimicrobial medicines", "Shortages of blood donations", "Deficiencies of dietary vitamins"], "a": 1, "x": "World AMR Awareness Week addresses antimicrobial resistance: microbes no longer responding to medicines intended to control them. WHO lists the 2026 campaign for 18-24 November.", "s": "WHO: World AMR Awareness Week 2026", "u": "https://www.who.int/news-room/events/detail/2026/11/18/default-calendar/world-amr-awareness-week-2026", "t": "", "role": "fresh_ca"}, {"id": "G05", "cat": "CA", "q": "Children closed a UN-supported tolerance forum in Muscat on 16 November 2026. Muscat is the capital of which country?", "o": ["Kuwait", "Jordan", "Oman", "Bahrain"], "a": 2, "x": "UN News reported the close of the Muscat Plan of Action Forum on 16 November 2026 in Muscat, the capital of Oman.", "s": "UN News: Muscat forum, 16 Nov 2026", "u": "https://news.un.org/en/story/2026/11/1168820", "t": "", "role": "fresh_ca"}, {"id": "G06", "cat": "GK", "q": "An object in water feels an upward buoyant force equal to the weight of the water it displaces. Which principle describes this?", "o": ["Huygens' principle", "Pascal's principle", "Bernoulli's principle", "Archimedes' principle"], "a": 3, "x": "Archimedes' principle relates buoyant force to the weight of displaced fluid. Water is a fluid, so the principle applies to the object described.", "s": "Britannica: Archimedes' principle", "u": "https://kids.britannica.com/students/article/Archimedes-principle/599600", "t": "", "role": "fresh_gk"}, {"id": "G07", "cat": "GK", "q": "A Deccan farmer grows cotton in a region known for its cotton-growing soil. Which soil type is the standard match?", "o": ["Black soil", "Mountain soil", "Desert soil", "Laterite soil"], "a": 0, "x": "NCERT describes cotton as growing well in the black cotton soil of the Deccan plateau.", "s": "NCERT: Contemporary India II, Agriculture", "u": "https://ncert.nic.in/textbook/pdf/jess104.pdf", "t": "", "role": "fresh_gk"}, {"id": "G08", "cat": "GK", "q": "China's famous buried army of life-size terra-cotta soldiers guards the tomb complex of which emperor?", "o": ["Qin Shi Huang", "Emperor Kangxi", "Emperor Hongwu", "Kublai Khan"], "a": 0, "x": "The terra-cotta army was made for the tomb complex of Qin Shi Huang, the first Qin emperor, near Xi'an in China.", "s": "Britannica: terra-cotta army", "u": "https://kids.britannica.com/scholars/article/terra-cotta-army/634583", "t": "", "role": "fresh_gk"}, {"id": "G09", "cat": "GK", "q": "Which writ orders that an arrested person be brought before the court so the detention can be examined?", "o": ["Mandamus", "Quo warranto", "Prohibition", "Habeas corpus"], "a": 3, "x": "Habeas corpus requires the arrested person to be presented before the court. The court can examine whether the detention is lawful.", "s": "NCERT: Rights in the Indian Constitution", "u": "https://ncert.nic.in/textbook/pdf/keps202.pdf", "t": "", "role": "fresh_gk"}, {"id": "G10", "cat": "GK", "q": "In standard chess, castling combines a move of the king with a move of which other piece of the same colour?", "o": ["Bishop", "Rook", "Knight", "Queen"], "a": 1, "x": "Under FIDE's laws, castling is a move involving the king and a rook of the same colour. It counts as one move of the king and is legal only when its conditions are met.", "s": "FIDE Laws of Chess, article 3.8.2", "u": "https://handbook.fide.com/chapter/e012023", "t": "", "role": "fresh_gk"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const button=document.getElementById("copy");const code=document.getElementById("code");try{await navigator.clipboard.writeText(code.textContent);button.textContent="Copied"}catch(error){const range=document.createRange();range.selectNodeContents(code);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);button.textContent="Copy failed - code selected. Copy manually"}};
</script></body></html>
