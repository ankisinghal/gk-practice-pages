<script>const D={"id": "gb44d9ff35e", "date": "2026-10-29", "qs": [{"id": "Q230", "cat": "CA", "q": "Under the Central Motor Vehicles Rules amendment notified in October 2026, flex-fuel vehicles may be certified for a fuel consisting of 100% ethanol. What is that fuel called?", "o": ["B20", "E100", "E85", "E20"], "a": 1, "x": "The MoRTH amendment notified on 26 October 2026 adds E100 (fuel comprising 100% ethanol) alongside E85 (up to 85% ethanol) in the Rule 115 certification tables. E20 is the ordinary petrol blend; B20 is a biodiesel blend.", "s": "The Hindu, 26 Oct 2026", "u": "https://www.thehindu.com/news/national/government-amends-motor-vehicle-rules-to-permit-pure-ethanol-flex-fuel-vehicles/article71626824.ece", "t": "India: energy"}, {"id": "Q231", "cat": "CA", "q": "The 12th BRICS Parliamentary Forum, which adopted a Joint Declaration in October 2026, was hosted by which city?", "o": ["Beijing", "Cape Town", "New Delhi", "Moscow"], "a": 2, "x": "The forum met in New Delhi on 26-27 October 2026 and adopted a Joint Declaration on people-centric development and global governance.", "s": "PIB Joint Declaration, 27 Oct 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10279_20261027_16361601.pdf", "t": "World: diplomacy"}, {"id": "Q242", "cat": "GK", "q": "Which animal is the national animal of India?", "o": ["Tiger", "Lion", "Peacock", "Elephant"], "a": 0, "x": "Know India, the Government of India portal, says the tiger's combination of grace, strength, agility and power has earned it the place of national animal of India. The peacock is the national bird, a different symbol.", "s": "Know India (Government of India), checked 29 October 2026", "u": "https://knowindia.india.gov.in/national-identity-elements/national-animal.php", "t": "India: symbols"}, {"id": "Q243", "cat": "GK", "q": "Which is the largest animal on Earth?", "o": ["Great white shark", "Blue whale", "African elephant", "Giraffe"], "a": 1, "x": "Britannica identifies the blue whale as the largest animal on Earth, reaching up to about 30 metres. The African elephant is the largest land animal, not the largest overall.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/animal/blue-whale", "t": "Animals and nature"}, {"id": "Q244", "cat": "GK", "q": "Which metal is liquid at room temperature?", "o": ["Copper", "Mercury", "Iron", "Aluminium"], "a": 1, "x": "Britannica notes mercury is the only elemental metal that is liquid at room temperature. Iron, copper and aluminium are solids under ordinary conditions.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/science/mercury-chemical-element", "t": "Science: chemistry"}, {"id": "Q232", "cat": "GK", "q": "Which town is the southernmost tip of the Indian mainland?", "o": ["Puducherry", "Rameswaram", "Thiruvananthapuram", "Kanyakumari"], "a": 3, "x": "Kanyakumari in Tamil Nadu is the mainland's southernmost tip, where the Bay of Bengal, the Indian Ocean and the Arabian Sea meet. Indira Point in the Andaman Islands lies farther south but is not on the mainland.", "s": "Britannica", "u": "https://www.britannica.com/place/Kanyakumari", "t": "Geography"}, {"id": "Q233", "cat": "GK", "q": "Who was the first Prime Minister of independent India?", "o": ["Sardar Vallabhbhai Patel", "Rajendra Prasad", "Jawaharlal Nehru", "Lal Bahadur Shastri"], "a": 2, "x": "Nehru took office on 15 August 1947 and remained Prime Minister until his death in 1964. Rajendra Prasad was the first President; Shastri was the second Prime Minister.", "s": "Britannica", "u": "https://www.britannica.com/biography/Jawaharlal-Nehru", "t": "History"}, {"id": "Q234", "cat": "GK", "q": "Every morning, a Delhi school assembly sings Jana Gana Mana. Who wrote the words of this song?", "o": ["Rabindranath Tagore", "Sarojini Naidu", "Muhammad Iqbal", "Bankim Chandra Chatterjee"], "a": 0, "x": "Tagore wrote Jana Gana Mana; the assembly song is India's national anthem. Bankim Chandra Chatterjee wrote Vande Mataram, a different national song.", "s": "Know India (Government of India)", "u": "https://knowindia.india.gov.in/hindi/national-identity-elements/national-anthem.php", "t": "History and culture"}, {"id": "Q235", "cat": "CA", "q": "A student designing a poster for World Space Week 2026 (4-10 October) looks up the year's official theme. What is it?", "o": ["Oceans of the future", "Digital frontiers", "Rocket revolution", "Journey to the poles"], "a": 2, "x": "UN News on 4 October named Rocket revolution as the World Space Week 2026 theme, about changes in how people reach space - the theme for the poster.", "s": "UN News, 4 October 2026", "u": "https://news.un.org/en/story/2026/10/1168517", "t": "World: space"}, {"id": "Q236", "cat": "GK", "q": "In his rock edicts, Ashoka expresses deep remorse over the suffering caused by one of his own conquests, after which he turned to dharma. Which conquest?", "o": ["Buxar", "Panipat", "Plassey", "Kalinga"], "a": 3, "x": "The edicts describe Ashoka's remorse after conquering Kalinga; Plassey, Panipat and Buxar were fought many centuries later.", "s": "Britannica", "u": "https://www.britannica.com/biography/Ashoka", "t": "History"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
