<script>const D={"id": "ge2cac2f644", "date": "2026-11-03", "qs": [{"id": "Q346", "cat": "CA", "q": "Which October 2026 event used the theme Scale Without Boundaries?", "o": ["World Space Week", "International Film Festival of India", "India Mobile Congress", "World Food Day"], "a": 2, "x": "The telecom ministry named Scale Without Boundaries as the India Mobile Congress 2026 theme.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319395&reg=48", "t": "India: technology"}, {"id": "Q347", "cat": "CA", "q": "Which international observance falls on 9 October and marks the founding of the Universal Postal Union?", "o": ["World Tourism Day", "World Post Day", "World Teachers' Day", "United Nations Day"], "a": 1, "x": "World Post Day is observed on 9 October, the anniversary of the Universal Postal Union's establishment in 1874.", "s": "PIB, 9 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321604&lang=1&reg=1", "t": "World: postal services"}, {"id": "Q348", "cat": "GK", "q": "Which statement correctly compares the blue whale with the African elephant?", "o": ["The whale is the largest fish; the elephant is the largest mammal.", "The blue whale is larger; the elephant is the largest land animal.", "The elephant is larger; it is the largest animal overall.", "Both are fish, but the whale is longer."], "a": 1, "x": "The blue whale is the largest animal, including mammals. The African elephant is the largest land animal. Whales are mammals, not fish.", "s": "Britannica, Blue whale", "u": "https://www.britannica.com/animal/blue-whale", "t": "Animals and nature"}, {"id": "Q333", "cat": "CA", "q": "Which country hosted the global observance of World Cities Day 2026 in Fuzhou on 31 October?", "o": ["China", "Thailand", "Japan", "Indonesia"], "a": 0, "x": "The UN named Fuzhou, China, as the host of the 2026 global observance. Its theme focused on urban regeneration and adequate housing.", "s": "United Nations, World Cities Day 2026", "u": "https://www.un.org/en/observances/cities-day", "t": "World: cities"}, {"id": "Q334", "cat": "CA", "q": "UNESCO announced which theme for the school-violence and bullying prevention day to be observed on 5 November 2026?", "o": ["Every learner safe and well: From promise to practice", "Learning for a digital future: Skills for all", "Education for a greener world: From ideas to action", "Schools without borders: A shared global classroom"], "a": 0, "x": "UNESCO announced Every learner safe and well: From promise to practice as the theme of the 5 November 2026 observance. This question concerns the announced theme, not completion of the event.", "s": "UNESCO, 2026 observance", "u": "https://www.unesco.org/en/days/against-school-violence-and-bullying", "t": "World: education"}, {"id": "Q335", "cat": "GK", "q": "Which plant tissue carries water and dissolved minerals from the roots to the rest of the plant?", "o": ["Cork", "Phloem", "Epidermis", "Xylem"], "a": 3, "x": "Xylem conducts water and dissolved minerals. Phloem mainly carries sugars made by the leaves.", "s": "Britannica, Xylem", "u": "https://www.britannica.com/science/xylem", "t": "Biology"}, {"id": "Q336", "cat": "GK", "q": "Dry ice changes directly from solid carbon dioxide to gas without becoming liquid. What is this change called?", "o": ["Melting", "Freezing", "Condensation", "Sublimation"], "a": 3, "x": "Sublimation is a direct solid-to-gas change. Dry ice provides a familiar example.", "s": "Britannica, Sublimation", "u": "https://www.britannica.com/science/sublimation-phase-change", "t": "Physics"}, {"id": "Q337", "cat": "GK", "q": "On a topographic map, a contour line joins points with the same what?", "o": ["Average rainfall over the year", "Elevation above a reference level", "Distance from the nearest town", "Amount of vegetation cover"], "a": 1, "x": "Contour lines join points of equal elevation, usually measured from mean sea level. Their spacing helps show the shape of the land.", "s": "Britannica, Contour line", "u": "https://www.britannica.com/science/contour-line", "t": "Geography"}, {"id": "Q338", "cat": "GK", "q": "The ancient Indian text Arthashastra, on statecraft and administration, is traditionally attributed to whom?", "o": ["Charaka", "Kalidasa", "Kautilya", "Panini"], "a": 2, "x": "The Arthashastra is traditionally attributed to Kautilya, also known as Chanakya. It discusses government, the economy and statecraft.", "s": "Britannica, Artha-shastra", "u": "https://www.britannica.com/topic/Artha-shastra", "t": "History and culture"}, {"id": "Q339", "cat": "GK", "q": "The famous temple at Konark was designed as the chariot of which deity?", "o": ["Ganesha, associated with beginnings", "Shiva, associated with destruction", "Vishnu, associated with preservation", "Surya, the Sun god"], "a": 3, "x": "UNESCO describes the Konark temple as a monumental representation of the chariot of Surya, the Sun god.", "s": "UNESCO World Heritage, Konark", "u": "https://whc.unesco.org/en/list/246/", "t": "History and culture"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
