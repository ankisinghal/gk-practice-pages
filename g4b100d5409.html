rgest island in the world?", "o": ["Sumatra", "Madagascar", "Borneo", "Greenland"], "a": 3, "x": "Greenland is the world's largest island. Australia is bigger but is counted as a continent, not an island.", "s": "Britannica (Greenland), rechecked 6 November 2026", "u": "https://www.britannica.com/place/Greenland", "t": "World geography"}, {"id": "Q410", "cat": "GK", "q": "The first session of the Indian National Congress was held in 1885 in which city?", "o": ["Bombay (Mumbai)", "Calcutta (Kolkata)", "Delhi", "Madras (Chennai)"], "a": 0, "x": "The first session of the Indian National Congress met in Bombay in December 1885, with 72 delegates attending.", "s": "NCERT (Modern India), rechecked 6 November 2026", "u": "https://ncert.nic.in/textbook.php", "t": "History and culture"}, {"id": "Q411", "cat": "GK", "q": "Wimbledon, the oldest tennis championship in the world, is played in which city?", "o": ["Rome", "Paris", "London", "Sydney"], "a": 2, "x": "The Wimbledon tennis championship is played every year in London, England, and is the oldest tennis tournament in the world.", "s": "Britannica (Wimbledon), rechecked 6 November 2026", "u": "https://www.britannica.com/sports/Wimbledon-Championships", "t": "Sports"}, {"id": "Q412", "cat": "GK", "q": "Kaziranga National Park in Assam is famous for protecting which animal?", "o": ["Asiatic lion", "Blackbuck", "One-horned rhinoceros", "Snow leopard"], "a": 2, "x": "Kaziranga National Park in Assam, a UNESCO World Heritage Site, is home to most of the world's one-horned rhinoceroses.", "s": "UNESCO (Kaziranga), rechecked 6 November 2026", "u": "https://whc.unesco.org/en/list/337/", "t": "Science and environment"}, {"id": "Q422", "cat": "GK", "q": "Which of these pairings of an imaginary line and its value is correct?", "o": ["Equator - 90 degrees latitude", "Prime Meridian - 0 degrees longitude", "Tropic of Cancer - 0 degrees", "Date Line - 0 degrees latitude"], "a": 1, "x": "The Prime Meridian marks 0 degrees longitude; the
