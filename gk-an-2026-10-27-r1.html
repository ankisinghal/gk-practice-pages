 "Fifth", "Second", "Fourth"], "a": 3, "x": "India finished fourth, ahead of Uzbekistan on more silver medals after both won 21 golds; China, Japan and South Korea took the top three spots.", "s": "Sportstar (The Hindu), final medal tally, 4 October 2026", "u": "https://sportstar.thehindu.com/asian-games/india-final-medal-tally-asian-games-2026-fourth-place-standings-gold-silver-bronze-count/article71542939.ece", "t": "Sports"}, {"id": "Q210", "cat": "GK", "q": "When the north pole of one magnet is brought close to the north pole of another magnet, what happens?", "o": ["They become south poles", "They pull together", "They repel each other", "They lose all magnetism"], "a": 2, "x": "Like magnetic poles repel each other; unlike poles (north and south) attract.", "s": "Britannica, checked 27 October 2026", "u": "https://www.britannica.com/science/magnetism", "t": "Physics"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
