den. LeadIT concerns the transition towards lower-carbon industry; this is the launch announcement, not a later outcome.", "s": "PIB, 17 Nov 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2337325&lang=1&reg=48", "t": "India and world: environment"}, {"id": "G05", "cat": "CA", "q": "Which theme did the United Nations list for World Science Day 2026?", "o": ["Common ground through science diplomacy", "Safer futures through clean technology", "Shared progress through open laboratories", "Better health through lifelong learning"], "a": 0, "x": "The United Nations lists the 2026 theme as Common ground through science diplomacy. The question concerns that fixed campaign theme.", "s": "United Nations, World Science Day 2026", "u": "https://www.un.org/en/observances/world-science-day", "t": "World: science"}, {"id": "G06", "cat": "GK", "q": "A conservation plan follows the Ramsar Convention. Which kind of habitat is at the centre of that treaty?", "o": ["Wetlands", "Grasslands", "Deserts", "Mountains"], "a": 0, "x": "The Convention on Wetlands provides an international framework for conserving and wisely using wetlands and their resources.", "s": "Convention on Wetlands, About", "u": "https://www.ramsar.org/about-convention-wetlands", "t": "Environment"}, {"id": "G07", "cat": "GK", "q": "Which process changes an existing rock into metamorphic rock without first melting it?", "o": ["Lava cooling on the ground surface", "Heat and pressure acting on the rock", "Magma cooling deep below the ground", "Loose sediment settling out of water"], "a": 1, "x": "Metamorphism transforms existing rock through heat, pressure or fluids without melting. Cooling molten material forms igneous rock instead.", "s": "US Geological Survey, Metamorphic rocks", "u": "https://www.usgs.gov/faqs/what-are-metamorphic-rocks", "t": "Earth science"}, {"id": "G08", "cat": "GK", "q": "Which classical dance tradition would fit an exhibition devoted to the culture of Assam?", "o": ["Kathakali", "Odissi", "Sattriya", "Bharatanatyam"], "a": 2, "x": "Sangeet Natak Akademi identifies Sattriya as a tradition of Assam and supports it through its Sattriya Kendra in Guwahati.", "s": "Sangeet Natak Akademi, Sattriya Kendra", "u": "https://www.sangeetnatak.gov.in/centres-of-the-akademi/sattriya-kendra", "t": "Culture"}, {"id": "G09", "cat": "GK", "q": "For a Lok Sabha sitting, Article 100(3) requires a quorum equal to which share of total membership?", "o": ["One-third", "One-tenth", "One-fifth", "One-fourth"], "a": 1, "x": "The Lok Sabha FAQ gives the quorum as one-tenth of the total membership. It is the minimum attendance needed to constitute a sitting.", "s": "Lok Sabha, Frequently Asked Questions", "u": "https://sansad.in/ls/faq", "t": "Civics"}, {"id": "G10", "cat": "GK", "q": "Government spending exceeds its receipts, after borrowings are excluded from receipts. What is this gap called?", "o": ["Trade deficit", "Revenue deficit", "Primary deficit", "Fiscal deficit"], "a": 3, "x": "Fiscal deficit compares total expenditure with receipts excluding borrowing. Revenue deficit uses revenue spending and receipts; primary deficit is fiscal deficit minus interest payments.", "s": "Government of India, Key to Budget 2026", "u": "https://www.indiabudget.gov.in/doc/Key_to_Budget_Document_2026.pdf", "t": "Economy"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
