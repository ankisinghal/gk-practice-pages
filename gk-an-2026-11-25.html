<script>const D={"id": "g58c5012d24", "date": "2026-11-25", "qs": [{"id": "g58c5012d24-G01", "cat": "CA", "q": "Which religious leader's 557th Parkash Purab was celebrated across India on 24 November 2026?", "o": ["Guru Nanak Dev Ji", "Guru Angad Dev Ji", "Guru Arjan Dev Ji", "Guru Gobind Singh Ji"], "a": 0, "x": "The 557th Parkash Purab of Guru Nanak Dev Ji, the founder of Sikhism, was celebrated on 24 November 2026, and national leaders extended greetings on the occasion. It marks his birth anniversary.", "s": "All India Radio News, 24 November 2026", "u": "https://newsonair.gov.in/nation-celebrates-557th-parkash-purab-of-guru-nanak-dev-ji-president-vice-president-extend-greetings/", "t": "Recent news"}, {"id": "g58c5012d24-G02", "cat": "CA", "q": "The 57th International Film Festival of India, held in Goa from 20 to 28 November 2026, is built around which slogan?", "o": ["Voices of the New Century", "One Screen, One Nation", "Stories without Borders", "Cinema for Every Village"], "a": 2, "x": "PIB reported that the 57th IFFI, running from 20 to 28 November 2026 in Goa, is held under the theme and slogan Stories without Borders, which highlights cinema that crosses national boundaries.", "s": "PIB, 15 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2336497&lang=2&reg=48", "t": "Recent news"}, {"id": "g58c5012d24-G03", "cat": "GK", "q": "Droplets form on the outside of a cold glass of water on a warm day. Which process turns water vapour in the air into liquid on the cold surface?", "o": ["Evaporation", "Transpiration", "Condensation", "Sublimation"], "a": 2, "x": "When warm air touches the cold glass, the water vapour in it cools and changes into liquid droplets. This change from gas to liquid is condensation, a key step in the water cycle.", "s": "U.S. Geological Survey, Condensation and the Water Cycle", "u": "https://www.usgs.gov/water-science-school/science/condensation-and-water-cycle", "t": "General knowledge"}, {"id": "g58c5012d24-G04", "cat": "GK", "q": "Much of peninsular India south of the Narmada rests on a large, old tableland. Which landform is this?", "o": ["The Eastern Coastal Plain", "The Deccan Plateau", "The Thar Desert", "The Indo-Gangetic Plain"], "a": 1, "x": "Most of peninsular India is a raised tableland known as the Deccan Plateau, bordered by the Western and Eastern Ghats. The Thar Desert, the Indo-Gangetic Plain and the coastal plains are different landforms.", "s": "Britannica Kids, The Deccan", "u": "https://kids.britannica.com/students/article/Deccan/648210", "t": "General knowledge"}, {"id": "g58c5012d24-G05", "cat": "GK", "q": "What kind of institution was Nalanda Mahavihara, whose ruins in Bihar are a UNESCO World Heritage Site?", "o": ["A monastic university", "A hilltop royal fort", "A coastal trading port", "A royal observatory"], "a": 0, "x": "Nalanda Mahavihara was a large monastic and scholarly centre that flourished from the 3rd century BCE to the 13th century CE. UNESCO inscribed its archaeological remains in Bihar as a World Heritage Site.", "s": "UNESCO World Heritage Centre, Nalanda", "u": "https://whc.unesco.org/en/list/1502/", "t": "General knowledge"}, {"id": "g58c5012d24-G06", "cat": "GK", "q": "The Preamble describes India as a republic. What does a republic mean for the head of state?", "o": ["The head of state rules for life by birth", "The head of state is picked by a foreign power", "The head of state is always a military officer", "The head of state is chosen, not born"], "a": 3, "x": "In a republic the head of state is not a hereditary ruler. India's President is chosen through an election, as the Preamble's word republic indicates.", "s": "Constitution of India, Preamble", "u": "https://www.indiacode.nic.in/bitstream/123456789/19150/1/constitution_of_india.pdf", "t": "General knowledge"}, {"id": "g58c5012d24-G07", "cat": "GK", "q": "A family keeps its savings in a bank account and receives a small extra amount each year from the bank. What is this extra amount called?", "o": ["Tax", "Interest", "Wages", "Rent"], "a": 1, "x": "Banks use deposited savings to lend to others, and they pay depositors a share as interest. Rent, tax and wages are different kinds of payments.", "s": "Britannica Kids, Interest", "u": "https://kids.britannica.com/students/article/interest/632114", "t": "General knowledge"}, {"id": "g58c5012d24-G08", "cat": "GK", "q": "A school atlas ranks the Indian states by area. Which state sits at the top of the list as the largest?", "o": ["Madhya Pradesh", "Maharashtra", "Rajasthan", "Uttar Pradesh"], "a": 2, "x": "Rajasthan is India's largest state by area, at about 3.42 lakh square kilometres. Madhya Pradesh, Maharashtra and Uttar Pradesh are large but smaller. Checked against the Rajasthan government factfile on 25 November 2026.", "s": "Rajasthan Government, Rajasthan Factfile", "u": "https://rising.rajasthan.gov.in/rajasthan-factfile", "t": "Revision"}, {"id": "g58c5012d24-G09", "cat": "GK", "q": "Painted murals decorate the rock-cut caves of Ajanta in Maharashtra. For followers of which religion were these caves made as shrines and monasteries?", "o": ["Hinduism", "Buddhism", "Jainism", "Sikhism"], "a": 1, "x": "The Ajanta caves are rock-cut Buddhist monasteries and shrines, with famous paintings and sculptures. Jainism, Hinduism and Sikhism are not their main religious link.", "s": "Britannica, Ajanta Caves", "u": "https://www.britannica.com/place/Ajanta-Caves", "t": "Revision"}, {"id": "g58c5012d24-G10", "cat": "CA", "q": "A teacher says the ancient site of Sirpur, on the Mahanadi river and on India's tentative World Heritage list, is in which state?", "o": ["Jharkhand", "Madhya Pradesh", "Odisha", "Chhattisgarh"], "a": 3, "x": "UNESCO's tentative list shows the Sirpur Cultural and Archaeological Landscape, submitted by India on 28 September 2026, in Chhattisgarh. A tentative listing is a preliminary stage, not full World Heritage status.", "s": "UNESCO World Heritage Centre, Sirpur tentative list", "u": "https://whc.unesco.org/en/tentativelists/7054/", "t": "Revision"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
