ty-385a0eadc9a8d391f726b24957f9d394", "t": "World: Bhutan"}, {"id": "Q350", "cat": "CA", "q": "On 4 November 2026, the Union Cabinet approved a Rs 2,814 crore scheme to set up four processing plants in India. These plants will process which materials?", "o": ["Critical minerals such as lithium and nickel", "Crude oil and natural gas", "Food grains for buffer stocks", "Solar panels and modules"], "a": 0, "x": "The Cabinet approved the Capex Support Scheme to Promote Critical Mineral Processing: two lithium and two nickel processing plants, to run from FY27 to FY31, reducing import dependence.", "s": "The Statesman, 4 November 2026", "u": "https://www.thestatesman.com/cities/delhi/cabinet-approves-4-critical-mineral-processing-plants-with-rs-2814-crore-push-1503658787.html", "t": "India: economy"}, {"id": "Q361", "cat": "GK", "q": "Which organ makes bile, a fluid that helps the body digest fats?", "o": ["Pancreas", "Stomach", "Gall bladder", "Liver"], "a": 3, "x": "The liver makes bile. The gall bladder stores and concentrates bile but does not make it.", "s": "Britannica, Liver", "u": "https://kids.britannica.com/scholars/article/liver/48577", "t": "Biology: digestion"}, {"id": "Q362", "cat": "GK", "q": "Which city is the capital of Australia?", "o": ["Sydney", "Melbourne", "Canberra", "Brisbane"], "a": 2, "x": "Canberra is the capital of Australia. Sydney and Melbourne are larger cities but are not the national capital.", "s": "Britannica, Canberra", "u": "https://kids.britannica.com/students/article/Canberra/273481", "t": "World geography"}, {"id": "Q363", "cat": "GK", "q": "A star is described as being several light-years away. What quantity is being measured?", "o": ["Distance", "Duration", "Temperature", "Brightness"], "a": 0, "x": "A light-year is a unit of distance: the distance light travels in one year. It is not a unit of time.", "s": "NASA, What is a light-year?", "u": "https://science.nasa.gov/exoplanets/what-is-a-light-year/", "t": "Astronomy: measurement"}, {"id": "Q364", "cat": "GK", "q": "Which classical dance of northern India is known for storytelling, fast spins and rhythmic footwork?", "o": ["Bharatanatyam", "Kathak", "Kathakali", "Kuchipudi"], "a": 1, "x": "Kathak is a classical dance of northern India with roots in storytelling. Kathakali is a different dance form associated with Kerala.", "s": "Britannica, Classical Dances of India", "u": "https://kids.britannica.com/scholars/article/6-Classical-Dances-of-India/649165", "t": "Indian culture: dance"}, {"id": "Q223", "cat": "GK", "q": "A technician wants to compare the density of a liquid with that of water. Which instrument is suitable?", "o": ["Anemometer", "Ammeter", "Barometer", "Hydrometer"], "a": 3, "x": "A hydrometer measures liquid density or specific gravity, the density relative to water.", "s": "Britannica, Hydrometer", "u": "https://www.britannica.com/science/hydrometer", "t": "Physics: instruments"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
