al.", "s": "Britannica, Canberra", "u": "https://kids.britannica.com/students/article/Canberra/273481", "t": "World geography"}, {"id": "Q363", "cat": "GK", "q": "A star is described as being several light-years away. What quantity is being measured?", "o": ["Temperature", "Distance", "Brightness", "Duration"], "a": 1, "x": "A light-year is a unit of distance: the distance light travels in one year. It is not a unit of time.", "s": "NASA, What is a light-year?", "u": "https://science.nasa.gov/exoplanets/what-is-a-light-year/", "t": "Astronomy: measurement"}, {"id": "Q364", "cat": "GK", "q": "Which classical dance of northern India is known for storytelling, fast spins and rhythmic footwork?", "o": ["Kathak", "Kuchipudi", "Bharatanatyam", "Kathakali"], "a": 0, "x": "Kathak is a classical dance of northern India with roots in storytelling. Kathakali is a different dance form associated with Kerala.", "s": "Britannica, Classical Dances of India", "u": "https://kids.britannica.com/scholars/article/6-Classical-Dances-of-India/649165", "t": "Indian culture: dance"}, {"id": "Q365", "cat": "GK", "q": "At which level of rural local government does a Gram Panchayat work?", "o": ["Village level", "State level", "Block level", "District level"], "a": 0, "x": "A Gram Panchayat is the village-level tier of Panchayati Raj. A Gram Panchayat may cover one village or a group of villages.", "s": "Election Commission for UTs, Panchayati Raj", "u": "https://secforuts.mha.gov.in/73rd-amendment-of-panchayati-raj-in-india/", "t": "Civics: local government"}, {"id": "Q366", "cat": "GK", "q": "Complete the official India Mobile Congress 2026 theme: \"Scale Without ___\".", "o": ["Limits", "Boundaries", "Borders", "Barriers"], "a": 1, "x": "The telecom ministry announced Scale Without Boundaries as the official theme.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319395&reg=48", "t": "India: technology"}, {"id": "Q367", "cat": "GK", "q": "The third International Bharat 6G Symposium was held at Yashobhoomi, Dwarka, in October 2026. Which city should a delegate travel to?", "o": ["New Delhi", "Ahmedabad", "Bengaluru", "Hyderabad"], "a": 0, "x": "The dated telecom release locates Yashobhoomi in Dwarka, New Delhi, for the 7-9 October symposium.", "s": "PIB, 8 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2321066&lang=1&reg=48", "t": "India: technology"}, {"id": "Q368", "cat": "GK", "q": "A ship crosses from 2 degrees north latitude to 2 degrees south latitude. Which reference line does it cross?", "o": ["Prime Meridian", "Equator", "Tropic of Cancer", "Arctic Circle"], "a": 1, "x": "The Equator is 0 degrees latitude, separating the Northern and Southern hemispheres.", "s": "Britannica, Equator", "u": "https://www.britannica.com/place/Equator", "t": "Geography"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
