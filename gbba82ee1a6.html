<h1>General awareness practice gbba82ee1a6</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "gbba82ee1a6", "date": "2026-10-06", "qs": [{"id": "Q032", "cat": "CA", "q": "Which observatory is named in the citation for the 2026 Nobel Prize in Physics announced on 6 October?", "o": ["LIGO Observatory", "Hubble Space Telescope", "IceCube Neutrino Observatory", "James Webb Space Telescope"], "a": 2, "x": "The Nobel citation recognises Francis Halzen for his contributions to IceCube and the discovery of high-energy neutrinos from astrophysical sources.", "s": "Nobel Academy, 6 October 2026", "u": "https://www.nobelprize.org/prizes/physics/2026/press-release/", "t": "World: science"}, {"id": "Q033", "cat": "CA", "q": "The Green Energy Corridor Phase-III scheme approved on 30 September 2026 mainly strengthens transmission for which type of energy?", "o": ["Renewable energy", "Diesel road transport", "Coal mining", "Petrol refining"], "a": 0, "x": "The PIB release says the scheme strengthens intra-state transmission so electricity from renewable sources can reach the grid.", "s": "PIB, 30 September 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2316950&lang=1&reg=3", "t": "India: energy"}, {"id": "Q034", "cat": "CA", "q": "The GOBARdhan scheme launched on 1 October 2026 supports development of which fuel sector?", "o": ["Coal-based coke", "Liquefied petroleum gas", "Aviation turbine fuel", "Compressed biogas"], "a": 3, "x": "The dated PIB launch report describes GOBARdhan as a scheme for the Compressed Biogas sector.", "s": "PIB, 1 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2317937&lang=1&reg=3", "t": "India: energy"}, {"id": "Q035", "cat": "CA", "q": "The PIB announcement of 5 October placed the HAL Koraput aero-engine milestone event in which state?", "o": ["Karnataka", "Odisha", "Maharashtra", "Tamil Nadu"], "a": 1, "x": "The announcement locates HAL Koraput Division in Odisha and schedules the 2000th aero-engine milestone event for 6 October. This question asks the location, not whether the event has finished.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2319187&lang=1&reg=3", "t": "India: industry"}, {"id": "Q036", "cat": "CA", "q": "What was the theme of World Habitat Day on 5 October 2026?", "o": ["Clean Oceans for All", "Rocket revolution", "Adequate Housing for All", "Digital Education for All"], "a": 2, "x": "UN News reports that World Habitat Day 2026 focused on Adequate Housing for All. The commemoration took place in Muscat, Oman.", "s": "UN News, 5 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "World: cities"}, {"id": "Q037", "cat": "GK", "q": "How many chambers are in a normal human heart?", "o": ["Four", "Two", "Six", "Three"], "a": 0, "x": "The heart has two atria and two ventricles, making four chambers.", "s": "Britannica, checked 6 October 2026", "u": "https://www.britannica.com/science/heart", "t": "Biology"}, {"id": "Q038", "cat": "GK", "q": "Which two elements make up water?", "o": ["Sodium and chlorine", "Carbon and oxygen", "Hydrogen and nitrogen", "Hydrogen and oxygen"], "a": 3, "x": "A water molecule has two hydrogen atoms and one oxygen atom, represented by H2O.", "s": "Britannica, checked 6 October 2026", "u": "https://www.britannica.com/science/water", "t": "Chemistry"}, {"id": "Q005", "cat": "CA", "q": "On which date did the 2026 Nobel Prize announcements begin?", "o": ["1 October", "5 October", "9 October", "12 October"], "a": 1, "x": "The official 2026 announcement schedule begins on 5 October and ends on 12 October. This date was rechecked on 6 October 2026.", "s": "nobelprize.org; rechecked 6 October 2026", "u": "https://www.nobelprize.org/prizes/about/prize-announcement-dates/", "t": "World"}, {"id": "Q007", "cat": "GK", "q": "In which year did India's Chandrayaan-3 lander soft-land on the Moon?", "o": ["2021", "2025", "2023", "2019"], "a": 2, "x": "Chandrayaan-3 soft-landed on the Moon on 23 August 2023.", "s": "ISRO; rechecked 6 October 2026", "u": "https://www.isro.gov.in/Chandrayaan3.html", "t": "Science and space"}, {"id": "Q013", "cat": "GK", "q": "What is the name of India's own independent satellite navigation system, earlier called IRNSS?", "o": ["BharatNav", "Disha-1", "SwaDesh GPS", "NavIC"], "a": 3, "x": "NavIC stands for Navigation with Indian Constellation. It was earlier known as the Indian Regional Navigation Satellite System (IRNSS).", "s": "ISRO; rechecked 6 October 2026", "u": "https://www.isro.gov.in/Navic.html", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
