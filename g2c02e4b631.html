2&lang=1&reg=3", "t": "India: agriculture"}, {"id": "Q068", "cat": "CA", "q": "The PIB lighthouse feature of 10 October places the National Maritime Heritage Complex at Lothal in which state?", "o": ["West Bengal", "Gujarat", "Kerala", "Tamil Nadu"], "a": 1, "x": "The feature locates Lothal and the planned National Maritime Heritage Complex in Gujarat. It describes a lighthouse museum as part of the complex.", "s": "PIB, 10 October 2026", "u": "https://www.pib.gov.in/FeaturesDeatils.aspx?ModuleId=2&NoteId=160404&id=160404&lang=1&reg=1", "t": "India: heritage"}, {"id": "Q069", "cat": "CA", "q": "The PIB announcement of 10 October scheduled the Defence Secretary's 12-15 October visit to which pair of countries?", "o": ["Australia and New Zealand", "France and Germany", "Japan and South Korea", "Cyprus and Greece"], "a": 3, "x": "The announcement names Cyprus and Greece. The question asks the announced destinations, not whether the visit has happened.", "s": "PIB, 10 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2321726&lang=2&reg=48", "t": "World: cooperation"}, {"id": "Q070", "cat": "CA", "q": "The PIB announcement of 10 October places the Sudha Gopalakrishnan Brain Centre at which institute?", "o": ["IIT Madras", "IIT Delhi", "IIT Bombay", "IIT Kanpur"], "a": 0, "x": "PIB identifies the brain research centre as being at IIT Madras. The announced programme includes mapping human brains into detailed atlases.", "s": "PIB, 10 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321671&lang=1&reg=3", "t": "India: science"}, {"id": "Q071", "cat": "CA", "q": "At which city's Air Force Station did the Defence Minister address Tarang Shakti participants on 10 October 2026?", "o": ["Guwahati", "Pune", "Jodhpur", "Kochi"], "a": 2, "x": "The dated release places the address at Air Force Station Jodhpur during the multinational air exercise.", "s": "PIB, 10 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2321694&lang=2&reg=48", "t": "India: international exercise"}, {"id": "Q072", "cat": "GK", "q": "Which organ pumps blood around the human body?", "o": ["Heart", "Lungs", "Liver", "Stomach"], "a": 0, "x": "The heart acts as the muscular pump of the circulatory system, moving blood through the body.", "s": "Britannica, checked 11 October 2026", "u": "https://www.britannica.com/science/heart", "t": "Biology"}, {"id": "Q073", "cat": "GK", "q": "What happens when the north poles of two magnets are brought close together?", "o": ["They become south poles", "They repel each other", "They attract each other", "They lose all magnetism"], "a": 1, "x": "Like magnetic poles repel. Unlike poles, such as north and south, attract.", "s": "Britannica, checked 11 October 2026", "u": "https://www.britannica.com/science/magnetism", "t": "Physics"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
