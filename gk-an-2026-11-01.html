<h1>General awareness practice g3e4734c8d9</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "g3e4734c8d9", "date": "2026-11-01", "qs": [{"id": "Q270", "cat": "CA", "q": "The new Vande Bharat Sleeper Express flagged off on 31 October 2026 runs overnight between New Delhi and which city?", "o": ["Patna", "Varanasi", "Lucknow", "Prayagraj"], "a": 1, "x": "Indian Railways introduced the Vande Bharat Sleeper train between New Delhi and Varanasi, flagged off on 31 October 2026; the 16-coach train runs overnight via Kanpur Central, covering about 760 km (NDTV and Indian Express, 29-31 October 2026).", "s": "NDTV, 29 October 2026", "u": "https://www.ndtv.com/india-news/new-delhi-varanasi-vande-bharat-sleeper-express-launch-train-timings-and-more-12254295", "t": "India: railways"}, {"id": "Q260", "cat": "CA", "q": "The World Day for Audiovisual Heritage, which focuses on preserving recorded sound and moving images, is observed every year on which date?", "o": ["27 October", "30 October", "27 September", "17 October"], "a": 0, "x": "UNESCO marks the World Day for Audiovisual Heritage on 27 October each year, promoting the preservation of audiovisual records.", "s": "UNESCO, 20 October 2026", "u": "https://www.unesco.org/en/articles/world-day-audiovisual-heritage-protecting-memory-risk", "t": "World: heritage"}, {"id": "Q296", "cat": "GK", "q": "Who was the first Indian to travel into space, flying on a Soviet Soyuz mission in 1984?", "o": ["Vikram Sarabhai", "Kalpana Chawla", "Rakesh Sharma", "Sunita Williams"], "a": 2, "x": "Rakesh Sharma became the first Indian in space in April 1984, flying aboard the Soviet Soyuz T-11 mission. Kalpana Chawla and Sunita Williams went later; Vikram Sarabhai was a scientist, not an astronaut.", "s": "India Today, 3 April 2024", "u": "https://www.indiatoday.in/science/story/rakesh-sharma-first-indian-in-space-mahatma-gandhi-soyuz-t-11-isro-iaf-2522605-2024-04-03", "t": "Science: space"}, {"id": "Q228", "cat": "GK", "q": "A museum has a gallery labelled Mauryan rulers. Which emperor's rock and pillar edicts belong in that gallery?", "o": ["Samudragupta", "Ashoka", "Akbar", "Rajaraja Chola"], "a": 1, "x": "Ashoka was a Mauryan emperor, known for his rock and pillar edicts.", "s": "Britannica, Ashoka", "u": "https://www.britannica.com/summary/Ashoka", "t": "History: ancient India"}, {"id": "Q252", "cat": "GK", "q": "Lok Sabha, the directly elected House of India's Parliament, is also known by which name?", "o": ["Federal Assembly", "Upper House", "Council of States", "House of the People"], "a": 3, "x": "Lok Sabha means House of the People; Rajya Sabha is the Council of States.", "s": "Digital Sansad, checked 12 October 2026", "u": "https://sansad.in/ls/about/introduction", "t": "Civics"}, {"id": "Q269", "cat": "GK", "q": "A family's money income is unchanged, but over the year it buys fewer goods and services than before. What has happened to prices in general?", "o": ["The family's money income has risen", "Prices in general have stayed the same", "Prices in general have risen", "Prices in general have fallen"], "a": 2, "x": "When money income stays the same but buys fewer goods and services, prices in general have risen - inflation reduces purchasing power.", "s": "IMF, Inflation", "u": "https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/inflation", "t": "Economy"}, {"id": "Q297", "cat": "GK", "q": "Which is the highest civilian award of India?", "o": ["Param Vir Chakra", "Bharat Ratna", "Padma Vibhushan", "Padma Bhushan"], "a": 1, "x": "The Bharat Ratna is India's highest civilian award, instituted in 1954. The Padma awards rank below it, and the Param Vir Chakra is a military gallantry award, not a civilian one.", "s": "Ministry of Home Affairs, Bharat Ratna award scheme", "u": "https://www.mha.gov.in/sites/default/files/Scheme-BR_1.pdf", "t": "Civics: awards"}, {"id": "Q287", "cat": "CA", "q": "World Habitat Day was marked on 5 October 2026 with which theme?", "o": ["Clean Oceans for All", "Digital Education for All", "Rocket revolution", "Adequate Housing for All"], "a": 3, "x": "UN News reports that World Habitat Day 2026 focused on Adequate Housing for All. The commemoration took place in Muscat, Oman.", "s": "UN News, 5 October 2026; rechecked 7 October 2026; rechecked 8 October 2026; rechecked 9 October 2026; rechecked 10 October 2026; rechecked 11 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "World: cities"}, {"id": "Q288", "cat": "CA", "q": "The high-level week of the United Nations General Assembly in September 2026 belonged to which session?", "o": ["81st", "79th", "82nd", "80th"], "a": 0, "x": "The United Nations identifies its September 2026 high-level week as part of the 81st General Assembly session. Rechecked on 5 October 2026.", "s": "United Nations, High-level Week 2026; US State Department schedule, 21 Sep 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "World"}, {"id": "Q289", "cat": "GK", "q": "Two bar magnets are held with their north poles facing each other. What happens?", "o": ["They repel each other", "They attract each other", "They lose all magnetism", "They become south poles"], "a": 0, "x": "Like magnetic poles repel. Unlike poles, such as north and south, attract.", "s": "Britannica, checked 11 October 2026", "u": "https://www.britannica.com/science/magnetism", "t": "Physics"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
