<h1>General awareness practice gcfc081543</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "gcfc081543", "date": "2026-10-30", "qs": [{"id": "Q262", "cat": "CA", "q": "A nationwide 'Run for Unity' and a grand evening parade at Ekta Nagar in Gujarat are planned for 31 October 2026 to mark which annual observance?", "o": ["National Science Day", "National Unity Day (Rashtriya Ekta Diwas)", "National Sports Day", "National Youth Day"], "a": 1, "x": "News18 reported on 30 October 2026: 'The Centre has called for nationwide celebrations of Rashtriya Ekta Diwas (National Unity Day) on October 31, marking the 151st birth anniversary of Sardar Vallabhbhai Patel,' with a Run for Unity and a Unity Parade at Ekta Nagar in Gujarat.", "s": "News18, 30 October 2026", "u": "https://www.news18.com/india/national-unity-day-2026-amit-shah-calls-for-nationwide-run-for-unity-grand-parade-in-gujarat-ws-l-10404857.html", "t": "India: observance"}, {"id": "Q263", "cat": "CA", "q": "India's men's hockey team beat which team 5-2 in an Asian Champions Trophy match at Jalandhar on 29 October 2026?", "o": ["China", "Japan", "Malaysia", "South Korea"], "a": 0, "x": "ESPN's report of 29 October 2026 says India 'continued their winning momentum at the Asian Champions Trophy with a 5-2 win over China at the Olympian Surjit Singh Hockey Stadium in Jalandhar'; Harmanpreet Singh and Sukhjeet Singh scored twice each.", "s": "ESPN, 29 October 2026", "u": "https://www.espn.com/field-hockey/story/_/id/50315686/india-vs-china-live-asian-champions-trophy-october-29-2026-scores-updates-commentary-news", "t": "Sports: hockey"}, {"id": "Q264", "cat": "GK", "q": "Which is the hardest naturally occurring substance known?", "o": ["Quartz", "Granite", "Iron", "Diamond"], "a": 3, "x": "Britannica states: 'diamond, a mineral composed of pure carbon. It is the hardest naturally occurring substance known.' Its hardness also makes it useful for cutting and drilling tools. Checked 30 October 2026.", "s": "Britannica Scholars, checked 30 October 2026", "u": "https://kids.britannica.com/scholars/article/diamond/30264", "t": "Science: materials"}, {"id": "Q265", "cat": "GK", "q": "Which is the highest mountain in the world above sea level?", "o": ["K2", "Mount Everest", "Kangchenjunga", "Makalu"], "a": 1, "x": "Britannica states: 'Reaching an elevation of 29,032 feet (8,849 meters), Mount Everest is the highest mountain in the world.' It stands in the Himalayas on the Nepal-China (Tibet) border. Checked 30 October 2026.", "s": "Encyclopaedia Britannica, checked 30 October 2026", "u": "https://www.britannica.com/place/Mount-Everest", "t": "World geography"}, {"id": "Q266", "cat": "GK", "q": "The Taj Mahal, the famous white-marble mausoleum, stands in which Indian city?", "o": ["Delhi", "Jaipur", "Agra", "Lucknow"], "a": 2, "x": "Britannica states: 'The Taj Mahal is a mausoleum complex in Agra, western Uttar Pradesh state, northern India.' It was built by the Mughal emperor Shah Jahan. Checked 30 October 2026.", "s": "Encyclopaedia Britannica, checked 30 October 2026", "u": "https://www.britannica.com/topic/Taj-Mahal", "t": "History and culture"}, {"id": "Q267", "cat": "GK", "q": "The Constituent Assembly set up its Drafting Committee in 1947 under the chairmanship of which leader?", "o": ["Dr. Rajendra Prasad", "Dr. B. R. Ambedkar", "Maulana Abul Kalam Azad", "Dr. S. Radhakrishnan"], "a": 1, "x": "The Parliament Digital Library states: 'On 29 August 1947, the Constituent Assembly had set up a Drafting Committee under the Chairmanship of Dr. B.R. Ambedkar.' Checked 30 October 2026.", "s": "Parliament Digital Library (Sansad), checked 30 October 2026", "u": "https://eparlib.sansad.in/handle/123456789/760448", "t": "Civics: Constitution"}, {"id": "Q268", "cat": "GK", "q": "How many interlaced rings make up the Olympic symbol?", "o": ["Five", "Four", "Six", "Seven"], "a": 0, "x": "Olympics.com states: 'The Olympic symbol consists of five interlaced rings of equal dimensions,' and the symbol 'represents the union of the five continents and the meeting of athletes from throughout the world at the Olympic Games.' Checked 30 October 2026.", "s": "Olympics.com (IOC), checked 30 October 2026", "u": "https://www.olympics.com/ioc/olympic-rings", "t": "Sports: Olympics"}, {"id": "Q253", "cat": "GK", "q": "Article 51A of the Indian Constitution places protecting forests, lakes, rivers and wildlife, and having compassion for living creatures, in which category?", "o": ["Fundamental Right", "Directive Principle", "Fundamental Duty", "Emergency Power"], "a": 2, "x": "Article 51A(g) lists this among the Fundamental Duties of citizens. Duties, rights and Directive Principles are separate constitutional categories.", "s": "Constitution of India, Article 51A", "u": "https://cdnbbsr.s3waas.gov.in/s35b3b68ffd8758e8114d7df1efa4ac376/uploads/2025/07/202507252048725343.pdf", "t": "Civics"}, {"id": "Q254", "cat": "GK", "q": "The paintings and cave monasteries of Ajanta in Maharashtra chiefly belong to which religious tradition?", "o": ["Buddhism", "Jainism", "Hinduism", "Sikhism"], "a": 0, "x": "Ajanta is a group of Buddhist cave temples and monasteries in Maharashtra, celebrated for its paintings. Do not confuse it with the Jain temples at Ellora.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/place/Ajanta-Caves", "t": "History and culture"}, {"id": "Q255", "cat": "GK", "q": "If the north pole of one bar magnet is held near the north pole of another, the two poles will:", "o": ["They attract each other", "They lose all magnetism", "They become south poles", "They repel each other"], "a": 3, "x": "Like magnetic poles repel. Unlike poles, such as north and south, attract.", "s": "Britannica, checked 11 October 2026", "u": "https://www.britannica.com/science/magnetism", "t": "Physics"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
