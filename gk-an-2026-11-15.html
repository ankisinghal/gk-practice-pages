<script>const D={"id": "g3abac3b4b4", "date": "2026-11-15", "qs": [{"id": "Q590", "cat": "CA", "q": "Janjatiya Gaurav Diwas is observed on 15 November. In 2026 it marks the 151st birth anniversary of which leader?", "o": ["Tilka Manjhi", "Alluri Sitarama Raju", "Rani Gaidinliu", "Bhagwan Birsa Munda"], "a": 3, "x": "PIB says 15 November, the birth anniversary of Dharti Aaba Bhagwan Birsa Munda, has been observed as Janjatiya Gaurav Diwas since 2021; 2026 marks his 151st birth anniversary.", "s": "PIB, 14 and 15 November 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2336214&lang=1&reg=3", "t": "India: tribal heritage"}, {"id": "Q591", "cat": "CA", "q": "Which team did India beat in the final of the Men's U-19 Asia Cup on 14 November 2026?", "o": ["Afghanistan", "UAE", "Bangladesh", "Pakistan"], "a": 3, "x": "India Under-19s won the Men's U-19 Asia Cup 2026 on 14 November, beating Pakistan Under-19s in a close final; the Prime Minister congratulated the team.", "s": "ESPNcricinfo match report and PM India, 14 November 2026", "u": "https://www.pmindia.gov.in/en/news_updates/pm-congratulates-indian-mens-u-19-cricket-team-on-winning-mens-u-19-asia-cup-2026/", "t": "Sports"}, {"id": "Q592", "cat": "GK", "q": "Which part of a cell is called its \"powerhouse\" because it makes the energy-carrying molecule ATP?", "o": ["Ribosomes", "Chloroplasts", "Mitochondria", "Nucleus"], "a": 2, "x": "Mitochondria are called the powerhouses of the cell. They are the site of cellular respiration, turning molecules such as glucose into ATP that fuels the cell.", "s": "Britannica Kids, 6 Cell Organelles", "u": "https://kids.britannica.com/scholars/article/6-Cell-Organelles/649114", "t": "Science: the cell"}, {"id": "Q593", "cat": "GK", "q": "The Salt March of 1930, led by Mahatma Gandhi, is also called the Dandi March because it ended in which town?", "o": ["Porbandar", "Bardoli", "Dandi", "Surat"], "a": 2, "x": "Gandhi led the Salt March in March-April 1930 against the British tax on salt. It is also called the Dandi March since it ended in the town of Dandi.", "s": "Britannica Kids, Salt March", "u": "https://kids.britannica.com/students/article/Salt-March/624729", "t": "India: freedom struggle"}, {"id": "Q594", "cat": "GK", "q": "What is the name for each small animal in a coral colony whose skeleton helps build a coral reef?", "o": ["Polyp", "Plankton", "Krill", "Sponge"], "a": 0, "x": "Individual corals are called polyps. They grow in colonies, and when they die their skeletons remain. New polyps grow on them, building up the reef framework.", "s": "Britannica Kids, coral reef", "u": "https://kids.britannica.com/students/article/coral-reef/633865", "t": "Environment"}, {"id": "Q595", "cat": "GK", "q": "Bharatanatyam, one of India's classical dances, comes from which region of southern India?", "o": ["Odisha", "Tamil Nadu", "Kerala", "Maharashtra"], "a": 1, "x": "Britannica says bharata natyam is indigenous to the Tamil Nadu region and is prevalent in southern India. Odissi comes from Odisha and kathakali from Kerala.", "s": "Britannica Kids, bharata natyam", "u": "https://kids.britannica.com/scholars/article/bharata-natyam/79037", "t": "India: arts and culture"}, {"id": "Q596", "cat": "GK", "q": "Which is the smallest of the seven continents by area?", "o": ["Australia", "South America", "Antarctica", "Europe"], "a": 0, "x": "Ordered from largest to smallest, the continents are Asia, Africa, North America, South America, Antarctica, Europe and Australia.", "s": "Britannica Kids, continent", "u": "https://kids.britannica.com/students/article/continent/273790", "t": "World geography"}, {"id": "Q597", "cat": "CA", "q": "Which statement about World Habitat Day on 5 October 2026 is correct?", "o": ["Its focus was Cleaner Cities and Fewer Cars.", "Its focus was Adequate Housing for All.", "Its focus was Jobs for Young People.", "Its focus was Safe Drinking Water for Villages."], "a": 1, "x": "UN News reports that World Habitat Day 2026, observed on 5 October, focused on Adequate Housing for All.", "s": "UN News, 5 October 2026; rechecked 7 October 2026; rechecked 8 October 2026; rechecked 9 October 2026; rechecked 10 October 2026; rechecked 11 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "World: cities"}, {"id": "Q598", "cat": "CA", "q": "The high-level week of the UN General Assembly in September 2026 belonged to which session?", "o": ["The 84th session", "The 82nd session", "The 81st session", "The 77th session"], "a": 2, "x": "The United Nations places its September 2026 high-level week in the 81st session of the General Assembly.", "s": "United Nations, High-level Week 2026; US State Department schedule, 21 Sep 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "World"}, {"id": "Q599", "cat": "CA", "q": "World Space Week begins on 4 October. Which first in space history does that date remember?", "o": ["The first Indian astronaut to travel in orbit", "The first successful landing of a probe on Mars", "The first human to walk on the surface of the Moon", "The launch of Sputnik 1, the first satellite ever"], "a": 3, "x": "World Space Week begins on 4 October, the date in 1957 when Sputnik 1, the first human-made Earth satellite, was launched.", "s": "United Nations", "u": "https://www.un.org/en/observances/world-space-week", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
