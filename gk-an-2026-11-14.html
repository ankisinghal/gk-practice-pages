rdo da Vinci, painted sometime between 1503 and 1519.", "s": "Britannica Kids, Mona Lisa", "u": "https://kids.britannica.com/scholars/article/Mona-Lisa/443963", "t": "Art"}, {"id": "Q574", "cat": "GK", "q": "Which Scottish scientist discovered penicillin, the first antibiotic drug?", "o": ["Louis Pasteur", "Florence Nightingale", "Alexander Fleming", "Edward Jenner"], "a": 2, "x": "Alexander Fleming, a Scottish scientist, discovered penicillin, the first antibiotic drug, and shared the 1945 Nobel Prize for Medicine with Howard Florey and Ernst Chain.", "s": "Britannica Kids, Alexander Fleming", "u": "https://kids.britannica.com/kids/article/Alexander-Fleming/476259", "t": "Science: history"}, {"id": "Q575", "cat": "GK", "q": "Bras\u00edlia, famous for its planned design, is the capital of which South American country?", "o": ["Brazil", "Chile", "Peru", "Argentina"], "a": 0, "x": "Bras\u00edlia is the capital of Brazil and is famous for the design of its buildings, with the central city planned by L\u00facio Costa.", "s": "Britannica Kids, Bras\u00edlia", "u": "https://kids.britannica.com/kids/article/Bras%C3%ADlia/345871", "t": "World: capitals"}, {"id": "Q576", "cat": "GK", "q": "Who became the first person to walk on the Moon, during the Apollo 11 mission in 1969?", "o": ["Neil Armstrong", "Buzz Aldrin", "Michael Collins", "Yuri Gagarin"], "a": 0, "x": "Apollo 11 commander Neil Armstrong became the first person to step onto the Moon's surface in 1969.", "s": "Britannica Kids, Neil Armstrong", "u": "https://kids.britannica.com/kids/article/Neil-Armstrong/352784", "t": "Space"}, {"id": "Q577", "cat": "CA", "q": "World Habitat Day was observed on 5 October 2026. What was its focus?", "o": ["Safe Roads for Kids", "Clean Rivers for Every City", "Adequate Housing for All", "Free Schools for All"], "a": 2, "x": "UN News reports that World Habitat Day 2026, observed on 5 October, focused on Adequate Housing for All.", "s": "UN News, 5 October 2026; rechecked 7 October 2026; rechecked 8 October 2026; rechecked 9 October 2026; rechecked 10 October 2026; rechecked 11 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "World: cities"}, {"id": "Q578", "cat": "CA", "q": "Complete: the high-level week of the UN General Assembly in September 2026 opened the ______ session.", "o": ["81st", "78th", "83rd", "90th"], "a": 0, "x": "The United Nations places its September 2026 high-level week in the 81st session of the General Assembly.", "s": "United Nations, High-level Week 2026; US State Department schedule, 21 Sep 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "World"}, {"id": "Q579", "cat": "CA", "q": "World Space Week starts on 4 October because on that date in 1957 which satellite went into orbit?", "o": ["Vanguard 1", "Sputnik 1", "Luna 1", "Explorer 1"], "a": 1, "x": "World Space Week begins on 4 October, the date in 1957 when Sputnik 1, the first human-made Earth satellite, was launched.", "s": "United Nations", "u": "https://www.un.org/en/observances/world-space-week", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
