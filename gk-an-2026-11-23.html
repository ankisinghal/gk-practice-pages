<h1>General awareness practice g2bc9e5a65d</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "g2bc9e5a65d", "date": "2026-11-23", "qs": [{"id": "g2bc9e5a65d-G01", "cat": "CA", "q": "PIB's 22 November 2026 feature on small hydropower describes electricity generation mainly from which source?", "o": ["Heat rising from deep underground", "Flowing water in rivers and canals", "Wind passing over open hills", "Sunlight falling on solar panels"], "a": 1, "x": "The PIB feature describes small hydropower as using the natural flow of rivers and canals to generate electricity.", "s": "PIB, 22 November 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2339965&lang=2&reg=48", "t": "Recent news"}, {"id": "g2bc9e5a65d-G02", "cat": "CA", "q": "According to the 22 November 2026 PIB report, which city hosted the first SCO Civilisational Dialogue Forum?", "o": ["Chennai", "Hyderabad", "Mumbai", "New Delhi"], "a": 3, "x": "The forum was inaugurated at Purana Qila in New Delhi on 20 November; the 22 November report describes the three-day programme.", "s": "PIB, 22 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2339975&lang=1&reg=3", "t": "Recent news"}, {"id": "g2bc9e5a65d-G03", "cat": "GK", "q": "Food moves along the oesophagus even when a person is not consciously pushing it. Which process produces this movement?", "o": ["Wave-like muscular contractions", "Repeated filtering through membranes", "Rhythmic opening of air passages", "Continuous grinding by the teeth"], "a": 0, "x": "Peristalsis is a wave-like sequence of involuntary muscle contractions that pushes food along the digestive tract.", "s": "Britannica, Peristalsis", "u": "https://kids.britannica.com/scholars/article/peristalsis/59270", "t": "General knowledge"}, {"id": "g2bc9e5a65d-G04", "cat": "GK", "q": "A substance speeds up a chemical reaction and is regenerated rather than used up overall. What is it called?", "o": ["A catalyst", "A sediment", "A product", "A solvent"], "a": 0, "x": "A catalyst increases the rate of a reaction without being consumed overall. It can take part in intermediate steps and then be regenerated.", "s": "Britannica, Catalyst", "u": "https://kids.britannica.com/scholars/article/catalyst/20761", "t": "General knowledge"}, {"id": "g2bc9e5a65d-G05", "cat": "GK", "q": "Why was the Rosetta Stone important to the study of ancient Egypt?", "o": ["Its star charts explained the motions of the planets", "Its building plans revealed how pyramids were raised", "Its painted maps showed the sources of the Nile", "Its parallel texts helped decipher hieroglyphs"], "a": 3, "x": "The stone carries the same decree in hieroglyphic, demotic and Greek scripts. Comparing known Greek with Egyptian writing helped scholars decipher hieroglyphs.", "s": "British Museum, Rosetta Stone", "u": "https://www.britishmuseum.org/collection/object/Y_EA24", "t": "General knowledge"}, {"id": "g2bc9e5a65d-G06", "cat": "GK", "q": "Which feature matches India's constitutional model of a secular state?", "o": ["The state requires a common religious belief", "The state reserves elections for religious leaders", "No religion is designated as the state religion", "The state forbids all forms of religious practice"], "a": 2, "x": "NCERT explains that India has no official religion and that the Constitution protects freedom of religion and prohibits religious discrimination.", "s": "NCERT, Democratic Politics II, Chapter3", "u": "https://www.ncert.nic.in/textbook/pdf/jess403.pdf", "t": "General knowledge"}, {"id": "g2bc9e5a65d-G07", "cat": "GK", "q": "Which changing feature is used to read the time on a traditional sundial?", "o": ["The direction of a magnetic needle", "The position of a shadow", "The loudness of a vibration", "The level of a liquid column"], "a": 1, "x": "The Sun casts the shadow of a projecting part onto marked hour lines. The position of that shadow indicates the time of day.", "s": "Britannica, Sundial", "u": "https://kids.britannica.com/students/article/sundial/603800", "t": "General knowledge"}, {"id": "g2bc9e5a65d-G08", "cat": "GK", "q": "A calendar editor is arranging October observances in date order. Which entry correctly places the UN International Day of the Girl Child?", "o": ["10 October", "11 October", "12 October", "15 October"], "a": 1, "x": "The UN observes International Day of the Girl Child every year on 11 October. This reviews the date, not its changing annual theme.", "s": "United Nations, International Day of the Girl Child", "u": "https://www.un.org/en/observances/girl-child-day", "t": "Revision"}, {"id": "g2bc9e5a65d-G09", "cat": "GK", "q": "Which statement about Indian textiles and engineering goods is correct under the duty-free access reported for the India-New Zealand FTA on 20 October 2026?", "o": ["Indian textiles alone, with engineering goods excluded", "Indian engineering goods alone, with textiles excluded", "Both Indian textiles and Indian engineering goods", "Neither Indian textiles nor Indian engineering goods"], "a": 2, "x": "The report states that 100% of Indian exports receive duty-free access to New Zealand. The coverage is not confined to one goods sector. This is a historical 20 October claim. Indian Express also names textiles and engineering goods among the sectors gaining access.", "s": "The Hindu,20 Oct2026; Indian Express,19 Oct2026", "u": "https://indianexpress.com/article/business/india-new-zealand-fta-takes-effect-piyush-goyal-indian-exports-zero-duty-access-10928330/", "t": "Revision"}, {"id": "g2bc9e5a65d-G10", "cat": "GK", "q": "A conference organiser wants a session matching the UN theme for World Habitat Day 2026. Which proposal fits?", "o": ["A session about adequate housing for everyone", "A session about investment in space travel", "A session about ocean wildlife protection", "A session about access to digital textbooks"], "a": 0, "x": "World Habitat Day 2026 had the theme Adequate Housing for All. A session about suitable homes matches that focus.", "s": "UN News, 5 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "Revision"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.getElementById("copy").textContent="Copy failed - code selected; copy manually"}};
</script></body></html>
