e press.", "s": "Press Council of India, National Press Day", "u": "https://presscouncil.nic.in/NationalPressDay.aspx", "t": "India: media"}, {"id": "Q616", "cat": "CA", "q": "In his 16 November 2026 departure statement, the Prime Minister said he would attend the ASEAN-India and East Asia summits in which city?", "o": ["Bangkok", "Manila", "Jakarta", "Kuala Lumpur"], "a": 1, "x": "The Prime Minister's 16 November statement says he is travelling to Manila in the Philippines for the ASEAN-India and East Asia summits on 17 November. This describes the announced visit, not a completed summit.", "s": "PM India, 16 Nov 2026", "u": "https://www.pmindia.gov.in/en/news_updates/pms-departure-statement-ahead-of-his-visit-to-the-philippines/", "t": "World: diplomacy"}, {"id": "Q625", "cat": "GK", "q": "The Bering Strait separates which two continents?", "o": ["Asia and Australia", "Europe and Africa", "North America and South America", "Asia and North America"], "a": 3, "x": "The Bering Strait separates Asia and North America at their closest point.", "s": "Britannica Kids, Bering Strait", "u": "https://kids.britannica.com/scholars/article/Bering-Strait/78777", "t": "World geography"}, {"id": "Q618", "cat": "GK", "q": "The lithosphere is the rigid outer shell of Earth. Which layers does it include?", "o": ["The whole mantle and the outer core", "Only the liquid outer core", "The crust and the uppermost mantle", "The atmosphere and the oceans"], "a": 2, "x": "The lithosphere includes Earth's crust and the solid outermost part of the upper mantle. It is divided into tectonic plates.", "s": "Britannica Kids, Lithosphere", "u": "https://kids.britannica.com/scholars/article/lithosphere/472772", "t": "Geography: Earth structure"}, {"id": "Q626", "cat": "GK", "q": "Which mineral formations hang down from the ceiling of a cave?", "o": ["Stalagmites", "Stalactites", "River deltas", "Sand dunes"], "a": 1, "x": "Stalactites hang from cave ceilings as minerals are deposited by dripping water. Stalagmites grow upwards from the floor.", "s": "Britannica Kids, Cave", "u": "https://kids.britannica.com/kids/article/cave/352930", "t": "Science: caves"}, {"id": "Q627", "cat": "GK", "q": "Johannes Gutenberg helped transform book production in Europe in the 1400s. What technology is he best known for developing?", "o": ["Recording speech on wax cylinders", "Making paper from woven cloth", "Sending messages by electric wire", "Printing with movable metal type"], "a": 3, "x": "Gutenberg developed a practical printing press using movable metal type in Europe. He was not the first person in the world to print or to use movable type.", "s": "Britannica Kids, Johannes Gutenberg", "u": "https://kids.britannica.com/students/article/Johannes-Gutenberg/274706", "t": "History: printing"}, {"id": "Q621", "cat": "GK", "q": "Bauxite is processed to obtain which widely used metal?", "o": ["Iron", "Aluminium", "Zinc", "Copper"], "a": 1, "x": "Bauxite is an ore from which alumina is obtained; alumina is then processed to produce aluminium.", "s": "Britannica Kids, Aluminum", "u": "https://kids.britannica.com/students/article/aluminum/272824", "t": "Resources: metals"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
