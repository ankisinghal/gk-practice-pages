<script>const D={"id": "gfb727f1255", "date": "2026-11-07", "qs": [{"id": "Q423", "cat": "CA", "q": "Who launched the Semicon 2.0 web application portal in November 2026?", "o": ["Jyotiraditya Scindia", "Dharmendra Pradhan", "Ashwini Vaishnaw", "Nirmala Sitharaman"], "a": 2, "x": "Union Minister Ashwini Vaishnaw launched the Semicon 2.0 web application portal on 6 November 2026 and announced 12 approved applicants under the Electronics Components Manufacturing Scheme.", "s": "PIB press release PRID 2333716, 6 November 2026; Akashvani News report", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2333716", "t": "India: technology"}, {"id": "Q424", "cat": "CA", "q": "On 6 November 2026, Stage III of GRAP was invoked for which region?", "o": ["the Kolkata-Howrah belt", "the Mumbai-Pune region", "the Delhi-NCR region", "the Chennai metro area"], "a": 2, "x": "On 6 November 2026, the Commission for Air Quality Management invoked Stage III of GRAP for Delhi-NCR.", "s": "CAQM order dated 6 November 2026; India Today and Times of India reports, 7 November 2026", "u": "https://caqm.nic.in", "t": "India: environment"}, {"id": "Q425", "cat": "GK", "q": "Which gas do plants absorb from the air to make their food during photosynthesis?", "o": ["Nitrogen gas", "Carbon dioxide", "Water vapour", "Oxygen gas"], "a": 1, "x": "Plants take in carbon dioxide from the air and, using sunlight and water, make their food by photosynthesis, releasing oxygen.", "s": "NCERT Class 7 Science, Nutrition in Plants", "u": "https://ncert.nic.in", "t": "Science: plants"}, {"id": "Q426", "cat": "GK", "q": "Which is the largest ocean on Earth?", "o": ["The Pacific Ocean", "The Arctic Ocean", "The Atlantic Ocean", "The Indian Ocean"], "a": 0, "x": "The Pacific Ocean is the largest and deepest ocean, covering about one-third of the Earth's surface.", "s": "NCERT Class 6 Social Science, The Earth: Our Habitat", "u": "https://ncert.nic.in", "t": "Geography: oceans"}, {"id": "Q427", "cat": "GK", "q": "Who appoints the Chief Justice of India?", "o": ["The Vice-President of India", "The Prime Minister of India", "The President of India", "The Speaker of the Lok Sabha"], "a": 2, "x": "Under Article 124 of the Constitution, the Chief Justice of India is appointed by the President of India.", "s": "Constitution of India, Article 124", "u": "https://legislative.gov.in", "t": "Civics: Constitution"}, {"id": "Q428", "cat": "GK", "q": "What is the national fruit of India?", "o": ["Banana", "Orange", "Apple", "Mango"], "a": 3, "x": "The mango is the national fruit of India.", "s": "Embassy of India, National Symbols of India", "u": "https://www.indianembassyzagreb.gov.in/page/national-symbols/", "t": "Culture: national symbols"}, {"id": "Q429", "cat": "GK", "q": "The first modern Olympic Games of 1896 were held in which city?", "o": ["Athens, Greece", "Paris, France", "London, England", "Berlin, Germany"], "a": 0, "x": "The first modern Olympic Games were held in Athens, Greece, in 1896, reviving the ancient Greek tradition.", "s": "Olympics.com, history of the Games", "u": "https://olympics.com", "t": "Sports: history"}, {"id": "Q441", "cat": "CA", "q": "Since 8 October 2026, the youth-led JOSH Teams have joined the fight against which disease?", "o": ["Hepatitis B", "Leprosy", "HIV/AIDS", "Tuberculosis"], "a": 3, "x": "JOSH Teams, announced by PIB on 8 October 2026, are youth-led community teams supporting the elimination of tuberculosis under TB Mukt Bharat Abhiyaan.", "s": "PIB, 8 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2320653&lang=1&reg=48", "t": "India: health"}, {"id": "Q442", "cat": "GK", "q": "Urine is formed when wastes and extra water are filtered out of the blood. Which organs do this filtering?", "o": ["Heart", "Kidneys", "Liver", "Stomach"], "a": 1, "x": "The kidneys filter wastes and extra water from the blood to form urine.", "s": "NCERT Class 7 Science, Transportation in Animals and Plants", "u": "https://ncert.nic.in", "t": "Science: human body"}, {"id": "Q443", "cat": "GK", "q": "About 78 per cent of the air around us is made up of which gas?", "o": ["Argon", "Nitrogen", "Helium", "Methane"], "a": 1, "x": "Nitrogen makes up about 78 per cent of Earth's atmosphere.", "s": "NCERT Class 6 Science, Air Around Us", "u": "https://ncert.nic.in", "t": "Science: air"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
