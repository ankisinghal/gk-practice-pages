facts/", "t": "Science and space"}, {"id": "Q010", "cat": "GK", "q": "Which planet is often called the Red Planet?", "o": ["Mars", "Mercury", "Venus", "Jupiter"], "a": 0, "x": "Mars looks red because iron minerals in its soil and dust have rusted.", "s": "NASA", "u": "https://science.nasa.gov/mars/facts/", "t": "Science and space"}, {"id": "Q232", "cat": "GK", "q": "Which town is the southernmost tip of the Indian mainland?", "o": ["Puducherry", "Thiruvananthapuram", "Rameswaram", "Kanyakumari"], "a": 3, "x": "Kanyakumari in Tamil Nadu is the mainland's southernmost tip, where the Bay of Bengal, the Indian Ocean and the Arabian Sea meet. Indira Point in the Andaman Islands lies farther south but is not on the mainland.", "s": "Britannica", "u": "https://www.britannica.com/place/Kanyakumari", "t": "Geography"}, {"id": "Q233", "cat": "GK", "q": "Who was the first Prime Minister of independent India?", "o": ["Lal Bahadur Shastri", "Jawaharlal Nehru", "Rajendra Prasad", "Sardar Vallabhbhai Patel"], "a": 1, "x": "Nehru took office on 15 August 1947 and remained Prime Minister until his death in 1964. Rajendra Prasad was the first President; Shastri was the second Prime Minister.", "s": "Britannica", "u": "https://www.britannica.com/biography/Jawaharlal-Nehru", "t": "History"}, {"id": "Q237", "cat": "CA", "q": "A bookshop display celebrates the Canadian author who received the 2026 Nobel Prize in Literature. Whose books go on the display?", "o": ["Haruki Murakami", "Margaret Atwood", "Anne Carson", "Salman Rushdie"], "a": 2, "x": "The 2026 literature laureate announced on 8 October is Anne Carson, so her books belong on the display. Atwood is Canadian too, but she is not the 2026 laureate.", "s": "NobelPrize.org, 8 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/press-release/", "t": "World: literature"}, {"id": "Q238", "cat": "CA", "q": "A wind-turbine technician books a hotel for the Windergy India 2026 trade fair, scheduled for 7-9 October. In which city is the fair?", "o": ["Chennai", "Bengaluru", "New Delhi", "Mumbai"], "a": 0, "x": "The PIB announcement of 5 October placed Windergy India 2026 at the Chennai Trade Centre, so the hotel must be booked in Chennai.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q239", "cat": "GK", "q": "In a civics quiz, Ria is asked: which directly elected House of India's Parliament is known as the House of the People?", "o": ["Supreme Court", "Rajya Sabha", "Vidhan Parishad", "Lok Sabha"], "a": 3, "x": "Lok Sabha, the directly elected House, means House of the People; Rajya Sabha is the Council of States. The quiz answer is Lok Sabha.", "s": "Digital Sansad", "u": "https://sansad.in/ls/about/introduction", "t": "Civics"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
