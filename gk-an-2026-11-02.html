en Temple (Sri Harmandir Sahib), the holiest gurdwara of Sikhism, is in which city?", "o": ["Chandigarh", "Ludhiana", "Patiala", "Amritsar"], "a": 3, "x": "The Golden Temple, also called Harmandir Sahib, stands in the heart of Amritsar, Punjab, on the waters of the Amrit Sarovar. Ludhiana and Patiala are other cities in Punjab; Chandigarh is a union territory serving as its capital.", "s": "Incredible India (official tourism)", "u": "https://www.incredibleindia.gov.in/en/punjab/amritsar/sri-harmandir-sahib-golden-temple", "t": "History and culture"}, {"id": "Q316", "cat": "GK", "q": "Which galaxy, a huge spiral system of hundreds of billions of stars, contains our Sun and solar system?", "o": ["Whirlpool", "Triangulum", "Andromeda", "Milky Way"], "a": 3, "x": "Britannica describes the Milky Way Galaxy as a large spiral system of several hundred billion stars, one of which is the Sun. Our solar system lies well inside it.", "s": "Britannica, Milky Way Galaxy, checked 2 November 2026", "u": "https://www.britannica.com/place/Milky-Way-Galaxy", "t": "Science and space"}, {"id": "Q317", "cat": "GK", "q": "Which planet, the sixth from the Sun, is famous for the beautiful ring system around it?", "o": ["Venus", "Neptune", "Saturn", "Mercury"], "a": 2, "x": "NASA says Saturn, the sixth planet from the Sun and the second largest in the solar system, is surrounded by a beautiful ring system.", "s": "NASA Science, Saturn, checked 2 November 2026", "u": "https://science.nasa.gov/saturn/", "t": "Science and space"}, {"id": "Q318", "cat": "GK", "q": "In economics, what does the term GDP stand for?", "o": ["Grand Domestic Product", "Gross Domestic Product", "General Domestic Product", "Gross Development Product"], "a": 1, "x": "GDP stands for Gross Domestic Product, the monetary value of all finished goods and services produced within a country in a given period (Investopedia).", "s": "Investopedia, checked 2 November 2026", "u": "https://www.investopedia.com/terms/g/gdp.asp", "t": "Economy"}, {"id": "Q328", "cat": "CA", "q": "India's gross GST collections came in at about Rs2.04 lakh crore, according to the monthly revenue report. That figure pertains to which month of 2026?", "o": ["October", "August", "September", "November"], "a": 2, "x": "The GST portal's monthly revenue report put India's gross GST collections for September 2026 at about Rs2.04 lakh crore. Review: new wording.", "s": "GST portal monthly revenue report, Sep 2026", "u": "https://tutorial.gst.gov.in/downloads/news/final_gst_revenue_report_for_publishing_monthly_sep_2026.pdf", "t": "Economy"}, {"id": "Q329", "cat": "CA", "q": "At the 2026 Asian Games, one country's 85-medal haul (21 gold) placed it fourth on the final medal table. Which country was it?", "o": ["India", "Kazakhstan", "Uzbekistan", "Japan"], "a": 0, "x": "India finished fourth on the final medal table of the 2026 Asian Games with 85 medals (21 gold, 27 silver, 37 bronze), ahead of Uzbekistan on silvers (Sportstar, 4 October 2026). Review: new wording.", "s": "Sportstar (The Hindu), 4 October 2026", "u": "https://sportstar.thehindu.com/asian-games/india-final-medal-tally-asian-games-2026-fourth-place-standings-gold-silver-bronze-count/article71542939.ece", "t": "Sports"}, {"id": "Q330", "cat": "CA", "q": "The Indian Air Force hosts which multinational air exercise, described by PIB on 10 October 2026?", "o": ["Garuda Shakti", "Tarang Shakti", "Vajra Prahar", "Mitra Shakti"], "a": 1, "x": "Tarang Shakti is the Indian Air Force's multinational air exercise (PIB, 10 October 2026). Review: new wording.", "s": "PIB, 10 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2321694&lang=2&reg=48", "t": "India: international cooperation"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
