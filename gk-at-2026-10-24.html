<h1>General awareness practice g250524246c</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "g250524246c", "date": "2026-10-24", "qs": [{"id": "Q158", "cat": "CA", "q": "In October 2026, the Union Cabinet approved renaming the National Social Assistance Programme (NSAP) to what?", "o": ["Bharatiya Samajik Kalyan Mission", "Pradhan Mantri Antyodaya Sahayata Yojana", "Pradhan Mantri Samajik Sahayata Yojana", "Pradhan Mantri Samajik Suraksha Yojana"], "a": 2, "x": "The Union Cabinet's 14 October 2026 decision continues the programme for 2026-27 to 2030-31 with an outlay of Rs 53,428 crore and renames NSAP as Pradhan Mantri Samajik Sahayata Yojana; sub-schemes such as IGNOAPS were also renamed.", "s": "PM India, Cabinet release, 14 October 2026; verified live 24 October 2026", "u": "https://www.pmindia.gov.in/en/news_updates/cabinet-approves-continuation-of-the-national-social-assistance-programme-for-five-years-from-2026-27-to-2030-31/", "t": "India: welfare"}, {"id": "Q159", "cat": "CA", "q": "Kashi Tamil Sangamam 5.0, to be held from 28 November to 12 December 2026, has which theme?", "o": ["Thirukkural Payilvom - Thirukkural Abhyas Karen", "Tamil Vattam - Circles of Learning", "Kashi Katha - Bridging North and South", "Sangam Vani - Voices of Two Cities"], "a": 0, "x": "Union Education Minister Pralhad Joshi launched the KTS 5.0 registration portal on 22 October 2026. The fifth edition's theme centres on the classical Tamil text Thirukkural, and the event celebrates the bonds between Tamil Nadu and Kashi.", "s": "PIB, 22 October 2026; verified live 24 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2326535&lang=1&reg=3", "t": "India: heritage"}, {"id": "Q160", "cat": "GK", "q": "Which is the largest organ of the human body?", "o": ["Heart", "Brain", "Skin", "Liver"], "a": 2, "x": "The skin is the body's largest organ overall; the liver is the largest internal organ.", "s": "Standard reference fact, compiled 24 October 2026", "u": "https://en.wikipedia.org/wiki/General_knowledge", "t": "Biology"}, {"id": "Q161", "cat": "GK", "q": "Which metal is liquid at room temperature?", "o": ["Aluminium", "Copper", "Iron", "Mercury"], "a": 3, "x": "Mercury is the only metal that stays liquid at room temperature.", "s": "Standard reference fact, compiled 24 October 2026", "u": "https://en.wikipedia.org/wiki/General_knowledge", "t": "Chemistry"}, {"id": "Q162", "cat": "GK", "q": "Which organisation developed the UPI digital payments system used across India?", "o": ["RBI", "ISRO", "NPCI", "SEBI"], "a": 2, "x": "The National Payments Corporation of India (NPCI) built the Unified Payments Interface; the RBI regulates payments but did not build UPI.", "s": "NPCI about-UPI page; verified 24 October 2026", "u": "https://www.npci.org.in/product/upi/about-upi", "t": "India: technology"}, {"id": "Q163", "cat": "GK", "q": "India's first passenger train ran in 1853 between which two places?", "o": ["Delhi and Agra", "Mumbai and Thane", "Chennai and Arcot", "Kolkata and Howrah"], "a": 1, "x": "The first passenger train ran from Bori Bunder in Mumbai to Thane on 16 April 1853, covering about 34 kilometres.", "s": "PIB railways press note; verified 24 October 2026", "u": "https://www.pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=158187&lang=1&reg=3", "t": "Railways"}, {"id": "Q164", "cat": "GK", "q": "Which Indian scientist and former President is known as the 'Missile Man of India'?", "o": ["C. V. Raman", "A. P. J. Abdul Kalam", "Vikram Sarabhai", "Homi Bhabha"], "a": 1, "x": "Dr A. P. J. Abdul Kalam led India's missile development programme and later served as the 11th President of India.", "s": "Standard reference fact, compiled 24 October 2026", "u": "https://en.wikipedia.org/wiki/General_knowledge", "t": "India: science"}, {"id": "Q152", "cat": "CA", "q": "Which Canadian author received the 2026 Nobel Prize in Literature, announced on 8 October?", "o": ["Margaret Atwood", "Haruki Murakami", "Salman Rushdie", "Anne Carson"], "a": 3, "x": "The official Nobel announcement of 8 October names Canadian author Anne Carson as the 2026 Literature laureate.", "s": "NobelPrize.org and BBC, 8 October 2026; rechecked 9-11 October 2026; reworded 24 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/press-release/", "t": "World: literature"}, {"id": "Q153", "cat": "CA", "q": "Windergy India 2026, the wind energy trade fair scheduled from 7 to 9 October, takes place at the trade centre of which city?", "o": ["Chennai", "Ahmedabad", "Mumbai", "New Delhi"], "a": 0, "x": "The PIB announcement of 5 October places Windergy India 2026 at Chennai Trade Centre from 7 to 9 October, making Chennai the host city.", "s": "PIB, 5 October 2026; rechecked 9 and 11 October 2026; reworded 24 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q154", "cat": "CA", "q": "Lothal, the ancient Harappan port chosen for the National Maritime Heritage Complex, is located in which state?", "o": ["Tamil Nadu", "West Bengal", "Kerala", "Gujarat"], "a": 3, "x": "PIB's lighthouse feature locates the Harappan site of Lothal and the planned National Maritime Heritage Complex, including a lighthouse museum, in Gujarat.", "s": "PIB, 10 October 2026; reworded 24 October 2026", "u": "https://www.pib.gov.in/FeaturesDeatils.aspx?ModuleId=2&NoteId=160404&id=160404&lang=1&reg=1", "t": "India: heritage"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
