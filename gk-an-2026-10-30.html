<script>const D={"id": "gccd9fab661", "date": "2026-10-30", "qs": [{"id": "Q193", "cat": "CA", "q": "Surya, launched at Hindustan Shipyard in Visakhapatnam in October 2026, is India's first indigenous what?", "o": ["Aircraft carrier", "Fleet Support Ship", "Nuclear submarine", "Guided-missile destroyer"], "a": 1, "x": "The 6 October report names the Fleet Support Ship Surya. The question asks the type of vessel, not its operational service status.", "s": "PIB, 6 October 2026; rechecked 10 October 2026"}, {"id": "Q178", "cat": "CA", "q": "The National Maritime Heritage Complex is coming up at which ancient Harappan port town in Gujarat?", "o": ["Lothal", "Dholavira", "Kalibangan", "Ropar"], "a": 0, "x": "The PIB lighthouse feature locates the planned National Maritime Heritage Complex at Lothal, the ancient Harappan port in Gujarat. Dholavira, Kalibangan and Ropar are other Harappan sites, not the NMHC location.", "s": "PIB, 10 October 2026"}, {"id": "Q006", "cat": "GK", "q": "Who became the first Indian to win an individual Olympic gold medal, at the 2008 Beijing Games?", "o": ["Leander Paes", "Sushil Kumar", "Abhinav Bindra", "Mary Kom"], "a": 2, "x": "Abhinav Bindra, a shooter, won India's first individual Olympic gold in Beijing in 2008.", "s": "Olympics.com"}, {"id": "Q007", "cat": "GK", "q": "In which year did India's Chandrayaan-3 lander soft-land on the Moon?", "o": ["2019", "2023", "2021", "2025"], "a": 1, "x": "Chandrayaan-3 soft-landed on the Moon on 23 August 2023.", "s": "ISRO; rechecked 6 October 2026; rechecked 7 October 2026; rechecked 8 October 2026"}, {"id": "Q066", "cat": "GK", "q": "About how long does Earth take to complete one orbit around the Sun?", "o": ["One year", "One day", "One week", "One month"], "a": 0, "x": "NASA gives about 365.25 days for one trip around the Sun. That is about one year; one day is the time for Earth's rotation.", "s": "NASA, checked 10 October 2026"}, {"id": "Q065", "cat": "GK", "q": "How many square faces does a cube have?", "o": ["Four", "Eight", "Twelve", "Six"], "a": 3, "x": "A cube has six square faces. Its eight corners and twelve edges are different counts.", "s": "Britannica, checked 10 October 2026"}, {"id": "Q059", "cat": "GK", "q": "Which organs take oxygen from inhaled air into the blood?", "o": ["Kidneys", "Stomach", "Liver", "Lungs"], "a": 3, "x": "The lungs exchange gases: oxygen enters the blood and carbon dioxide leaves it.", "s": "Britannica, checked 9 October 2026"}, {"id": "Q253", "cat": "GK", "q": "Article 51A of the Indian Constitution places protecting forests, lakes, rivers and wildlife, and having compassion for living creatures, in which category?", "o": ["Fundamental Right", "Directive Principle", "Fundamental Duty", "Emergency Power"], "a": 2, "x": "Article 51A(g) lists this among the Fundamental Duties of citizens. Duties, rights and Directive Principles are separate constitutional categories.", "s": "Constitution of India, Article 51A"}, {"id": "Q254", "cat": "GK", "q": "The paintings and cave monasteries of Ajanta in Maharashtra chiefly belong to which religious tradition?", "o": ["Buddhism", "Jainism", "Hinduism", "Sikhism"], "a": 0, "x": "Ajanta is a group of Buddhist cave temples and monasteries in Maharashtra, celebrated for its paintings. Do not confuse it with the Jain temples at Ellora.", "s": "Britannica, checked 14 October 2026"}, {"id": "Q255", "cat": "GK", "q": "If the north pole of one bar magnet is held near the north pole of another, the two poles will:", "o": ["They attract each other", "They lose all magnetism", "They become south poles", "They repel each other"], "a": 3, "x": "Like magnetic poles repel. Unlike poles, such as north and south, attract.", "s": "Britannica, checked 11 October 2026"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
