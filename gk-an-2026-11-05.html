<h1>General awareness practice gb7b47d9750</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "gb7b47d9750", "date": "2026-11-05", "qs": [{"id": "Q375", "cat": "CA", "q": "On 4 November 2026, the Union Cabinet approved a two-year extension of service for Agniveers under the Agnipath scheme. What is their total service period now?", "o": ["Four years", "Six years", "Eight years", "Five years"], "a": 1, "x": "The Union Cabinet approved a two-year Second Tour of Duty for Agniveers on 4 November 2026, raising total service from 4 to 6 years. After six years, willing Agniveers who meet selection criteria can be enrolled as regular soldiers.", "s": "The Hindu and Times of India, 4-5 November 2026", "u": "https://www.thehindu.com/news/national/agniveer-scheme-service-tenure-extension-november-4-2026/article71664932.ece", "t": "India: defence"}, {"id": "Q376", "cat": "CA", "q": "In the November 2026 US midterm elections, which party won control of both the House of Representatives and the Senate?", "o": ["Republican Party", "Libertarian Party", "Green Party", "Democratic Party"], "a": 3, "x": "AP reported that Democrats won the US House and Senate in the November 2026 midterms, taking full control of Congress.", "s": "Associated Press and The Guardian, 4 November 2026", "u": "https://apnews.com/article/midterm-election-house-senate-democrats-republicans-trump-f126e12e05b579a327b98481c0ae2226", "t": "World: US politics"}, {"id": "Q377", "cat": "GK", "q": "The holy city of Varanasi stands on the banks of which river?", "o": ["Godavari", "Brahmaputra", "Ganga", "Yamuna"], "a": 2, "x": "Varanasi, in Uttar Pradesh, stands on the banks of the Ganga (Ganges) river.", "s": "Britannica Kids, Varanasi", "u": "https://kids.britannica.com/students/article/Varanasi/277552", "t": "Geography: India"}, {"id": "Q378", "cat": "GK", "q": "Which gas do plants take in from the air to make their food by photosynthesis?", "o": ["Oxygen", "Carbon dioxide", "Hydrogen", "Nitrogen"], "a": 1, "x": "During photosynthesis, plants take in carbon dioxide and release oxygen while making food.", "s": "Britannica Kids, Photosynthesis", "u": "https://kids.britannica.com/kids/article/photosynthesis/353624", "t": "Biology: plants"}, {"id": "Q379", "cat": "GK", "q": "Who is the constitutional head of a state in India?", "o": ["Governor", "Chief Minister", "Prime Minister", "President"], "a": 0, "x": "The Governor is the constitutional head of a state in India. The Chief Minister heads the elected government.", "s": "Britannica Kids, Governor", "u": "https://kids.britannica.com/scholars/article/governor/651190", "t": "Civics: India"}, {"id": "Q380", "cat": "GK", "q": "In cricket, how many stumps make up one wicket?", "o": ["Two", "Three", "Four", "Five"], "a": 1, "x": "Under the Laws of Cricket, each wicket consists of three stumps with two bails on top.", "s": "Lords, MCC Laws of Cricket", "u": "https://www.lords.org/mcc/the-laws/the-wickets", "t": "Sports: cricket"}, {"id": "Q381", "cat": "GK", "q": "Which planet is famous for the large system of bright rings around it?", "o": ["Venus", "Mars", "Saturn", "Jupiter"], "a": 2, "x": "Saturn is surrounded by a large system of bright rings made of ice and rock particles.", "s": "Britannica Kids, Saturn", "u": "https://kids.britannica.com/kids/article/Saturn/353745", "t": "Astronomy: planets"}, {"id": "Q382", "cat": "GK", "q": "Muscat, Oman hosted the global observance of World Habitat Day 2026 under the theme 'Adequate Housing for All'. Which day was being observed?", "o": ["World Environment Day", "World Cities Day", "World Health Day", "World Habitat Day"], "a": 3, "x": "UN News reported that World Habitat Day 2026, with the theme Adequate Housing for All, was observed with its global event in Muscat, Oman.", "s": "UN News, 5 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "World: cities"}, {"id": "Q383", "cat": "GK", "q": "World leaders gathered in New York in September 2026 for the high-level week of the United Nations General Assembly's 81st session. In which city did they gather?", "o": ["Geneva", "Paris", "Vienna", "New York"], "a": 3, "x": "The 81st session of the UN General Assembly held its high-level week in September 2026 at UN Headquarters in New York.", "s": "United Nations, High-level Week 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "World"}, {"id": "Q384", "cat": "GK", "q": "World Space Week begins on 4 October each year to remember the launch of Sputnik 1, the first human-made Earth satellite. In which year was Sputnik 1 launched?", "o": ["1957", "1969", "1975", "1961"], "a": 0, "x": "Sputnik 1 was launched on 4 October 1957. World Space Week, held from 4 to 10 October, begins on that date to mark the launch.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};

</script></body></html>
