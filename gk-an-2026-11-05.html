 United Nations identifies its September 2026 high-level week as part of the 81st General Assembly session.", "s": "United Nations, High-level Week 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "World: cities"}, {"id": "Q401", "cat": "GK", "q": "World Space Week begins each year on the date marking the launch of the first human-made Earth satellite. Which satellite-and-date pairing is correct?", "o": ["Apollo 11 - 4 October", "Sputnik 1 - 10 October", "Aryabhata - 4 October", "Sputnik 1 - 4 October"], "a": 3, "x": "Sputnik 1 was launched on 4 October 1957; World Space Week begins on 4 October to mark the launch.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
