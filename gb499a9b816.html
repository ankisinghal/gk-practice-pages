ay", "World Television Day"], "a": 1, "x": "UNESCO's article dated 20 October 2026 identifies 27 October as World Day for Audiovisual Heritage, promoting the preservation of audiovisual records.", "s": "UNESCO, 20 October 2026", "u": "https://www.unesco.org/en/articles/world-day-audiovisual-heritage-protecting-memory-risk", "t": "World: heritage"}, {"id": "Q216", "cat": "GK", "q": "Which blood cells contain haemoglobin and carry oxygen from the lungs to body tissues?", "o": ["Red blood cells", "Blood platelets", "White blood cells", "Nerve cells"], "a": 0, "x": "Red blood cells contain haemoglobin, which binds oxygen and carries it to cells around the body.", "s": "NCERT, Transportation in Animals and Plants", "u": "https://ncert.nic.in/textbook/pdf/gesc107.pdf", "t": "Science: human body"}, {"id": "Q217", "cat": "GK", "q": "The Andes mountain chain runs along the western side of which continent?", "o": ["Africa", "Europe", "North America", "South America"], "a": 3, "x": "The Andes run along the western side of South America, beside the Pacific coast.", "s": "Britannica Kids, Andes", "u": "https://kids.britannica.com/kids/article/Andes/346080", "t": "World geography"}, {"id": "Q218", "cat": "GK", "q": "Who appoints the Governor of an Indian state?", "o": ["The Chief Minister", "The President", "The Chief Justice of India", "The Speaker of the Lok Sabha"], "a": 1, "x": "The President appoints a state Governor. The Chief Minister heads the state Council of Ministers.", "s": "Know India, The States", "u": "https://knowindia.gov.in/profile/the-states.php", "t": "Civics: state government"}, {"id": "Q219", "cat": "GK", "q": "A farmer exchanges a bag of rice directly for a basket of vegetables, without using money. What is this exchange called?", "o": ["Saving", "Barter", "Taxation", "Credit"], "a": 1, "x": "Barter is the direct exchange of goods or services for other goods or services without money.", "s": "NCERT, From Barter to Money", "u": "https://ncert.nic.in/textbook/pdf/gees111.pdf", "t": "Everyday economy"}, {"id": "Q220", "cat": "GK", "q": "The Great Stupa at Sanchi is in which Indian state?", "o": ["Bihar", "Odisha", "Madhya Pradesh", "Uttar Pradesh"], "a": 2, "x": "Sanchi is in Raisen district, Madhya Pradesh. It is known for its ancient Buddhist stupas and other monuments.", "s": "District Raisen, Government of Madhya Pradesh", "u": "https://raisen.nic.in/en/tourist-place/sanchi/", "t": "History and culture"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
