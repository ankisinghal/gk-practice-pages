der access to digital health resources was the theme of a conference reported on 9 October 2026 by which institution?", "o": ["The National Health Authority", "The Indian Medical Association", "The National Medical Library", "The National Medical Commission"], "a": 2, "x": "The PIB report of 9 October describes the National Medical Library conference focused on access to digital health resources.", "s": "PIB, 9 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2321201&lang=2&reg=48", "t": "India: health education"}, {"id": "Q431", "cat": "CA", "q": "Desert National Park in Rajasthan was in the news on 4 October 2026 for the release of which bird?", "o": ["The Great Indian Bustard", "The Lesser Florican", "The Himalayan Monal", "The Bengal Florican"], "a": 0, "x": "The 4 October report places the release of two male Great Indian Bustards at Sam in Desert National Park, Rajasthan.", "s": "PIB, 4 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2318842&lang=1&reg=3", "t": "India: wildlife"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
