<script>const D={"id": "g9515a365c0", "date": "2026-10-06", "qs": [{"id": "Q032", "cat": "CA", "q": "Which observatory is named in the citation for the 2026 Nobel Prize in Physics announced on 6 October?", "o": ["LIGO Observatory", "Hubble Space Telescope", "James Webb Space Telescope", "IceCube Neutrino Observatory"], "a": 3, "x": "The Nobel citation recognises Francis Halzen for his contributions to IceCube and the discovery of high-energy neutrinos from astrophysical sources.", "s": "Nobel Academy, 6 October 2026", "u": "https://www.nobelprize.org/prizes/physics/2026/press-release/", "t": "World: science"}, {"id": "Q033", "cat": "CA", "q": "The Green Energy Corridor Phase-III scheme approved on 30 September 2026 mainly strengthens transmission for which type of energy?", "o": ["Diesel road transport", "Renewable energy", "Coal mining", "Petrol refining"], "a": 1, "x": "The PIB release says the scheme strengthens intra-state transmission so electricity from renewable sources can reach the grid.", "s": "PIB, 30 September 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2316950&lang=1&reg=3", "t": "India: energy"}, {"id": "Q034", "cat": "CA", "q": "The GOBARdhan scheme launched on 1 October 2026 supports development of which fuel sector?", "o": ["Compressed biogas", "Coal-based coke", "Aviation turbine fuel", "Liquefied petroleum gas"], "a": 0, "x": "The dated PIB launch report describes GOBARdhan as a scheme for the Compressed Biogas sector.", "s": "PIB, 1 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2317937&lang=1&reg=3", "t": "India: energy"}, {"id": "Q035", "cat": "CA", "q": "The PIB announcement of 5 October placed the HAL Koraput aero-engine milestone event in which state?", "o": ["Karnataka", "Maharashtra", "Odisha", "Tamil Nadu"], "a": 2, "x": "The announcement locates HAL Koraput Division in Odisha and schedules the 2000th aero-engine milestone event for 6 October. This question asks the location, not whether the event has finished.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2319187&lang=1&reg=3", "t": "India: industry"}, {"id": "Q036", "cat": "CA", "q": "What was the theme of World Habitat Day on 5 October 2026?", "o": ["Rocket revolution", "Clean Oceans for All", "Digital Education for All", "Adequate Housing for All"], "a": 3, "x": "UN News reports that World Habitat Day 2026 focused on Adequate Housing for All. The commemoration took place in Muscat, Oman.", "s": "UN News, 5 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "World: cities"}, {"id": "Q037", "cat": "GK", "q": "How many chambers are in a normal human heart?", "o": ["Two", "Four", "Three", "Six"], "a": 1, "x": "The heart has two atria and two ventricles, making four chambers.", "s": "Britannica, checked 6 October 2026", "u": "https://www.britannica.com/science/heart", "t": "Biology"}, {"id": "Q038", "cat": "GK", "q": "Which two elements make up water?", "o": ["Hydrogen and oxygen", "Hydrogen and nitrogen", "Carbon and oxygen", "Sodium and chlorine"], "a": 0, "x": "A water molecule has two hydrogen atoms and one oxygen atom, represented by H2O.", "s": "Britannica, checked 6 October 2026", "u": "https://www.britannica.com/science/water", "t": "Chemistry"}, {"id": "Q026", "cat": "CA", "q": "According to the PIB update of 4 October 2026, how many supercomputers had India deployed under the National Supercomputing Mission by September 2026?", "o": ["14", "68", "40", "100"], "a": 2, "x": "The dated PIB update reports 40 deployed supercomputers with a combined capacity of 68 petaflops as of September 2026. The count and capacity are different measures.", "s": "PIB, 4 October 2026; rechecked 6 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10085_20261004_17525901.pdf", "t": "India: science"}, {"id": "Q028", "cat": "CA", "q": "The 2026 Nobel Prize in Physiology or Medicine, announced on 5 October, recognises discoveries behind which method?", "o": ["Carbon dating", "Optogenetics", "Plate tectonics", "Radio astronomy"], "a": 1, "x": "The Nobel Assembly awarded Karl Deisseroth, Peter Hegemann and Georg Nagel for discoveries concerning light-gated ion channels and optogenetics, a method for controlling nerve signals with light.", "s": "Nobel Assembly, 5 October 2026; rechecked 6 October 2026", "u": "https://www.nobelprize.org/prizes/medicine/2026/press-release/", "t": "World: science"}, {"id": "Q031", "cat": "GK", "q": "Which is the largest ocean on Earth?", "o": ["Pacific Ocean", "Indian Ocean", "Arctic Ocean", "Atlantic Ocean"], "a": 0, "x": "The Pacific is the largest ocean and covers about one-third of Earth's surface.", "s": "Britannica, checked 5 October 2026; rechecked 6 October 2026", "u": "https://www.britannica.com/place/Pacific-Ocean", "t": "Geography"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
