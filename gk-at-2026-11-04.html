<script>const D={"id": "g3c9379bf12", "date": "2026-11-04", "qs": [{"id": "Q349", "cat": "CA", "q": "On 30 October 2026, a GSLV Mark II rocket placed the NVS-03 satellite in orbit. NVS-03 is the third next-generation satellite of which Indian system?", "o": ["INSAT, a communication satellite series", "NavIC, India's own navigation satellite constellation", "Cartosat, an earth observation satellite series", "GAGAN, an aircraft navigation aid"], "a": 1, "x": "ISRO launched NVS-03 from Sriharikota on 30 October 2026. It is the third next-generation satellite for NavIC (Navigation with Indian Constellation), India's regional navigation system.", "s": "Space.com, 30 October 2026", "u": "https://www.space.com/space-exploration/launches-spacecraft/india-launches-nvs-03-navigation-satellite-gslv-rocket", "t": "India: space"}, {"id": "Q350", "cat": "CA", "q": "On 4 November 2026, the Union Cabinet approved a Rs 2,814 crore scheme to set up four processing plants in India. These plants will process which materials?", "o": ["Food grains for buffer stocks", "Crude oil and natural gas", "Critical minerals such as lithium and nickel", "Solar panels and modules"], "a": 2, "x": "The Cabinet approved the Capex Support Scheme to Promote Critical Mineral Processing: two lithium and two nickel processing plants, to run from FY27 to FY31, reducing import dependence.", "s": "The Statesman, 4 November 2026", "u": "https://www.thestatesman.com/cities/delhi/cabinet-approves-4-critical-mineral-processing-plants-with-rs-2814-crore-push-1503658787.html", "t": "India: economy"}, {"id": "Q142", "cat": "GK", "q": "The Prime Meridian, which passes through Greenwich, marks the zero point for which measurement?", "o": ["Greenwich Mean Time", "Altitude above sea level", "Longitude (0 degrees)", "Latitude (0 degrees)"], "a": 2, "x": "Longitude is measured east and west from the Prime Meridian at Greenwich, counted as 0 degrees. The zero line for latitude is the Equator. The historic Greenwich line and the modern satellite reference meridian differ slightly.", "s": "Royal Museums Greenwich, Prime Meridian", "u": "https://www.rmg.co.uk/stories/time/what-prime-meridian-why-it-greenwich", "t": "Geography"}, {"id": "Q145", "cat": "GK", "q": "'Jana Gana Mana', India's national anthem, was written by which famous poet?", "o": ["Rabindranath Tagore", "Sarojini Naidu", "Subhas Chandra Bose", "Bankim Chandra Chattopadhyay"], "a": 0, "x": "Tagore wrote 'Jana Gana Mana', later adopted as India's national anthem. 'Vande Mataram', the national song, was written by Bankim Chandra Chattopadhyay.", "s": "Britannica, Jana Gana Mana", "u": "https://www.britannica.com/topic/Jana-Gana-Mana", "t": "History and culture"}, {"id": "Q223", "cat": "GK", "q": "A technician wants to compare the density of a liquid with that of water. Which instrument is suitable?", "o": ["Hydrometer", "Ammeter", "Anemometer", "Barometer"], "a": 0, "x": "A hydrometer measures liquid density or specific gravity, the density relative to water.", "s": "Britannica, Hydrometer", "u": "https://www.britannica.com/science/hydrometer", "t": "Physics: instruments"}, {"id": "Q258", "cat": "GK", "q": "The Lok Sabha, whose members are directly elected by voters, is popularly known by which name?", "o": ["House of the States", "Council of the People", "Council of States", "House of the People"], "a": 3, "x": "Lok Sabha means House of the People. Rajya Sabha is the Council of States. Parliament includes the President and both Houses.", "s": "Digital Sansad, checked 12 October 2026", "u": "https://sansad.in/ls/about/introduction", "t": "Civics"}, {"id": "Q301", "cat": "GK", "q": "Which is the highest civilian award of India?", "o": ["Param Vir Chakra", "Bharat Ratna", "Padma Vibhushan", "Padma Bhushan"], "a": 1, "x": "The Bharat Ratna, instituted in 1954, is India's highest civilian award; the Padma awards rank below it. The Param Vir Chakra is a military gallantry award, not a civilian one.", "s": "Ministry of Home Affairs, Bharat Ratna award scheme", "u": "https://www.mha.gov.in/sites/default/files/Scheme-BR_1.pdf", "t": "Civics: awards"}, {"id": "Q354", "cat": "CA", "q": "Anne Carson won which 2026 Nobel Prize, announced on 8 October 2026?", "o": ["Economic Sciences", "Physics", "Literature", "Peace"], "a": 2, "x": "The 2026 Nobel Prize in Literature, announced on 8 October 2026, went to Anne Carson.", "s": "NobelPrize.org, 8 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/press-release/", "t": "World: literature"}, {"id": "Q355", "cat": "CA", "q": "Chennai's trade centre hosted Windergy India 2026 from 7 to 9 October. Windergy is a trade fair for which energy sector?", "o": ["Solar energy", "Nuclear energy", "Hydropower", "Wind energy"], "a": 3, "x": "PIB's 5 October 2026 announcement placed the Windergy India 2026 wind-energy trade fair in Chennai from 7 to 9 October.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q356", "cat": "CA", "q": "A new passenger terminal at Leh airport, announced by PIB on 14 October 2026, will come up in which part of India?", "o": ["Sikkim", "Jammu and Kashmir", "Himachal Pradesh", "Ladakh"], "a": 3, "x": "PIB announced on 14 October 2026 that Leh, in the Union Territory of Ladakh, will get a new airport passenger terminal.", "s": "PIB, 14 October 2026", "u": "https://www.pib.gov.in/PressReleasepage.aspx?PRID=2323218&lang=1&reg=48", "t": "India: infrastructure"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
