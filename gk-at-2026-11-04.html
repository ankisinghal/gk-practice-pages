al.", "s": "Britannica, Canberra", "u": "https://kids.britannica.com/students/article/Canberra/273481", "t": "World geography"}, {"id": "Q363", "cat": "GK", "q": "A star is described as being several light-years away. What quantity is being measured?", "o": ["Temperature", "Duration", "Distance", "Brightness"], "a": 2, "x": "A light-year is a unit of distance: the distance light travels in one year. It is not a unit of time.", "s": "NASA, What is a light-year?", "u": "https://science.nasa.gov/exoplanets/what-is-a-light-year/", "t": "Astronomy: measurement"}, {"id": "Q364", "cat": "GK", "q": "Which classical dance of northern India is known for storytelling, fast spins and rhythmic footwork?", "o": ["Bharatanatyam", "Kuchipudi", "Kathakali", "Kathak"], "a": 3, "x": "Kathak is a classical dance of northern India with roots in storytelling. Kathakali is a different dance form associated with Kerala.", "s": "Britannica, Classical Dances of India", "u": "https://kids.britannica.com/scholars/article/6-Classical-Dances-of-India/649165", "t": "Indian culture: dance"}, {"id": "Q365", "cat": "GK", "q": "At which level of rural local government does a Gram Panchayat work?", "o": ["District level", "Village level", "Block level", "State level"], "a": 1, "x": "A Gram Panchayat is the village-level tier of Panchayati Raj. A Gram Panchayat may cover one village or a group of villages.", "s": "Election Commission for UTs, Panchayati Raj", "u": "https://secforuts.mha.gov.in/73rd-amendment-of-panchayati-raj-in-india/", "t": "Civics: local government"}, {"id": "Q369", "cat": "GK", "q": "At standard sea-level pressure, pure water is heated to 100 degrees Celsius. Which change begins at this temperature?", "o": ["Melting from solid ice", "Boiling into water vapour", "Freezing into solid ice", "Condensing into liquid water"], "a": 1, "x": "At standard sea-level pressure, the boiling point of pure water is approximately 100 degrees Celsius.", "s": "Britannica, Boiling point", "u": "https://kids.britannica.com/scholars/article/boiling-point/80446", "t": "Science: heat"}, {"id": "Q370", "cat": "GK", "q": "A doctor explains that insulin comes from beta cells grouped in islets. In which organ are these islets found?", "o": ["Thyroid", "Kidney", "Pancreas", "Liver"], "a": 2, "x": "Beta cells in the pancreatic islets make insulin and release it into the blood.", "s": "NIDDK, Pancreatic islets", "u": "https://www.niddk.nih.gov/news/media-library/18115", "t": "Biology: hormones"}, {"id": "Q371", "cat": "GK", "q": "Which airport was named for a new passenger terminal in the Ladakh development announcement reported by PIB on 14 October 2026?", "o": ["Leh airport", "Jammu airport", "Srinagar airport", "Shimla airport"], "a": 0, "x": "The announcement concerned a new terminal at Leh airport in Ladakh. This asks the announced airport, not whether construction has finished.", "s": "PIB, 14 October 2026", "u": "https://www.pib.gov.in/PressReleasepage.aspx?PRID=2323218&lang=1&reg=48", "t": "India: infrastructure"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
