<h1>General awareness practice g2ae5ed93f1</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "g2ae5ed93f1", "date": "2026-11-26", "qs": [{"id": "g2ae5ed93f1-G01", "cat": "CA", "q": "PIB reported on 23 November 2026 that the Indian Navy received the anti-submarine warfare shallow water craft 'Ashank'. Which shipbuilder designed and built it?", "o": ["Garden Reach Shipbuilders", "Mazagon Dock Shipbuilders", "Goa Shipyard Limited", "Cochin Shipyard Limited"], "a": 0, "x": "PIB reported that Ashank, an anti-submarine warfare shallow water craft, was designed and built by Garden Reach Shipbuilders and Engineers (GRSE), Kolkata, and delivered to the Indian Navy on 23 November 2026 at Visakhapatnam.", "s": "PIB, 23 November 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2340597&lang=1&reg=48", "t": "Recent news"}, {"id": "g2ae5ed93f1-G02", "cat": "CA", "q": "The Ministry of Coal issued new mining plan and mine closure guidelines on 20 November 2026. Which technology do the guidelines newly recognise as a mining method?", "o": ["Solar thermal rock melting", "Deep-sea nodule dredging", "Asteroid ore extraction", "Underground Coal Gasification"], "a": 3, "x": "The Ministry of Coal issued its 2026 guidelines for mining plans and mine closure plans on 20 November 2026. PIB says they recognise Underground Coal Gasification as a mining method.", "s": "PIB, 23 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2340492&lang=1&reg=3", "t": "Recent news"}, {"id": "g2ae5ed93f1-G03", "cat": "GK", "q": "Tansen, a famous musician at Akbar's court, is remembered mainly for his contribution to which tradition?", "o": ["Carnatic temple dance", "Hindustani classical music", "Warli wall painting", "Folk theatre of Bengal"], "a": 1, "x": "Tansen was the most prominent musician at the Mughal emperor Akbar's court. He is remembered as a master of Hindustani classical music, one of the two main classical traditions of South Asia.", "s": "Britannica Kids, Hindustani classical music; Mughal Gardens, Music", "u": "https://kids.britannica.com/scholars/article/Hindustani-classical-music/40522", "t": "General knowledge"}, {"id": "g2ae5ed93f1-G04", "cat": "GK", "q": "The Jantar Mantar in Jaipur, a UNESCO World Heritage Site built in the early 18th century under Jai Singh II, is best described as what?", "o": ["A palace for royal weddings", "A fort for defending the city", "An astronomical observatory", "A market for spices"], "a": 2, "x": "The Jantar Mantar in Jaipur is a UNESCO World Heritage Site: an astronomical observation site built in the early 18th century under Jai Singh II. It is not a fort, palace or market.", "s": "UNESCO World Heritage Centre, Jantar Mantar, Jaipur", "u": "https://whc.unesco.org/en/list/1338/", "t": "General knowledge"}, {"id": "g2ae5ed93f1-G05", "cat": "GK", "q": "Article 21A of the Constitution of India makes which of these a Fundamental Right?", "o": ["Free, compulsory schooling for ages six to fourteen", "Equal pay for equal work, regardless of gender", "Freedom to practise any trade, craft or business", "Protection against being punished twice for one offence"], "a": 0, "x": "Article 21A, inserted by the 86th Amendment in 2002, makes free and compulsory education for children aged six to fourteen a Fundamental Right. The other options describe different rights or ideas.", "s": "Ministry of Education, Right to Education", "u": "https://www.education.gov.in/en/rte", "t": "General knowledge"}, {"id": "g2ae5ed93f1-G06", "cat": "GK", "q": "Kavaratti is the capital of which Union Territory made up of coral islands in the Arabian Sea?", "o": ["Daman and Diu", "Andaman and Nicobar Islands", "Puducherry", "Lakshadweep"], "a": 3, "x": "Kavaratti is the capital of the Union Territory of Lakshadweep, a group of coral islands in the Arabian Sea off the Kerala coast.", "s": "Lakshadweep Administration, Kavaratti", "u": "https://lakshadweep.gov.in/islands/kavaratti/", "t": "General knowledge"}, {"id": "g2ae5ed93f1-G07", "cat": "GK", "q": "The Hornbill Festival, called the 'Festival of Festivals' and held each December at Kisama near Kohima, is a festival of which state?", "o": ["Arunachal Pradesh", "Nagaland", "Mizoram", "Meghalaya"], "a": 1, "x": "The Hornbill Festival, called the Festival of Festivals, is held every year in Nagaland. The 2026 festival is at the Naga Heritage Village in Kisama near Kohima.", "s": "Incredible India, Hornbill Festival", "u": "https://www.incredibleindia.gov.in/en/nagaland/kohima/hornbill-festival", "t": "General knowledge"}, {"id": "g2ae5ed93f1-G08", "cat": "GK", "q": "A library display for the 2026 Nobel Prizes lists the literature winner announced on 8 October. Which author is named?", "o": ["Annie Ernaux", "Anne Carson", "Han Kang", "Louise Gluck"], "a": 1, "x": "The Nobel Prize in Literature for 2026 was awarded to the Canadian author Anne Carson, as announced on 8 October 2026. Han Kang, Louise Gluck and Annie Ernaux won in other years.", "s": "NobelPrize.org, Press release, 8 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/press-release/", "t": "Revision"}, {"id": "g2ae5ed93f1-G09", "cat": "GK", "q": "A poster for the Windergy India 2026 wind-energy trade fair, held from 7 to 9 October, gives the venue city. Which city is it?", "o": ["Pune", "Kolkata", "Chennai", "Bengaluru"], "a": 2, "x": "Windergy India 2026 was held at the Chennai Trade Centre from 7 to 9 October 2026, according to the PIB announcement of 5 October. Pune, Bengaluru and Kolkata were not the venue.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "Revision"}, {"id": "g2ae5ed93f1-G10", "cat": "GK", "q": "A school trip leaflet says the National Maritime Heritage Complex, planned near the ancient dockyard site at Lothal, is in which state?", "o": ["Gujarat", "Maharashtra", "Rajasthan", "Odisha"], "a": 0, "x": "A PIB feature of 10 October 2026 says the National Maritime Heritage Complex, with a planned 77-metre Lighthouse Museum, is at Lothal in Gujarat, an important archaeological site tied to ancient maritime trade.", "s": "PIB feature, 10 October 2026", "u": "https://www.pib.gov.in/FeaturesDeatils.aspx?ModuleId=2&NoteId=160404&id=160404&lang=1&reg=1", "t": "Revision"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
