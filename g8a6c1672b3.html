<h1>General awareness practice g8a6c1672b3</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "g8a6c1672b3", "date": "2026-10-08", "qs": [{"id": "Q046", "cat": "CA", "q": "Who was awarded the 2026 Nobel Prize in Literature on 8 October?", "o": ["Haruki Murakami", "Anne Carson", "Margaret Atwood", "Salman Rushdie"], "a": 1, "x": "The official Nobel homepage names Canadian author Anne Carson. The announcement was also reported by BBC on 8 October.", "s": "NobelPrize.org and BBC, 8 October 2026", "u": "https://www.nobelprize.org/", "t": "World: literature"}, {"id": "Q047", "cat": "CA", "q": "The JOSH Teams initiative announced by PIB on 8 October supports efforts to eliminate which disease?", "o": ["Polio", "Measles", "Malaria", "Tuberculosis"], "a": 3, "x": "The dated health ministry release describes youth-led community action by JOSH Teams to support tuberculosis elimination.", "s": "PIB, 8 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2320653&lang=1&reg=48", "t": "India: health"}, {"id": "Q048", "cat": "CA", "q": "Which city hosts Windergy India 2026, according to the PIB announcement of 5 October?", "o": ["Chennai", "Ahmedabad", "Mumbai", "New Delhi"], "a": 0, "x": "The dated announcement places Windergy India at Chennai Trade Centre from 7 to 9 October. This question asks the venue city, not whether an inauguration has finished.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q049", "cat": "CA", "q": "What is the theme of India Mobile Congress 2026, according to PIB on 5 October?", "o": ["Imagine One Asia", "Adequate Housing for All", "Scale Without Boundaries", "Rocket Revolution"], "a": 2, "x": "The telecom ministry release gives Scale Without Boundaries as the theme of India Mobile Congress 2026.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319395&reg=48", "t": "India: technology"}, {"id": "Q050", "cat": "CA", "q": "A PIB report on 2 October described a tigress release at Buxa Tiger Reserve. In which state is Buxa?", "o": ["Bihar", "West Bengal", "Rajasthan", "Assam"], "a": 1, "x": "The dated wildlife release locates Buxa Tiger Reserve in West Bengal and describes a phased tiger reintroduction programme.", "s": "PIB, 2 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2318110&lang=1&reg=3", "t": "India: wildlife"}, {"id": "Q051", "cat": "GK", "q": "Which gas makes up the largest share of Earth's atmosphere?", "o": ["Carbon dioxide", "Helium", "Oxygen", "Nitrogen"], "a": 3, "x": "NASA describes the air mixture as about 78 percent nitrogen and 21 percent oxygen. Nitrogen therefore makes up the largest share.", "s": "NASA, checked 8 October 2026", "u": "https://science.nasa.gov/solar-system/10-things-planetary-atmospheres/", "t": "Science"}, {"id": "Q052", "cat": "GK", "q": "During evaporation, liquid water changes into what?", "o": ["Water vapour", "Salt", "Liquid oxygen", "Ice"], "a": 0, "x": "Evaporation changes water from liquid into gas at the surface. Water vapour is the gaseous form of water.", "s": "Britannica, checked 8 October 2026", "u": "https://www.britannica.com/science/evaporation", "t": "Science"}, {"id": "Q026", "cat": "CA", "q": "According to the PIB update of 4 October 2026, how many supercomputers had India deployed under the National Supercomputing Mission by September 2026?", "o": ["100", "68", "40", "14"], "a": 2, "x": "The dated PIB update reports 40 deployed supercomputers with a combined capacity of 68 petaflops as of September 2026. The count and capacity are different measures.", "s": "PIB, 4 October 2026; rechecked 6 October 2026; rechecked 7 October 2026; rechecked 8 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10085_20261004_17525901.pdf", "t": "India: science"}, {"id": "Q032", "cat": "CA", "q": "Which observatory is named in the citation for the 2026 Nobel Prize in Physics announced on 6 October?", "o": ["IceCube Neutrino Observatory", "LIGO Observatory", "Hubble Space Telescope", "James Webb Space Telescope"], "a": 0, "x": "The Nobel citation recognises Francis Halzen for his contributions to IceCube and the discovery of high-energy neutrinos from astrophysical sources.", "s": "Nobel Academy, 6 October 2026; rechecked 7 October 2026; rechecked 8 October 2026", "u": "https://www.nobelprize.org/prizes/physics/2026/press-release/", "t": "World: science"}, {"id": "Q033", "cat": "CA", "q": "The Green Energy Corridor Phase-III scheme approved on 30 September 2026 mainly strengthens transmission for which type of energy?", "o": ["Petrol refining", "Renewable energy", "Diesel road transport", "Coal mining"], "a": 1, "x": "The PIB release says the scheme strengthens intra-state transmission so electricity from renewable sources can reach the grid.", "s": "PIB, 30 September 2026; rechecked 7 October 2026; rechecked 8 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2316950&lang=1&reg=3", "t": "India: energy"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
