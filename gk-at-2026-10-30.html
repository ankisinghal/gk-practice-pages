": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/animal/blue-whale", "t": "Animals and nature"}, {"id": "Q244", "cat": "GK", "q": "Which metal is liquid at room temperature?", "o": ["Iron", "Copper", "Mercury", "Aluminium"], "a": 2, "x": "Britannica notes mercury is the only elemental metal that is liquid at room temperature. Iron, copper and aluminium are solids under ordinary conditions.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/science/mercury-chemical-element", "t": "Science: chemistry"}, {"id": "Q246", "cat": "GK", "q": "Which animal, famous for its speed, has had sprints measured at up to about 114 km/h?", "o": ["Cheetah", "Lion", "Leopard", "Tiger"], "a": 0, "x": "Britannica reports that cheetahs' sprints have been measured at a maximum of 114 km (71 miles) per hour, and that the cheetah is known especially for its speed.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/animal/cheetah-mammal", "t": "Animals and nature"}, {"id": "Q245", "cat": "GK", "q": "Who is best remembered for inventing the telephone?", "o": ["Thomas Edison", "Alexander Graham Bell", "Nikola Tesla", "Guglielmo Marconi"], "a": 1, "x": "Britannica describes Alexander Graham Bell as the scientist and teacher best remembered for inventing the telephone.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/biography/Alexander-Graham-Bell", "t": "History: inventions"}, {"id": "Q256", "cat": "GK", "q": "Which constitutional body holds the superintendence, direction and control of elections to Parliament under Article 324?", "o": ["Union Public Service Commission", "Finance Commission", "Comptroller and Auditor General", "Election Commission"], "a": 3, "x": "Article 324 vests these election responsibilities in the Election Commission. The other institutions have different constitutional roles.", "s": "Constitution of India, Article 324", "u": "https://indiacode.ecourtsindia.com/constitution-of-india/article/324/", "t": "Civics"}, {"id": "Q257", "cat": "GK", "q": "The delta formed by the Ganges and the Brahmaputra drains into which body of water?", "o": ["Bay of Bengal", "Arabian Sea", "Gulf of Kachchh", "Gulf of Mannar"], "a": 0, "x": "The Ganges and Brahmaputra reach the Bay of Bengal through their delta. The Arabian Sea lies on the other side of India.", "s": "Britannica, checked 13 October 2026", "u": "https://www.britannica.com/place/Ganges-River", "t": "Geography"}, {"id": "Q258", "cat": "GK", "q": "The Lok Sabha, whose members are directly elected by voters, is popularly known by which name?", "o": ["Council of States", "House of the States", "House of the People", "Council of the People"], "a": 2, "x": "Lok Sabha means House of the People. Rajya Sabha is the Council of States. Parliament includes the President and both Houses.", "s": "Digital Sansad, checked 12 October 2026", "u": "https://sansad.in/ls/about/introduction", "t": "Civics"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
