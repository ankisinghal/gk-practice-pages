<script>const D={"id": "g99a57ad1a2", "date": "2026-11-03", "qs": [{"id": "Q333", "cat": "CA", "q": "Which country hosted the global observance of World Cities Day 2026 in Fuzhou on 31 October?", "o": ["Thailand", "China", "Japan", "Indonesia"], "a": 1, "x": "The UN named Fuzhou, China, as the host of the 2026 global observance. Its theme focused on urban regeneration and adequate housing.", "s": "United Nations, World Cities Day 2026", "u": "https://www.un.org/en/observances/cities-day", "t": "World: cities"}, {"id": "Q334", "cat": "CA", "q": "UNESCO announced which theme for the school-violence and bullying prevention day to be observed on 5 November 2026?", "o": ["Every learner safe and well: From promise to practice", "Education for a greener world: From ideas to action", "Learning for a digital future: Skills for all", "Schools without borders: A shared global classroom"], "a": 0, "x": "UNESCO announced Every learner safe and well: From promise to practice as the theme of the 5 November 2026 observance. This question concerns the announced theme, not completion of the event.", "s": "UNESCO, 2026 observance", "u": "https://www.unesco.org/en/days/against-school-violence-and-bullying", "t": "World: education"}, {"id": "Q335", "cat": "GK", "q": "Which plant tissue carries water and dissolved minerals from the roots to the rest of the plant?", "o": ["Cork", "Xylem", "Epidermis", "Phloem"], "a": 1, "x": "Xylem conducts water and dissolved minerals. Phloem mainly carries sugars made by the leaves.", "s": "Britannica, Xylem", "u": "https://www.britannica.com/science/xylem", "t": "Biology"}, {"id": "Q336", "cat": "GK", "q": "Dry ice changes directly from solid carbon dioxide to gas without becoming liquid. What is this change called?", "o": ["Sublimation", "Condensation", "Melting", "Freezing"], "a": 0, "x": "Sublimation is a direct solid-to-gas change. Dry ice provides a familiar example.", "s": "Britannica, Sublimation", "u": "https://www.britannica.com/science/sublimation-phase-change", "t": "Physics"}, {"id": "Q337", "cat": "GK", "q": "On a topographic map, a contour line joins points with the same what?", "o": ["Average rainfall over the year", "Distance from the nearest town", "Amount of vegetation cover", "Elevation above a reference level"], "a": 3, "x": "Contour lines join points of equal elevation, usually measured from mean sea level. Their spacing helps show the shape of the land.", "s": "Britannica, Contour line", "u": "https://www.britannica.com/science/contour-line", "t": "Geography"}, {"id": "Q338", "cat": "GK", "q": "The ancient Indian text Arthashastra, on statecraft and administration, is traditionally attributed to whom?", "o": ["Panini", "Charaka", "Kautilya", "Kalidasa"], "a": 2, "x": "The Arthashastra is traditionally attributed to Kautilya, also known as Chanakya. It discusses government, the economy and statecraft.", "s": "Britannica, Artha-shastra", "u": "https://www.britannica.com/topic/Artha-shastra", "t": "History and culture"}, {"id": "Q339", "cat": "GK", "q": "The famous temple at Konark was designed as the chariot of which deity?", "o": ["Ganesha, associated with beginnings", "Vishnu, associated with preservation", "Shiva, associated with destruction", "Surya, the Sun god"], "a": 3, "x": "UNESCO describes the Konark temple as a monumental representation of the chariot of Surya, the Sun god.", "s": "UNESCO World Heritage, Konark", "u": "https://whc.unesco.org/en/list/246/", "t": "History and culture"}, {"id": "Q343", "cat": "CA", "q": "Youth-led JOSH Teams were launched under TB Mukt Bharat Abhiyaan in October 2026. Which disease does that campaign target?", "o": ["Measles", "Malaria", "Tuberculosis", "Polio"], "a": 2, "x": "The health ministry release links JOSH Teams with community action for tuberculosis prevention, diagnosis and treatment.", "s": "PIB, 8 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2320653&lang=1&reg=48", "t": "India: health"}, {"id": "Q344", "cat": "CA", "q": "A proposed lighthouse museum forms part of the National Maritime Heritage Complex at Lothal. In which state is this site?", "o": ["Tamil Nadu", "Kerala", "Gujarat", "West Bengal"], "a": 2, "x": "The PIB heritage feature locates Lothal and the planned complex in Gujarat. The question asks the location, not whether construction is complete.", "s": "PIB, 10 October 2026", "u": "https://www.pib.gov.in/FeaturesDeatils.aspx?ModuleId=2&NoteId=160404&id=160404&lang=1&reg=1", "t": "India: heritage"}, {"id": "Q345", "cat": "GK", "q": "At which 1757 battle did Robert Clive's East India Company army defeat the forces of Siraj al-Dawlah?", "o": ["Buxar", "Plassey", "Haldighati", "First Panipat"], "a": 1, "x": "The Battle of Plassey took place on 23 June 1757. Clive led the Company army against Siraj al-Dawlah's forces.", "s": "Britannica, Battle of Plassey", "u": "https://www.britannica.com/event/Battle-of-Plassey", "t": "History and culture"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
