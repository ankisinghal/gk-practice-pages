e Creativity category at Rome, chosen from over 7,000 applications from 190 countries.", "s": "The Economic Times, 30 October 2026", "u": "https://economictimes.indiatimes.com/news/india/mothers-of-courage-documentary-on-girls-education-in-bihar-wins-un-sdg-action-award/articleshow/135368133.cms", "t": "India: education"}, {"id": "Q275", "cat": "CA", "q": "Manisha Bhanwala became the first Indian woman to win a gold medal at which event, rallying to beat Abigail Nette of the USA 8-6 in the final in Astana?", "o": ["World Boxing Championships", "World Badminton Championships", "World Weightlifting Championships", "World Wrestling Championships"], "a": 3, "x": "PTI reported on 31 October 2026 that Manisha Bhanwala won the 59 kg final at the World Wrestling Championships in Astana, coming back from 1-6 down to win 8-6, the first Indian woman to take gold at this championship.", "s": "PTI via Mid-Day, 31 October 2026", "u": "https://www.mid-day.com/sports/other-sports/article/manisha-bhanwala-etches-her-name-in-historic-gold-23657814", "t": "Sports: wrestling"}, {"id": "Q276", "cat": "GK", "q": "Which instrument records the shaking of the ground during an earthquake?", "o": ["Seismograph", "Thermometer", "Barometer", "Anemometer"], "a": 0, "x": "A seismograph detects and records the ground's shaking during an earthquake. A thermometer measures temperature and a barometer measures air pressure, so they cannot record earthquakes.", "s": "Britannica, seismograph, checked 31 October 2026", "u": "https://www.britannica.com/technology/seismograph", "t": "General science"}, {"id": "Q277", "cat": "GK", "q": "Which is the largest freshwater lake in India?", "o": ["Dal Lake", "Wular Lake", "Chilika Lake", "Pangong Tso"], "a": 1, "x": "Wular Lake in Jammu and Kashmir is India's largest freshwater lake. Chilika is a brackish-water lagoon and Pangong Tso is saline, so they are not freshwater lakes.", "s": "Britannica, checked 31 October 2026", "u": "https://www.britannica.com/place/
