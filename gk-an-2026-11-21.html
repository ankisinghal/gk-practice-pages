<h1>General awareness practice ge609b554d9</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "ge609b554d9", "date": "2026-11-21", "qs": [{"id": "Q722", "cat": "CA", "q": "The UN observance on 21 November 2026 recognises which communication medium?", "o": ["Television", "Radio", "Newspapers", "Postal mail"], "a": 0, "x": "The UN designated 21 November as World Television Day, recognising television as a tool for informing public opinion.", "s": "United Nations, World Television Day", "u": "https://www.un.org/en/observances/world-television-day", "t": "World: communication"}, {"id": "Q723", "cat": "CA", "q": "UNESCO scheduled its 19 November 2026 World Philosophy Day programme at its headquarters in which city?", "o": ["Nairobi", "Vienna", "Geneva", "Paris"], "a": 3, "x": "The UNESCO event listing scheduled the World Philosophy Day programme at its headquarters in Paris on 19 November 2026. This verifies the announced venue, not attendance or completion.", "s": "UNESCO, World Philosophy Day 2026", "u": "https://www.unesco.org/en/articles/world-philosophy-day-2026", "t": "World: philosophy"}, {"id": "Q724", "cat": "GK", "q": "A submerged object feels an upward buoyant force equal to the weight of what?", "o": ["The object above the fluid", "The air above the fluid", "The fluid it displaces", "The container holding the fluid"], "a": 2, "x": "Archimedes principle says the buoyant force equals the weight of fluid displaced by the submerged part of the object.", "s": "Britannica Students, Archimedes principle", "u": "https://kids.britannica.com/students/article/Archimedes-principle/599600", "t": "Science: buoyancy"}, {"id": "Q725", "cat": "GK", "q": "Mangrove trees are especially associated with which environment?", "o": ["Dry inland sand dunes", "Alpine snow-covered slopes", "Cold freshwater glaciers", "Coastal intertidal zones"], "a": 3, "x": "NOAA identifies mangroves as trees and shrubs that live in the coastal intertidal zone, where tides regularly cover and uncover the ground.", "s": "NOAA, Mangrove forests", "u": "https://oceanservice.noaa.gov/facts/mangroves.html", "t": "Geography: coastal vegetation"}, {"id": "Q726", "cat": "GK", "q": "A straw looks bent at the surface of water because light changes direction between water and air. What is this called?", "o": ["Absorption", "Evaporation", "Refraction", "Reflection"], "a": 2, "x": "Refraction is the change of direction of light as it passes between materials. It makes a partially submerged straw appear bent.", "s": "Britannica Kids, Optics", "u": "https://kids.britannica.com/kids/article/optics/390822", "t": "Science: optics"}, {"id": "Q727", "cat": "GK", "q": "A constitution divides governing powers between a national government and regional governments. Which system does this describe?", "o": ["Military government", "Absolute monarchy", "Federalism", "Direct democracy"], "a": 2, "x": "In a federal system, constitutional arrangements divide or share powers between the general government and constituent states or regions.", "s": "Britannica, Federalism", "u": "https://kids.britannica.com/scholars/article/federalism/33900", "t": "Civics: government systems"}, {"id": "Q728", "cat": "GK", "q": "What is the payment made to an insurance company to keep insurance cover in place called?", "o": ["Subsidy", "Premium", "Dividend", "Pension"], "a": 1, "x": "An insurance premium is the payment for the cover promised by the insurance policy. It is not a payout on a claim or a return to a shareholder.", "s": "Britannica Students, Insurance", "u": "https://kids.britannica.com/students/article/insurance/275069", "t": "Economy: insurance"}, {"id": "Q729", "cat": "CA", "q": "A 2026 World Habitat Day poster should emphasise which of these needs?", "o": ["Competitive sport for all", "Adequate housing for all", "School uniforms for all", "Airline travel for all"], "a": 1, "x": "The UN lists Adequate Housing for All as the 2026 World Habitat Day theme. This question refers to that fixed campaign year.", "s": "United Nations, World Habitat Day 2026", "u": "https://www.un.org/en/observances/habitat-day", "t": "Review: cities"}, {"id": "Q730", "cat": "CA", "q": "The UN General Assembly high-level week of September 2026 belongs to which session?", "o": ["82nd", "80th", "83rd", "81st"], "a": 3, "x": "The UN High-level Week 2026 page identifies the event with the General Assembly 81st session.", "s": "United Nations, High-level Week 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "Review: United Nations"}, {"id": "Q731", "cat": "CA", "q": "The satellite launch commemorated at the start of World Space Week on 4 October was which one?", "o": ["Sputnik 1", "Explorer 1", "Vostok 1", "Luna 2"], "a": 0, "x": "World Space Week begins on 4 October, the anniversary of the 1957 launch of Sputnik 1, the first human-made Earth satellite.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Review: space history"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.getElementById("copy").textContent="Copy failed - code selected; copy manually"}};
</script></body></html>
