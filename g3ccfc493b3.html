<script>const D={"id": "g3ccfc493b3", "date": "2026-10-05", "qs": [{"id": "Q025", "cat": "CA", "q": "Which institutions does PM-SETU focus on upgrading, according to the PIB update of 3 October 2026?", "o": ["District courts", "Public libraries", "Government Industrial Training Institutes (ITIs)", "Primary schools"], "a": 2, "x": "PM-SETU is a vocational-skills programme focused on modernising Government ITIs and making their training more relevant to industry.", "s": "PIB, 3 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10077_20261003_15142301.pdf", "t": "India: skills"}, {"id": "Q026", "cat": "CA", "q": "According to the PIB update of 4 October 2026, how many supercomputers had India deployed under the National Supercomputing Mission by September 2026?", "o": ["40", "68", "100", "14"], "a": 0, "x": "The dated PIB update reports 40 deployed supercomputers with a combined capacity of 68 petaflops as of September 2026. The count and capacity are different measures.", "s": "PIB, 4 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10085_20261004_17525901.pdf", "t": "India: science"}, {"id": "Q027", "cat": "CA", "q": "The October 2026 ESTIC science and technology conclave is scheduled at Bharat Mandapam in which Indian city?", "o": ["Bengaluru", "Hyderabad", "Mumbai", "New Delhi"], "a": 3, "x": "The PIB update of 4 October lists ESTIC-2026 for 27-29 October at Bharat Mandapam, New Delhi. This is a scheduled event, not a completed one.", "s": "PIB, 4 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10085_20261004_17525901.pdf", "t": "India: science"}, {"id": "Q028", "cat": "CA", "q": "The 2026 Nobel Prize in Physiology or Medicine, announced on 5 October, recognises discoveries behind which method?", "o": ["Radio astronomy", "Optogenetics", "Carbon dating", "Plate tectonics"], "a": 1, "x": "The Nobel Assembly awarded Karl Deisseroth, Peter Hegemann and Georg Nagel for discoveries concerning light-gated ion channels and optogenetics, a method for controlling nerve signals with light.", "s": "Nobel Assembly, 5 October 2026", "u": "https://www.nobelprize.org/prizes/medicine/2026/press-release/", "t": "World: science"}, {"id": "Q029", "cat": "CA", "q": "What is the theme of World Space Week 2026, according to UN News on 4 October?", "o": ["Digital farming", "Ocean restoration", "Rocket revolution", "Polar exploration"], "a": 2, "x": "The dated UN News article names Rocket revolution as the 2026 theme, focusing on changes in how people reach space.", "s": "UN News, 4 October 2026", "u": "https://news.un.org/en/story/2026/10/1168517", "t": "World: space"}, {"id": "Q030", "cat": "GK", "q": "Which green pigment in plants absorbs light energy for photosynthesis?", "o": ["Chlorophyll", "Hemoglobin", "Keratin", "Melanin"], "a": 0, "x": "Chlorophyll is a key pigment involved in photosynthesis. It absorbs light energy used by plants to make food.", "s": "Britannica, checked 5 October 2026", "u": "https://www.britannica.com/science/chlorophyll", "t": "Science"}, {"id": "Q031", "cat": "GK", "q": "Which is the largest ocean on Earth?", "o": ["Arctic Ocean", "Indian Ocean", "Atlantic Ocean", "Pacific Ocean"], "a": 3, "x": "The Pacific is the largest ocean and covers about one-third of Earth's surface.", "s": "Britannica, checked 5 October 2026", "u": "https://www.britannica.com/place/Pacific-Ocean", "t": "Geography"}, {"id": "Q011", "cat": "CA", "q": "India won the Women's Asia Cup in September 2026. How many titles has India now won in the tournament?", "o": ["Six", "Eight", "Seven", "Nine"], "a": 1, "x": "India beat Sri Lanka in the final on 13 September 2026 and went through the tournament unbeaten, a record-extending eighth title.", "s": "ICC, 13 Sep 2026", "u": "https://www.icc-cricket.com/news/india-cruise-to-record-extending-eighth-women-s-asia-cup-title", "t": "Sports"}, {"id": "Q005", "cat": "CA", "q": "On which date did the 2026 Nobel Prize announcements begin?", "o": ["12 October", "9 October", "5 October", "1 October"], "a": 2, "x": "The official 2026 announcement schedule begins on 5 October and ends on 12 October. This date was rechecked on 5 October 2026.", "s": "nobelprize.org", "u": "https://www.nobelprize.org/prizes/about/prize-announcement-dates/", "t": "World"}, {"id": "Q007", "cat": "GK", "q": "In which year did India's Chandrayaan-3 lander soft-land on the Moon?", "o": ["2019", "2025", "2021", "2023"], "a": 3, "x": "Chandrayaan-3 soft-landed on the Moon on 23 August 2023.", "s": "ISRO", "u": "https://www.isro.gov.in/Chandrayaan3.html", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
