46&lang=1&reg=3", "t": "India: defence"}, {"id": "Q306", "cat": "CA", "q": "Which clean-energy event in New Delhi was the Prime Minister scheduled to inaugurate on 2 November 2026?", "o": ["India Wind Energy Conclave 2026", "Bharat Renewable Energy Summit & Expo 2026", "National Green Hydrogen Mission Expo 2026", "International Solar Technology Summit 2026"], "a": 1, "x": "The Prime Minister was scheduled to inaugurate the Bharat Renewable Energy Summit & Expo 2026, a global clean-energy platform, in New Delhi on 2 November 2026 (PM India and PIB announcements, 1 November 2026).", "s": "PM India, 1 November 2026", "u": "https://www.pmindia.gov.in/en/news_updates/pm-to-inaugurate-bharat-renewable-energy-summit-expo-2026-on-2nd-november/", "t": "India: energy"}, {"id": "Q265", "cat": "GK", "q": "Which is the highest mountain in the world above sea level?", "o": ["Makalu", "Mount Everest", "Kangchenjunga", "K2"], "a": 1, "x": "Britannica states: 'Reaching an elevation of 29,032 feet (8,849 meters), Mount Everest is the highest mountain in the world.' It stands in the Himalayas on the Nepal-China (Tibet) border. Checked 30 October 2026.", "s": "Encyclopaedia Britannica, checked 30 October 2026", "u": "https://www.britannica.com/place/Mount-Everest", "t": "World geography"}, {"id": "Q244", "cat": "GK", "q": "Which metal is liquid at room temperature?", "o": ["Mercury", "Aluminium", "Iron", "Copper"], "a": 0, "x": "Britannica notes mercury is the only elemental metal that is liquid at room temperature. Iron, copper and aluminium are solids under ordinary conditions.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/science/mercury-chemical-element", "t": "Science: chemistry"}, {"id": "Q234", "cat": "GK", "q": "Every morning, a Delhi school assembly sings Jana Gana Mana. Who wrote the words of this song?", "o": ["Bankim Chandra Chatterjee", "Sarojini Naidu", "Rabindranath Tagore", "Muhammad Iqbal"], "a": 2, "x": "Tagore wrote Jana Gana Mana; th
