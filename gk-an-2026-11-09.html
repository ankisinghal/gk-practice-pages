, {"id": "Q467", "cat": "GK", "q": "According to Encyclopaedia Britannica, which river is the longest in the world?", "o": ["The Amazon", "The Yangtze", "The Nile", "The Mississippi"], "a": 2, "x": "The Nile in Africa is the longest river in the world, about 6,650 km (Britannica).", "s": "Britannica", "u": "https://www.britannica.com/place/Nile-River", "t": "Geography: world"}, {"id": "Q468", "cat": "GK", "q": "Which light gas is filled in party balloons to make them float in the air?", "o": ["Nitrogen", "Helium", "Carbon dioxide", "Oxygen"], "a": 1, "x": "Helium is lighter than air and does not catch fire, so it lifts balloons safely (NASA).", "s": "NASA reference", "u": "https://science.nasa.gov/resource/helium/", "t": "Science: everyday"}, {"id": "Q480", "cat": "GK", "q": "Who was the first President of India?", "o": ["Jawaharlal Nehru", "Dr. Rajendra Prasad", "Dr. B. R. Ambedkar", "Dr. S. Radhakrishnan"], "a": 1, "x": "Dr. Rajendra Prasad became India's first President in 1950; Radhakrishnan was the first Vice-President, Nehru the first Prime Minister (Britannica).", "s": "Britannica reference", "u": "https://www.britannica.com/biography/Rajendra-Prasad", "t": "History: modern India"}, {"id": "Q471", "cat": "CA", "q": "A school noticeboard marks World Habitat Day 2026. Which theme should it show?", "o": ["Sustainable Transport for All", "Clean Water for All", "Adequate Housing for All", "Green Energy for All"], "a": 2, "x": "World Habitat Day 2026 (5 October) carried the theme 'Adequate Housing for All' (UN-Habitat).", "s": "UN-Habitat, October 2026", "u": "https://unhabitat.org/world-habitat-day", "t": "World: cities"}, {"id": "Q472", "cat": "CA", "q": "A current-affairs quiz asks about the UN high-level week of September 2026. Which General Assembly session number is the right answer?", "o": ["78th", "80th", "81st", "82nd"], "a": 2, "x": "The September 2026 high-level week belonged to the 81st session of the UN General Assembly (UN).", "s": "UN General Assembly, September 2026", "u": "https://www.un.org/en/ga/", "t": "World"}, {"id": "Q473", "cat": "CA", "q": "World Space Week opens every 4 October. A student asks why that date was picked. Which 1957 event does it mark?", "o": ["The first human journey into space", "The founding of NASA", "The first Moon flyby", "The launch of Sputnik 1"], "a": 3, "x": "4 October 1957 saw the launch of Sputnik 1, the first human-made satellite; World Space Week starts on that anniversary (UN).", "s": "UN World Space Week", "u": "https://www.worldspaceweek.org/", "t": "World: space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
