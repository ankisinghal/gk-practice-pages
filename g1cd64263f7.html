 "General science"}, {"id": "Q139", "cat": "GK", "q": "Which is the smallest continent in the world?", "o": ["Antarctica", "Australia", "South America", "Europe"], "a": 1, "x": "Australia is the smallest continent; Asia is the largest.", "s": "Britannica Kids, continent", "u": "https://kids.britannica.com/students/article/continent/273790", "t": "World geography"}, {"id": "Q140", "cat": "GK", "q": "How many colours are there in a rainbow?", "o": ["Six", "Seven", "Five", "Eight"], "a": 1, "x": "A rainbow shows seven colours: violet, indigo, blue, green, yellow, orange and red.", "s": "NCERT Class 10 Science, The Human Eye and the Colourful World", "u": "https://ncert.nic.in/textbook/pdf/jesc110.pdf", "t": "General science"}, {"id": "Q141", "cat": "GK", "q": "Which festival is known as the Festival of Lights?", "o": ["Eid", "Holi", "Diwali", "Christmas"], "a": 2, "x": "Diwali, the Festival of Lights, is celebrated with rows of lamps and candles; it falls in October or November.", "s": "Britannica, Diwali", "u": "https://kids.britannica.com/scholars/article/Diwali/30695", "t": "History and culture"}, {"id": "Q148", "cat": "GK", "q": "Of all the stars, which one is closest to the Earth?", "o": ["The Moon", "Polaris", "The Sun", "Mars"], "a": 2, "x": "At about 150 million kilometres away, the Sun is Earth's closest star; the next nearest, Proxima Centauri, is far farther still. The Moon is not a star, and Mars is a planet.", "s": "Britannica, Sun", "u": "https://www.britannica.com/place/Sun", "t": "Science and space"}, {"id": "Q144", "cat": "CA", "q": "Since the India-New Zealand Free Trade Agreement took effect on 20 October 2026, what duty applies to Indian goods exported to New Zealand?", "o": ["Duty-free only for farm goods", "A flat 50% duty", "Duty-free only for services", "Zero duty on all exports"], "a": 3, "x": "New Zealand now gives 100% duty-free market access covering all tariff lines and all of India's current exports, The Hindu reported on 20 October 2026."
