<script>const D={"id": "g86f72acd72", "date": "2026-11-27", "qs": [{"id": "g86f72acd72-G01", "cat": "CA", "q": "PIB reported on 25 November 2026 that the Cabinet approved an MoU on aviation maintenance, repair and overhaul (MRO) with which country?", "o": ["Germany", "Australia", "Singapore", "Japan"], "a": 2, "x": "PIB reported that the Union Cabinet approved signing an MoU between India and the Republic of Singapore on cooperation in skills and industry development in the aviation MRO sector.", "s": "PIB, 25 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2341444&lang=1&reg=1", "t": "Recent news"}, {"id": "g86f72acd72-G02", "cat": "CA", "q": "On 25 November 2026, the Prime Minister chaired the 55th meeting of which platform for timely project implementation?", "o": ["MyGov", "Swachh Bharat Mission", "PRAGATI", "PM Gati Shakti"], "a": 2, "x": "PIB reported that the Prime Minister chaired the 55th PRAGATI meeting, an ICT-enabled platform for pro-active governance and timely implementation, and reviewed five projects worth over Rs 78,000 crore.", "s": "PIB, 25 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2341608&lang=1&reg=3", "t": "Recent news"}, {"id": "g86f72acd72-G03", "cat": "GK", "q": "The Khajuraho Group of Monuments, a UNESCO World Heritage Site known for its temples, is in which Indian state?", "o": ["Madhya Pradesh", "Uttar Pradesh", "Gujarat", "Rajasthan"], "a": 0, "x": "UNESCO lists the Khajuraho Group of Monuments in the State of Madhya Pradesh. The site is managed by the Archaeological Survey of India.", "s": "UNESCO World Heritage Centre, Khajuraho Group of Monuments", "u": "https://whc.unesco.org/en/list/240", "t": "General knowledge"}, {"id": "g86f72acd72-G04", "cat": "GK", "q": "The Elephanta Caves, whose rock art is linked to the worship of Shiva, are on an island near which city?", "o": ["Kochi", "Mumbai", "Chennai", "Kolkata"], "a": 1, "x": "UNESCO describes the Elephanta Caves, the City of Caves, as lying on an island in the Sea of Oman close to Mumbai, with rock art linked to the cult of Shiva.", "s": "UNESCO World Heritage Centre, Elephanta Caves", "u": "https://whc.unesco.org/en/list/244", "t": "General knowledge"}, {"id": "g86f72acd72-G05", "cat": "GK", "q": "Which type of rock forms when molten rock from inside the Earth cools and hardens?", "o": ["Igneous rock", "Fossil rock", "Sedimentary rock", "Metamorphic rock"], "a": 0, "x": "Igneous rocks form when magma or lava cools and solidifies. Sedimentary rocks form from layers of settled material, and metamorphic rocks form when heat and pressure change older rocks.", "s": "Britannica, Igneous rock", "u": "https://www.britannica.com/science/igneous-rock", "t": "General knowledge"}, {"id": "g86f72acd72-G06", "cat": "GK", "q": "In a flower, which part matures into the fruit after fertilization?", "o": ["The sepal", "The ovary", "The stem", "The petal"], "a": 1, "x": "The ovary holds the ovules, which become seeds after fertilization, and the ovary itself matures into the fruit that encloses the seeds. Petals and sepals do not become the fruit.", "s": "Britannica, Ovary (plant)", "u": "https://www.britannica.com/science/ovary-plant", "t": "General knowledge"}, {"id": "g86f72acd72-G07", "cat": "GK", "q": "Qutb Minar and its Monuments, a UNESCO World Heritage Site, stand in which Indian city?", "o": ["Jaipur", "Agra", "Lucknow", "Delhi"], "a": 3, "x": "UNESCO lists Qutb Minar and its Monuments under Delhi. The site is a World Heritage property.", "s": "UNESCO World Heritage Centre, Qutb Minar and its Monuments, Delhi", "u": "https://whc.unesco.org/en/list/233", "t": "General knowledge"}, {"id": "g86f72acd72-G08", "cat": "CA", "q": "A library board lists the winners of the 2026 Nobel Prize in Chemistry announced on 7 October. Which pair does it name?", "o": ["Henri B. Kagan and Kenso Soai", "Emmanuelle Charpentier and Jennifer Doudna", "Francis Halzen and Peter Hegemann", "Karl Deisseroth and Georg Nagel"], "a": 0, "x": "The Nobel Prize site names Henri B. Kagan and Kenso Soai as the 2026 Chemistry laureates. Source rechecked 26 November 2026.", "s": "NobelPrize.org, Chemistry 2026 press release", "u": "https://www.nobelprize.org/prizes/chemistry/2026/press-release/", "t": "Revision"}, {"id": "g86f72acd72-G09", "cat": "CA", "q": "A health poster promotes the Tele-MANAS helpline highlighted by PIB in October 2026. Which toll-free number does it show?", "o": ["1075", "139", "1930", "14416"], "a": 3, "x": "PIB's health feature identifies 14416 as the Tele-MANAS toll-free helpline for free, confidential mental health support. Source rechecked 26 November 2026.", "s": "PIB, 9 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321522&lang=1&reg=1", "t": "Revision"}, {"id": "g86f72acd72-G10", "cat": "GK", "q": "A teacher points to Ashoka on a timeline of ancient Indian empires. Under which dynasty does he belong?", "o": ["Chola", "Gupta", "Mughal", "Maurya"], "a": 3, "x": "Ashoka ruled the Mauryan empire as its last major emperor, and his rock and pillar edicts give evidence about his reign. Source rechecked 26 November 2026.", "s": "Britannica, Ashoka", "u": "https://www.britannica.com/summary/Ashoka", "t": "Revision"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
