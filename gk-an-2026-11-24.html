elplines.", "s": "PIB, 9 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321522&lang=1&reg=1", "t": "Revision"}, {"id": "ga24c3f0e71d-G10", "cat": "GK", "q": "A museum label reads: 'This pillar edict was issued by Ashoka.' To which ancient Indian dynasty did Ashoka belong?", "o": ["Kushan", "Maurya", "Pallava", "Shunga"], "a": 1, "x": "Ashoka was a major emperor of the Mauryan empire, and his rock and pillar edicts are important evidence about his reign. The Shunga, Kushan and Pallava dynasties ruled at other times and places.", "s": "Encyclopaedia Britannica, Ashoka", "u": "https://www.britannica.com/summary/Ashoka", "t": "Revision"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
