nd about 31 times more energy released.", "s": "Britannica, Richter scale", "u": "https://www.britannica.com/science/Richter-scale", "t": "Science"}, {"id": "Q531", "cat": "GK", "q": "On which date in 1942 did Mahatma Gandhi launch the Quit India Movement in Bombay?", "o": ["9 August", "8 August", "26 January", "15 August"], "a": 1, "x": "Gandhi appealed to Indians to follow \"Do or Die\" at the All India Congress Committee meeting in Bombay on 8 August 1942, launching the Quit India Movement.", "s": "Britannica, Quit India Movement", "u": "https://www.britannica.com/event/Quit-India-Movement", "t": "India: history"}, {"id": "Q532", "cat": "GK", "q": "The \"lead\" of an ordinary pencil is made mostly of which material?", "o": ["Lead", "Graphite", "Charcoal", "Coal tar"], "a": 1, "x": "Pencil \"lead\" is a soft, slippery mineral called graphite (a form of carbon); it contains none of the metal lead.", "s": "Britannica Kids, graphite", "u": "https://kids.britannica.com/scholars/article/graphite/37755", "t": "Science"}, {"id": "Q533", "cat": "GK", "q": "The Hawa Mahal, the \"Palace of the Winds\", stands in which Indian city?", "o": ["Bikaner", "Jodhpur", "Udaipur", "Jaipur"], "a": 3, "x": "The Hawa Mahal is a palace in Jaipur, Rajasthan, known for its pink sandstone facade of many small windows.", "s": "Britannica, Hawa Mahal", "u": "https://www.britannica.com/topic/Hawa-Mahal", "t": "India: monuments"}, {"id": "Q534", "cat": "CA", "q": "Complete the line: World Habitat Day 2026, observed on 5 October, called for ______.", "o": ["Adequate Housing for All", "Zero Hunger for All", "Quality Healthcare for All", "Affordable Clean Energy for All"], "a": 0, "x": "UN News reports that World Habitat Day 2026 focused on Adequate Housing for All.", "s": "UN News, 5 October 2026; rechecked 7 October 2026; rechecked 8 October 2026; rechecked 9 October 2026; rechecked 10 October 2026; rechecked 11 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "World: cities"}, {"id": "Q535", "cat": "CA", "q": "The UN General Assembly session whose high-level week fell in September 2026 follows the 80th. What is its number?", "o": ["91st", "81st", "71st", "18th"], "a": 1, "x": "The United Nations places its September 2026 high-level week in the 81st session of the General Assembly.", "s": "United Nations, High-level Week 2026; US State Department schedule, 21 Sep 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "World"}, {"id": "Q536", "cat": "CA", "q": "Which spacecraft's 1957 launch is remembered on the opening day of World Space Week, 4 October?", "o": ["Explorer 1", "Vostok 1", "Luna 2", "Sputnik 1"], "a": 3, "x": "World Space Week begins on 4 October, the date in 1957 when Sputnik 1, the first human-made Earth satellite, was launched.", "s": "United Nations", "u": "https://www.un.org/en/observances/world-space-week", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
