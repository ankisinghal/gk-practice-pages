px?PRID=2323218&lang=1&reg=48", "t": "India: infrastructure"}, {"id": "Q101", "cat": "CA", "q": "On which date was the UN International Day of the Girl Child observed in October 2026?", "o": ["16 October", "24 October", "11 October", "5 October"], "a": 2, "x": "The UN marks International Day of the Girl Child on 11 October. The 2026 observance called for investment in girls' rights.", "s": "United Nations, Girl Child Day 2026", "u": "https://www.un.org/en/observances/girl-child-day", "t": "World: observances"}, {"id": "Q102", "cat": "GK", "q": "Which organs filter wastes and extra water from the blood to form urine?", "o": ["Pancreas", "Kidneys", "Lungs", "Intestines"], "a": 1, "x": "The kidneys filter blood and remove wastes and extra water as urine. The bladder stores urine after it has been made.", "s": "NIDDK, kidneys and their function", "u": "https://www.niddk.nih.gov/health-information/kidney-disease/kidneys-how-they-work", "t": "Science"}, {"id": "Q103", "cat": "GK", "q": "The Palk Strait lies between India and which neighbouring country?", "o": ["Myanmar", "Bangladesh", "Maldives", "Sri Lanka"], "a": 3, "x": "The Palk Strait separates southeastern India from northern Sri Lanka.", "s": "Britannica, Palk Strait", "u": "https://www.britannica.com/place/Palk-Strait", "t": "Geography"}, {"id": "Q104", "cat": "GK", "q": "Which battle in 1757 brought Robert Clive's East India Company forces into conflict with Siraj al-Dawlah of Bengal?", "o": ["First Battle of Panipat", "Battle of Plassey", "Battle of Haldighati", "Battle of Buxar"], "a": 1, "x": "The Battle of Plassey was fought on 23 June 1757. Clive led the East India Company forces against the forces of Siraj al-Dawlah.", "s": "Britannica, Battle of Plassey", "u": "https://www.britannica.com/event/Battle-of-Plassey", "t": "History and culture"}, {"id": "Q105", "cat": "GK", "q": "What is the minimum age an otherwise eligible Indian citizen must have reached on the qualifying date to register as a voter?", "o": ["25 years", "21 years", "16 years", "18 years"], "a": 3, "x": "The Election Commission states that a citizen must have attained 18 years on the qualifying date. Citizenship, ordinary residence and other eligibility requirements also apply.", "s": "Election Commission, voter registration", "u": "https://www.eci.gov.in/faq/en/how-to-register/", "t": "Civics"}, {"id": "Q106", "cat": "GK", "q": "Which currency would normally be used to pay in a shop in Japan?", "o": ["Yen", "Baht", "Won", "Yuan"], "a": 0, "x": "Japan's currency is the yen. The Bank of Japan lists its notes and coins in yen.", "s": "Bank of Japan, notes and coins", "u": "https://www.boj.or.jp/en/note_tfjgs/note/valid/index.htm", "t": "Everyday economy"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
