 "o": ["Energy", "Housing", "Education", "Transport"], "a": 1, "x": "The official theme was Adequate Housing for All. Housing is the missing word, not an education or energy goal.", "s": "UN News, 5 October 2026; checked 12 October 2026", "u": "https://news.un.org/en/story/2026/10/1168520", "t": "World: cities"}, {"id": "Q039", "cat": "CA", "q": "The 2026 Chemistry Nobel recognised asymmetric organic synthesis. Which pair won it?", "o": ["Karl Deisseroth and Georg Nagel", "Henri B. Kagan and Kenso Soai", "Francis Halzen and Peter Hegemann", "Emmanuelle Charpentier and Jennifer Doudna"], "a": 1, "x": "The official Nobel announcement names Henri B. Kagan and Kenso Soai for discoveries about non-linear effects and autocatalysis in asymmetric organic synthesis.", "s": "Nobel Academy, 7 October 2026; checked 12 October 2026", "u": "https://www.nobelprize.org/prizes/chemistry/2026/press-release/", "t": "World: science"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
