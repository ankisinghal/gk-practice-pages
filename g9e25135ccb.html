<script>const D={"id": "g9e25135ccb", "date": "2026-10-14", "qs": [{"id": "Q079", "cat": "CA", "q": "The official 2026 Economic Sciences announcement named which pair for research on stabilisation policy?", "o": ["Robert E. Hall and Michael Woodford", "Paul Krugman and Joseph Stiglitz", "Ben S. Bernanke and Douglas W. Diamond", "Daron Acemoglu and James A. Robinson"], "a": 0, "x": "The 12 October 2026 announcement named Robert E. Hall and Michael Woodford. Other economists are not this year's pair.", "s": "NobelPrize.org, 12 October 2026", "u": "https://www.nobelprize.org/prizes/economic-sciences/2026/press-release/", "t": "World: economy"}, {"id": "Q087", "cat": "CA", "q": "PIB's 13 October 2026 report places the Anand Vihar electric-bus flag-off in which city?", "o": ["Bengaluru", "Delhi", "Hyderabad", "Mumbai"], "a": 1, "x": "Anand Vihar and the new air-quality monitoring stations in that report are in Delhi.", "s": "PIB, rechecked 14 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2322719&lang=2&reg=48", "t": "India: environment"}, {"id": "Q090", "cat": "GK", "q": "An excavated city has brick bathrooms connected to drains and a large public bath. Which civilization is it most likely to belong to?", "o": ["Indus civilization", "Mughal Empire", "Maurya Empire", "Gupta Empire"], "a": 0, "x": "Brick bathrooms, drains and the Great Bath at Mohenjo-daro are associated with the Indus civilization.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/place/India/The-Indus-civilization", "t": "History and culture"}, {"id": "Q093", "cat": "CA", "q": "The 2026 International Day for Disaster Risk Reduction theme, \"Resilience Starts at Home\", places which setting at the centre of preparedness?", "o": ["Ports and shipping routes", "Stadiums and sports clubs", "Airports and airlines", "Homes and households"], "a": 3, "x": "UNDRR selected Resilience Starts at Home for the day observed on 13 October 2026. It focuses on safer housing and household preparedness.", "s": "UNDRR, 13 October 2026", "u": "https://iddrr.undrr.org/", "t": "World: disaster preparedness"}, {"id": "Q094", "cat": "CA", "q": "Which UN agency is organising the World Food Day global ceremony scheduled for 16 October 2026 under \"Innovate today. Nourish tomorrow.\"?", "o": ["UNESCO", "ILO", "FAO", "WHO"], "a": 2, "x": "FAO announced the ceremony at its headquarters for 16 October 2026. FAO is the Food and Agriculture Organization; the ceremony was still upcoming when this test was prepared.", "s": "FAO, World Food Day 2026", "u": "https://www.fao.org/webcast/detail/world-food-day-ceremony/en", "t": "World: food"}, {"id": "Q095", "cat": "GK", "q": "Why would a ringing bell inside a container become harder to hear as the air is removed?", "o": ["Sound needs a material medium", "Sound travels only through light", "Sound cannot pass through air", "Sound needs a magnetic field"], "a": 0, "x": "Sound is a mechanical vibration carried by matter. With less air to carry it, less sound reaches a listener; sound cannot travel through a vacuum.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/science/How-Does-Sound-Travel", "t": "Science"}, {"id": "Q096", "cat": "GK", "q": "Which pair of seas is connected by the Suez Canal?", "o": ["North Sea and Baltic Sea", "Mediterranean Sea and Red Sea", "Black Sea and Caspian Sea", "Arabian Sea and Bay of Bengal"], "a": 1, "x": "The Suez Canal runs through Egypt and connects the Mediterranean Sea with the Red Sea.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/topic/Suez-Canal", "t": "Geography"}, {"id": "Q097", "cat": "GK", "q": "The rock-cut temples and monasteries at Ajanta are primarily associated with which religion?", "o": ["Jainism", "Hinduism", "Sikhism", "Buddhism"], "a": 3, "x": "Ajanta is a group of Buddhist cave temples and monasteries in Maharashtra, celebrated for its paintings. Do not confuse it with the mixed religious traditions at Ellora.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/place/Ajanta-Caves", "t": "History and culture"}, {"id": "Q098", "cat": "GK", "q": "Article 324 gives the superintendence, direction and control of parliamentary elections to which body?", "o": ["Union Public Service Commission", "Election Commission", "Comptroller and Auditor General", "Finance Commission"], "a": 1, "x": "Article 324 vests these election responsibilities in the Election Commission. The other institutions have different constitutional functions.", "s": "Constitution of India, Article 324", "u": "https://indiacode.ecourtsindia.com/constitution-of-india/article/324/", "t": "Civics"}, {"id": "Q099", "cat": "GK", "q": "If prices rise while a person's money income stays unchanged, what usually happens to that income's purchasing power?", "o": ["It stays unchanged", "It rises", "It falls", "It doubles"], "a": 2, "x": "The unchanged income buys fewer goods and services when prices rise. Inflation therefore reduces its purchasing power.", "s": "IMF, Inflation", "u": "https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/inflation", "t": "Economy"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
