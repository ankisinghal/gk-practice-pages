h-level week held in September 2026 belonged to which numbered General Assembly session?", "o": ["82nd", "81st", "79th", "80th"], "a": 1, "x": "The UN's 2026 High-level Week page identifies the meeting as part of the 81st General Assembly session.", "s": "United Nations, High-level Week 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "World: United Nations"}, {"id": "Q624", "cat": "CA", "q": "The first human-made Earth satellite was launched on 4 October 1957. Which satellite was it?", "o": ["Aryabhata", "Sputnik 1", "Vanguard 1", "Explorer 1"], "a": 1, "x": "The United Nations dates the launch of Sputnik 1, the first human-made Earth satellite, to 4 October 1957. That anniversary opens World Space Week.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
