itannica.com/animal/cheetah-mammal", "t": "Animals and nature"}, {"id": "Q245", "cat": "GK", "q": "Who is best remembered for inventing the telephone?", "o": ["Thomas Edison", "Nikola Tesla", "Alexander Graham Bell", "Guglielmo Marconi"], "a": 2, "x": "Britannica describes Alexander Graham Bell as the scientist and teacher best remembered for inventing the telephone.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/biography/Alexander-Graham-Bell", "t": "History: inventions"}, {"id": "Q244", "cat": "GK", "q": "Which metal is liquid at room temperature?", "o": ["Mercury", "Iron", "Copper", "Aluminium"], "a": 0, "x": "Britannica notes mercury is the only elemental metal that is liquid at room temperature. Iron, copper and aluminium are solids under ordinary conditions.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/science/mercury-chemical-element", "t": "Science: chemistry"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
