<script>const D={"id": "g328697ab1e", "date": "2026-11-21", "qs": [{"id": "g328697ab1e-G01", "cat": "GK", "q": "The Ajanta cave paintings and monasteries are mainly associated with which religious tradition?", "o": ["Jainism", "Buddhism", "Zoroastrianism", "Sikhism"], "a": 1, "x": "The Ajanta caves include Buddhist monasteries and prayer halls, with paintings illustrating Buddhist traditions.", "s": "ASI, Ajanta Caves", "u": "https://asi.nic.in/pages/WorldHeritageAjantaCaves", "t": "Culture: Buddhist caves"}, {"id": "g328697ab1e-G02", "cat": "GK", "q": "A monitoring station produces a trace of ground shaking during an earthquake. Which instrument makes this record?", "o": ["Anemometer", "Seismograph", "Hygrometer", "Barometer"], "a": 1, "x": "A seismograph records ground motion, including the vibrations produced by earthquakes.", "s": "Britannica, Seismograph", "u": "https://www.britannica.com/technology/seismograph", "t": "Science: instruments"}, {"id": "g328697ab1e-G03", "cat": "GK", "q": "Who took office as the first President when India became a republic in January 1950?", "o": ["Jawaharlal Nehru", "S. Radhakrishnan", "C. Rajagopalachari", "Rajendra Prasad"], "a": 3, "x": "Rajendra Prasad served as the first President of the Republic of India. Nehru was Prime Minister; Radhakrishnan later became the second President.", "s": "Britannica, Rajendra Prasad", "u": "https://www.britannica.com/biography/Rajendra-Prasad", "t": "History: republic"}, {"id": "g328697ab1e-G04", "cat": "CA", "q": "The UN observance on 21 November is World Television Day. What does it primarily recognise?", "o": ["Cinema as a competitive sport", "Television as a communication medium", "Telephones as emergency equipment", "Postal services linking communities"], "a": 1, "x": "The UN observance recognises television as a medium that informs and shapes public opinion. The date is 21 November, including in 2026.", "s": "United Nations, World Television Day", "u": "https://www.un.org/en/observances/world-television-day", "t": "World: communication"}, {"id": "g328697ab1e-G05", "cat": "CA", "q": "FAO and ILO scheduled a November 2026 World Fisheries Day event about decent work in which sector?", "o": ["Forestry and furniture", "Mining and metallurgy", "Fishing and aquaculture", "Tourism and hospitality"], "a": 2, "x": "FAO lists a joint FAO-ILO event on 20 November 2026 marking World Fisheries Day, observed on 21 November. Its focus is decent work in fisheries and aquaculture, particularly for youth and women. This wording states the announced programme, not that the event took place.", "s": "FAO, World Fisheries Day 2026", "u": "https://www.fao.org/in-action/globefish/news-events/events/events-detail/world-fisheries-day-2026/en", "t": "World: decent work"}, {"id": "g328697ab1e-G06", "cat": "GK", "q": "Sand and mud settle in layers, then become compacted and cemented into rock. Which rock group forms this way?", "o": ["Sedimentary", "Volcanic glass", "Igneous", "Metamorphic"], "a": 0, "x": "Sedimentary rock can form when deposited fragments accumulate in layers and are compacted and cemented together.", "s": "Britannica Students, Sedimentary rock", "u": "https://kids.britannica.com/students/article/sedimentary-rock/336054", "t": "Science: rock formation"}, {"id": "g328697ab1e-G07", "cat": "GK", "q": "Why can a straw in a glass of water appear bent at the surface?", "o": ["The water has permanently bent the straw.", "The glass has created extra light rays.", "Light is refracted between water and air.", "Light cannot travel through the water."], "a": 2, "x": "Refraction is a change in the direction of light as it passes between materials, such as water and air.", "s": "Britannica Kids, Optics", "u": "https://kids.britannica.com/kids/article/optics/390822", "t": "Science: light"}, {"id": "g328697ab1e-G08", "cat": "GK", "q": "A protective covering on an electric wire should resist the flow of electric current. What kind of material is needed?", "o": ["Optical lens", "Magnetic compass", "Electrical conductor", "Electrical insulator"], "a": 3, "x": "An electrical insulator suppresses the flow of electricity. It is used to separate a conductor from objects that should not carry current.", "s": "Britannica Students, Insulation", "u": "https://kids.britannica.com/students/article/insulation/275068", "t": "Science: electricity"}, {"id": "g328697ab1e-G09", "cat": "GK", "q": "How many events make up an athletics decathlon?", "o": ["Ten", "Twelve", "Five", "Seven"], "a": 0, "x": "A decathlon is a combined athletics contest with ten events.", "s": "Britannica, Decathlon", "u": "https://kids.britannica.com/scholars/article/decathlon/29681", "t": "Sports: athletics"}, {"id": "g328697ab1e-G10", "cat": "GK", "q": "The regular payment for keeping an insurance policy in force is called what?", "o": ["Premium", "Pension", "Dividend", "Subsidy"], "a": 0, "x": "The premium is the payment made for the cover promised by an insurance policy.", "s": "Britannica Students, Insurance", "u": "https://kids.britannica.com/students/article/insurance/275069", "t": "Economy: insurance"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};

</script></body></html>
