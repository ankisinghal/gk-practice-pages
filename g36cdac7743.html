<script>const D={"id": "g36cdac7743", "date": "2026-11-22", "qs": [{"id": "g36cdac7743-G01", "cat": "GK", "q": "Which island would come first in an atlas table sorted by land area, from largest to smallest?", "o": ["Borneo", "New Guinea", "Madagascar", "Greenland"], "a": 3, "x": "Greenland is the largest island in the world. This is an island-area ranking, not a ranking of continents.", "s": "Britannica, Greenland", "u": "https://kids.britannica.com/students/article/Greenland/274658", "t": "World: geography"}, {"id": "g36cdac7743-G02", "cat": "GK", "q": "A textbook index groups Ashoka under the dynasty he ruled. Which heading should contain his name?", "o": ["Kushana", "Maurya", "Chola", "Gupta"], "a": 1, "x": "Ashoka was an emperor of the Mauryan dynasty. This checks the ruler-dynasty association, not the date of his reign or the Kalinga war.", "s": "Britannica, Ashoka", "u": "https://kids.britannica.com/scholars/article/Ashoka/9884", "t": "History: ancient India"}, {"id": "g36cdac7743-G03", "cat": "GK", "q": "Which pair names the same middle-ear bone?", "o": ["Stapes and stirrup", "Incus and hammer", "Cochlea and eardrum", "Malleus and anvil"], "a": 0, "x": "The stapes is the stirrup. The incus is the anvil and the malleus is the hammer; the cochlea and eardrum are not names for a middle-ear bone.", "s": "Britannica, Ear bone", "u": "https://kids.britannica.com/scholars/article/ear-bone/105181", "t": "Human body"}, {"id": "g36cdac7743-G04", "cat": "CA", "q": "An official update on 21 November 2026 reported a sixth round of CEPA trade talks in New Delhi. India was negotiating with which country?", "o": ["Canada", "Brazil", "Kenya", "Mexico"], "a": 0, "x": "PIB reported that India and Canada held their sixth round of Comprehensive Economic Partnership Agreement negotiations in New Delhi from 11 to 20 November 2026. This was a negotiating round, not the signing of a completed agreement.", "s": "PIB, 21 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2339731&lang=1&reg=3", "t": "India: trade"}, {"id": "g36cdac7743-G05", "cat": "CA", "q": "India's HPV vaccination milestone, reported on 21 November 2026, was part of a campaign focused on preventing which condition?", "o": ["Seasonal influenza", "Japanese encephalitis", "Tuberculosis", "Cervical cancer"], "a": 3, "x": "The National HPV Vaccination Campaign aims to prevent HPV infections that can lead to cervical cancer. The official update reported more than one crore doses administered.", "s": "PIB, 21 November 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2339423&lang=2&reg=48", "t": "India: health"}, {"id": "g36cdac7743-G06", "cat": "GK", "q": "A ball rolling across a field has energy because of its motion. Which type of energy is this?", "o": ["Elastic energy", "Chemical energy", "Kinetic energy", "Nuclear energy"], "a": 2, "x": "Kinetic energy is energy associated with motion. The moving ball has kinetic energy.", "s": "Britannica, Mechanical energy", "u": "https://kids.britannica.com/scholars/article/mechanical-energy/51701", "t": "Science: energy"}, {"id": "g36cdac7743-G07", "cat": "GK", "q": "A crescent-shaped lake remains after a river cuts off one of its meander loops. What is this type of lake called?", "o": ["A tidal lagoon", "A glacial tarn", "An oxbow lake", "A crater lake"], "a": 2, "x": "An oxbow lake forms in an abandoned meander loop. A single cut-off loop commonly leaves a crescent-shaped lake.", "s": "Britannica, Oxbow lake", "u": "https://kids.britannica.com/scholars/article/oxbow-lake/57816", "t": "Geography: rivers"}, {"id": "g36cdac7743-G08", "cat": "GK", "q": "Brass is made by mixing copper and zinc. What type of material is brass?", "o": ["An alloy", "A polymer", "An oxide", "An element"], "a": 0, "x": "Brass is a mixture of metals, mainly copper and zinc. Such a metallic mixture is an alloy.", "s": "Britannica Kids, Brass", "u": "https://kids.britannica.com/kids/article/brass/399376", "t": "Science: materials"}, {"id": "g36cdac7743-G09", "cat": "GK", "q": "A proposal would allow only property owners and graduates to vote. Which democratic principle would this most directly violate?", "o": ["Collective responsibility", "Universal adult franchise", "Separation of powers", "Indirect election"], "a": 1, "x": "Universal adult franchise gives adult citizens the right to vote without a property or educational qualification. NCERT describes this right as independent of education and income, among other grounds.", "s": "NCERT, Electoral System", "u": "https://ncert.nic.in/textbook/pdf/hees105.pdf", "t": "Civics: voting"}, {"id": "g36cdac7743-G10", "cat": "GK", "q": "A factory buys durable machinery to make other products. How is this machinery classified?", "o": ["Consumer goods", "Capital goods", "Intermediate goods", "Free goods"], "a": 1, "x": "Machinery used to produce other goods is classified as capital goods, rather than goods bought for personal consumption.", "s": "Britannica, International trade", "u": "https://kids.britannica.com/scholars/article/international-trade/106321", "t": "Economy: production"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
