<script>const D={"id": "g2e56c8f224", "date": "2026-10-05", "qs": [{"id": "Q025", "cat": "CA", "q": "Which institutions does PM-SETU focus on upgrading, according to the PIB update of 3 October 2026?", "o": ["Government Industrial Training Institutes (ITIs)", "Primary schools", "Public libraries", "District courts"], "a": 0, "x": "PM-SETU is a vocational-skills programme focused on modernising Government ITIs and making their training more relevant to industry.", "s": "PIB, 3 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10077_20261003_15142301.pdf", "t": "India: skills"}, {"id": "Q026", "cat": "CA", "q": "According to the PIB update of 4 October 2026, how many supercomputers had India deployed under the National Supercomputing Mission by September 2026?", "o": ["68", "100", "40", "14"], "a": 2, "x": "The dated PIB update reports 40 deployed supercomputers with a combined capacity of 68 petaflops as of September 2026. The count and capacity are different measures.", "s": "PIB, 4 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10085_20261004_17525901.pdf", "t": "India: science"}, {"id": "Q027", "cat": "CA", "q": "The October 2026 ESTIC science and technology conclave is scheduled at Bharat Mandapam in which Indian city?", "o": ["Mumbai", "Hyderabad", "Bengaluru", "New Delhi"], "a": 3, "x": "The PIB update of 4 October lists ESTIC-2026 for 27-29 October at Bharat Mandapam, New Delhi. This is a scheduled event, not a completed one.", "s": "PIB, 4 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10085_20261004_17525901.pdf", "t": "India: science"}, {"id": "Q028", "cat": "CA", "q": "The 2026 Nobel Prize in Physiology or Medicine, announced on 5 October, recognises discoveries behind which method?", "o": ["Plate tectonics", "Optogenetics", "Radio astronomy", "Carbon dating"], "a": 1, "x": "The Nobel Assembly awarded Karl Deisseroth, Peter Hegemann and Georg Nagel for discoveries concerning light-gated ion channels and optogenetics, a method for controlling nerve signals with light.", "s": "Nobel Assembly, 5 October 2026", "u": "https://www.nobelprize.org/prizes/medicine/2026/press-release/", "t": "World: science"}, {"id": "Q029", "cat": "CA", "q": "What is the theme of World Space Week 2026, according to UN News on 4 October?", "o": ["Rocket revolution", "Digital farming", "Ocean restoration", "Polar exploration"], "a": 0, "x": "The dated UN News article names Rocket revolution as the 2026 theme, focusing on changes in how people reach space.", "s": "UN News, 4 October 2026", "u": "https://news.un.org/en/story/2026/10/1168517", "t": "World: space"}, {"id": "Q030", "cat": "GK", "q": "Which green pigment in plants absorbs light energy for photosynthesis?", "o": ["Keratin", "Melanin", "Chlorophyll", "Hemoglobin"], "a": 2, "x": "Chlorophyll is a key pigment involved in photosynthesis. It absorbs light energy used by plants to make food.", "s": "Britannica, checked 5 October 2026", "u": "https://www.britannica.com/science/chlorophyll", "t": "Science"}, {"id": "Q031", "cat": "GK", "q": "Which is the largest ocean on Earth?", "o": ["Arctic Ocean", "Pacific Ocean", "Atlantic Ocean", "Indian Ocean"], "a": 1, "x": "The Pacific is the largest ocean and covers about one-third of Earth's surface.", "s": "Britannica, checked 5 October 2026", "u": "https://www.britannica.com/place/Pacific-Ocean", "t": "Geography"}, {"id": "Q019", "cat": "CA", "q": "India won the men's hockey gold at the 2026 Asian Games on 3 October. Which team did India beat in the final?", "o": ["South Korea", "Japan", "Pakistan", "Malaysia"], "a": 3, "x": "India beat Malaysia 5-1 in Kakamigahara and defended their Asian Games title. The win also gave India a direct place in the 2028 Los Angeles Olympics.", "s": "The Hindu, top news of the day, 3 October 2026", "u": "https://www.thehindu.com/news/top-news-of-the-day-october-3-2026/article71540630.ece", "t": "Sports"}, {"id": "Q020", "cat": "CA", "q": "How many medals did India win in total at the 2026 Asian Games?", "o": ["85", "70", "106", "93"], "a": 0, "x": "India finished with 85 medals: 21 gold, 27 silver and 37 bronze. That is below its 106 medals at Hangzhou 2022.", "s": "Sportstar (The Hindu), final medal tally, 4 October 2026", "u": "https://sportstar.thehindu.com/asian-games/india-final-medal-tally-asian-games-2026-fourth-place-standings-gold-silver-bronze-count/article71542939.ece", "t": "Sports"}, {"id": "Q004", "cat": "CA", "q": "Which session of the United Nations General Assembly held its high-level week in September 2026?", "o": ["79th", "81st", "82nd", "80th"], "a": 1, "x": "The United Nations identifies its September 2026 high-level week as part of the 81st General Assembly session. Rechecked on 5 October 2026.", "s": "United Nations, High-level Week 2026; US State Department schedule, 21 Sep 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "World"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
