<script>const D={"id": "gb4493ba32d", "date": "2026-11-01", "qs": [{"id": "Q274", "cat": "CA", "q": "The documentary 'Mothers of Courage', about women in Bihar working to keep girls in school, won which international award at a ceremony in Rome this week?", "o": ["The Nobel Peace Prize", "The 2026 UN SDG Action Award", "The Booker Prize", "A Cannes Film Festival award"], "a": 1, "x": "The Economic Times reported on 30 October 2026 that 'Mothers of Courage', part of the Shikshagraha movement, won the 2026 UN SDG Action Award in the Creativity category at Rome, chosen from over 7,000 applications from 190 countries.", "s": "The Economic Times, 30 October 2026", "u": "https://economictimes.indiatimes.com/news/india/mothers-of-courage-documentary-on-girls-education-in-bihar-wins-un-sdg-action-award/articleshow/135368133.cms", "t": "India: education"}, {"id": "Q275", "cat": "CA", "q": "Manisha Bhanwala became the first Indian woman to win a gold medal at which event, rallying to beat Abigail Nette of the USA 8-6 in the final in Astana?", "o": ["World Wrestling Championships", "World Weightlifting Championships", "World Badminton Championships", "World Boxing Championships"], "a": 0, "x": "PTI reported on 31 October 2026 that Manisha Bhanwala won the 59 kg final at the World Wrestling Championships in Astana, coming back from 1-6 down to win 8-6, the first Indian woman to take gold at this championship.", "s": "PTI via Mid-Day, 31 October 2026", "u": "https://www.mid-day.com/sports/other-sports/article/manisha-bhanwala-etches-her-name-in-historic-gold-23657814", "t": "Sports: wrestling"}, {"id": "Q302", "cat": "GK", "q": "Who was the first Indian to travel into space, flying on a Soviet Soyuz mission in 1984?", "o": ["Vikram Sarabhai", "Kalpana Chawla", "Rakesh Sharma", "Sunita Williams"], "a": 2, "x": "Rakesh Sharma became the first Indian in space in April 1984, aboard the Soviet Soyuz T-11. Kalpana Chawla and Sunita Williams flew later; Vikram Sarabhai was a scientist, https://www.fiba.basketball/", "t": "Sports"}, {"id": "Q290", "cat": "CA", "q": "Which writer received the 2026 Nobel Prize in Literature on 8 October?", "o": ["Salman Rushdie", "Margaret Atwood", "Haruki Murakami", "Anne Carson"], "a": 3, "x": "The official Nobel homepage names Canadian author Anne Carson. The announcement was also reported by BBC on 8 October.", "s": "NobelPrize.org and BBC, 8 October 2026; rechecked 9 October 2026; rechecked 10 October 2026; rechecked 11 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/press-release/", "t": "World: literature"}, {"id": "Q291", "cat": "CA", "q": "Windergy India 2026, announced by PIB on 5 October, takes place in which city?", "o": ["Ahmedabad", "Mumbai", "Chennai", "New Delhi"], "a": 2, "x": "The dated announcement places Windergy India at Chennai Trade Centre from 7 to 9 October. This question asks the venue city, not whether an inauguration has finished.", "s": "PIB, 5 October 2026; rechecked 9 October 2026; rechecked 11 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q292", "cat": "CA", "q": "WHO's World Mental Health Day 2026 theme puts which idea at the centre of care?", "o": ["Specialists alone shaping care", "New equipment guiding all care", "More reliance on hospital care", "Lived experience shaping care"], "a": 3, "x": "WHO calls for people with lived experience to help shape policies, services and decisions about mental health care.", "s": "WHO, World Mental Health Day 2026", "u": "https://www.who.int/campaigns/world-mental-health-day/2026", "t": "World: health"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
