scripts/FS_Overview.aspx?fn=2753", "t": "Economy"}, {"id": "Q222", "cat": "GK", "q": "A school poster asks citizens to protect forests and show compassion for living creatures. Under Article 51A, this is an example of what?", "o": ["A Fundamental Right", "A Directive Principle", "A Fundamental Duty", "An emergency power"], "a": 2, "x": "Article 51A(g), in the Fundamental Duties, asks citizens to protect and improve the natural environment and have compassion for living creatures.", "s": "Constitution of India, Article 51A(g)", "u": "https://www.legislative.gov.in/static/uploads/2025/07/c9fe9c9b6840524844316f74bb1c556c.pdf", "t": "Civics: Constitution"}, {"id": "Q229", "cat": "GK", "q": "A programme lists songs written by Rabindranath Tagore. Which of these belongs on the list?", "o": ["Sare Jahan Se Achha", "Ae Mere Watan Ke Logon", "Vande Mataram", "Jana Gana Mana"], "a": 3, "x": "Rabindranath Tagore wrote Jana Gana Mana, India's national anthem.", "s": "Britannica, Jana Gana Mana", "u": "https://www.britannica.com/topic/Jana-Gana-Mana", "t": "History and culture"}, {"id": "Q277", "cat": "GK", "q": "Which is the largest freshwater lake in India?", "o": ["Wular Lake", "Chilika Lake", "Dal Lake", "Pangong Tso"], "a": 0, "x": "Wular Lake in Jammu and Kashmir is India's largest freshwater lake. Chilika is a brackish-water lagoon and Pangong Tso is saline, so they are not freshwater lakes.", "s": "Britannica, checked 31 October 2026", "u": "https://www.britannica.com/place/Wular-Lake", "t": "Geography"}, {"id": "Q280", "cat": "GK", "q": "How many players of one team are on the court at a time in a basketball game?", "o": ["Eleven", "Six", "Five", "Seven"], "a": 2, "x": "Basketball is played with five players per team on the court under FIBA rules.", "s": "FIBA, checked 31 October 2026", "u": "https://www.fiba.basketball/", "t": "Sports"}, {"id": "Q290", "cat": "CA", "q": "Which writer received the 2026 Nobel Prize in Literature on 8 October?", "o": ["Salman Rushdie", "Margaret Atwood", "Haruki Murakami", "Anne Carson"], "a": 3, "x": "The official Nobel homepage names Canadian author Anne Carson. The announcement was also reported by BBC on 8 October.", "s": "NobelPrize.org and BBC, 8 October 2026; rechecked 9 October 2026; rechecked 10 October 2026; rechecked 11 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/press-release/", "t": "World: literature"}, {"id": "Q291", "cat": "CA", "q": "Windergy India 2026, announced by PIB on 5 October, takes place in which city?", "o": ["Ahmedabad", "Mumbai", "Chennai", "New Delhi"], "a": 2, "x": "The dated announcement places Windergy India at Chennai Trade Centre from 7 to 9 October. This question asks the venue city, not whether an inauguration has finished.", "s": "PIB, 5 October 2026; rechecked 9 October 2026; rechecked 11 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q292", "cat": "CA", "q": "WHO's World Mental Health Day 2026 theme puts which idea at the centre of care?", "o": ["Specialists alone shaping care", "New equipment guiding all care", "More reliance on hospital care", "Lived experience shaping care"], "a": 3, "x": "WHO calls for people with lived experience to help shape policies, services and decisions about mental health care.", "s": "WHO, World Mental Health Day 2026", "u": "https://www.who.int/campaigns/world-mental-health-day/2026", "t": "World: health"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
