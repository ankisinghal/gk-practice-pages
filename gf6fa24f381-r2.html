r opening in Earth's surface. While the liquid rock is still underground it is called magma.", "s": "Britannica Kids, lava", "u": "https://kids.britannica.com/kids/article/lava/353368", "t": "Earth science"}, {"id": "Q594", "cat": "GK", "q": "What is the name for each small animal in a coral colony whose skeleton helps build a coral reef?", "o": ["Polyp", "Sponge", "Krill", "Plankton"], "a": 0, "x": "Individual corals are called polyps. They grow in colonies, and when they die their skeletons remain. New polyps grow on them, building up the reef framework.", "s": "Britannica Kids, coral reef", "u": "https://kids.britannica.com/students/article/coral-reef/633865", "t": "Environment"}, {"id": "Q595", "cat": "GK", "q": "Bharatanatyam, one of India's classical dances, comes from which region of southern India?", "o": ["Odisha", "Tamil Nadu", "Maharashtra", "Kerala"], "a": 1, "x": "Britannica says bharata natyam is indigenous to the Tamil Nadu region and is prevalent in southern India. Odissi comes from Odisha and kathakali from Kerala.", "s": "Britannica Kids, bharata natyam", "u": "https://kids.britannica.com/scholars/article/bharata-natyam/79037", "t": "India: arts and culture"}, {"id": "Q604", "cat": "GK", "q": "The Amazon carries more water than any other river. It is the mightiest river of which continent?", "o": ["North America", "South America", "Asia", "Africa"], "a": 1, "x": "Britannica Kids calls the Amazon the mightiest river in South America and says it carries more water than any other river.", "s": "Britannica Kids, Amazon River", "u": "https://kids.britannica.com/kids/article/Amazon-River/346079", "t": "World geography"}, {"id": "Q600", "cat": "CA", "q": "Which of these statements is true about the 2026 Nobel Prize in Literature, announced on 8 October?", "o": ["Jon Fosse received it.", "Louise Gluck received it.", "Han Kang received it.", "Anne Carson received it."], "a": 3, "x": "The Nobel Prize in Literature 2026 was awarded to Anne Carson, announced on 8 October 2026.", "s": "NobelPrize.org and BBC, 8 October 2026; rechecked 9 October 2026; rechecked 10 October 2026; rechecked 11 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/press-release/", "t": "World: literature"}, {"id": "Q601", "cat": "CA", "q": "Complete the sentence: PIB's 5 October 2026 announcement says Windergy India 2026 takes place in ______.", "o": ["Madurai", "Kochi", "Chennai", "Visakhapatnam"], "a": 2, "x": "PIB announced on 5 October 2026 that Windergy India 2026 is hosted in Chennai.", "s": "PIB, 5 October 2026; rechecked 9 October 2026; rechecked 11 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q602", "cat": "CA", "q": "Henri B. Kagan and Kenso Soai were announced on 7 October 2026 as winners of the Nobel Prize in which subject?", "o": ["Peace", "Economic Sciences", "Medicine", "Chemistry"], "a": 3, "x": "The Nobel announcement of 7 October 2026 names Henri B. Kagan and Kenso Soai for the Chemistry prize.", "s": "Nobel Academy, 7 October 2026; rechecked 10 October 2026", "u": "https://www.nobelprize.org/prizes/chemistry/2026/press-release/", "t": "World: science"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
