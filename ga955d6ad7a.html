<h1>General awareness practice ga955d6ad7a</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "ga955d6ad7a", "date": "2026-11-24", "qs": [{"id": "ga955d6ad7a-G01", "cat": "GK", "q": "A pilot flying over the North Atlantic points out the world's largest island, a self-governing part of Denmark. Which island is it?", "o": ["Baffin Island", "Greenland", "Svalbard", "Iceland"], "a": 1, "x": "Greenland is the world's largest island and a self-governing part of Denmark. Iceland, Baffin Island and Svalbard are other North Atlantic or Arctic islands.", "s": "Encyclopaedia Britannica Kids, Greenland", "u": "https://kids.britannica.com/students/article/Greenland/274658", "t": "Revision"}, {"id": "ga955d6ad7a-G02", "cat": "GK", "q": "The same type of car is bought once by a family for weekend trips and once by a taxi company for its fleet. How does economics classify the taxi company's car?", "o": ["Free good", "Capital good", "Public good", "Consumer good"], "a": 1, "x": "Capital goods are physical assets that businesses use to produce goods and services over time. A vehicle bought by a taxi company to earn fares is used in production, so it is applied here as a capital good; the family's car is bought for its own use.", "s": "Encyclopaedia Britannica Kids, capital", "u": "https://kids.britannica.com/scholars/article/capital/20146", "t": "Revision"}, {"id": "ga955d6ad7a-G03", "cat": "GK", "q": "Sound vibrations travel along a chain of three tiny bones, the last of which is the stapes. Which part receives the vibrations from the stapes?", "o": ["The eardrum", "The outer ear canal", "The inner ear fluid", "The Eustachian tube"], "a": 2, "x": "The three tiny ear bones carry vibrations from the eardrum to the liquid of the inner ear. The stapes, or stirrup, is the last bone in that chain, so the inner-ear fluid receives the vibrations from it.", "s": "Encyclopaedia Britannica Kids, ear bone", "u": "https://kids.britannica.com/scholars/article/ear-bone/105181", "t": "Revision"}, {"id": "ga955d6ad7a-G04", "cat": "CA", "q": "According to the Joint Press Release issued by PIB on 23 November 2026, which country's Prime Minister, Balendra Shah, made a State Visit to India on 22-23 November 2026?", "o": ["Bhutan", "Bangladesh", "Sri Lanka", "Nepal"], "a": 3, "x": "PIB's joint press release of 23 November 2026 says Prime Minister Balendra Shah of Nepal made a State Visit to India on 22-23 November 2026, his first visit to India after taking office.", "s": "PIB, 23 November 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2340389&lang=1&reg=3", "t": "Recent news"}, {"id": "ga955d6ad7a-G05", "cat": "CA", "q": "A PIB release of 23 November 2026 said an online quiz on drug-free India, open until 25 November 2026, runs through which portal?", "o": ["DigiLocker", "DIKSHA", "MY Bharat", "UMANG"], "a": 2, "x": "PIB's release of 23 November 2026 says the Nasha Mukt Yuva, Viksit Bharat Quiz, organised by the Ministry of Social Justice and Empowerment, is run through the MY Bharat portal and stays open until 25 November 2026.", "s": "PIB, 23 November 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2340564&lang=2&reg=48&v=34335", "t": "Recent news"}, {"id": "ga955d6ad7a-G06", "cat": "GK", "q": "Rani Lakshmibai, who fought the British in 1857 and is remembered as a symbol of courage, was the queen of which princely state?", "o": ["Jhansi", "Mysore", "Awadh", "Hyderabad"], "a": 0, "x": "Lakshmi Bai was the rani, or queen, of Jhansi and a leader of the Indian Rebellion of 1857-58.", "s": "Encyclopaedia Britannica Kids, Lakshmi Bai", "u": "https://kids.britannica.com/scholars/article/Lakshmi-Bai/599203", "t": "General knowledge"}, {"id": "ga955d6ad7a-G07", "cat": "GK", "q": "Colourful lights called the aurora sometimes glow in the sky near the polar regions. What mainly causes them?", "o": ["Solar particles hitting the upper atmosphere", "Lightning flashes reflected from the sea", "Moonlight scattered by distant polar ice caps", "Heat rising from volcanoes near the poles"], "a": 0, "x": "NASA explains that charged particles from the Sun, carried by the solar wind, collide with atoms and molecules in Earth's upper atmosphere and cause the glow.", "s": "NASA, Auroras", "u": "https://science.nasa.gov/sun/auroras/", "t": "General knowledge"}, {"id": "ga955d6ad7a-G08", "cat": "GK", "q": "The fine Pashmina undercoat used in luxury shawls comes from goats raised in which region?", "o": ["The Thar desert plains", "The Sundarbans delta", "The Konkan coast", "Ladakh"], "a": 3, "x": "Pashmina is the fine undercoat, or pashm, of goats, combed out for shawls. Britannica Kids notes that the soft pashmina wool of the goats kept on the Changthang Plateau of Ladakh is highly prized.", "s": "Ministry of Textiles (handicrafts.nic.in) and Britannica Kids", "u": "https://handicrafts.nic.in/crafts/All_Crafts/Craft_Categories/Textile/Other_Textiles_Based/Pashmina_Wool_of_Ladakh/PashminaWoolOfLadakhWebPage.html ; https://kids.britannica.com/students/assembly/view/328780", "t": "General knowledge"}, {"id": "ga955d6ad7a-G09", "cat": "GK", "q": "Bihu, a festival marking farming seasons with folk dance and music, is celebrated mainly in which state?", "o": ["Tamil Nadu", "Karnataka", "Assam", "Punjab"], "a": 2, "x": "The three Bihu festivals are the most important celebrations of the Assamese people. They began as agricultural festivals, and Bohag Bihu marks the new year with dancing and singing.", "s": "Encyclopaedia Britannica Kids, Assam", "u": "https://kids.britannica.com/scholars/article/Assam/111208", "t": "General knowledge"}, {"id": "ga955d6ad7a-G10", "cat": "GK", "q": "The Nilgiri Hills in southern India are the place where which two hill ranges meet?", "o": ["Western Ghats and Eastern Ghats", "The Vindhyas and the Satpuras", "The Aravallis and the Western Ghats", "The Himalayas and the Aravallis"], "a": 0, "x": "The Western Ghats rise at the Nilgiri horst, where they join the Eastern Ghats. The other pairs listed are not joined at the Nilgiris.", "s": "IISc WGBIS, Western Ghats geography; Wikipedia, Nilgiri Mountains", "u": "https://wgbis.ces.iisc.ac.in/biodiversity/sahyadri/wgbis_info/geograph.htm ; https://en.wikipedia.org/wiki/Nilgiri_Mountains", "t": "General knowledge"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
