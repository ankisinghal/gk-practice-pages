stuary forms where freshwater from rivers mixes with seawater. Its mixed water is called brackish.", "s": "NOAA, What is an estuary?", "u": "https://oceanservice.noaa.gov/facts/estuary.html", "t": "Geography: coastal waters"}, {"id": "Q716", "cat": "GK", "q": "The Panchatantra is best known as a collection of what?", "o": ["Hymns used in Vedic fire ceremonies", "Animal fables teaching practical wisdom", "Chronicles of medieval military campaigns", "Rules governing classical dance steps"], "a": 1, "x": "The Panchatantra is a Sanskrit collection of animal fables, widely translated and used to communicate wisdom through stories.", "s": "Britannica, Panchatantra", "u": "https://www.britannica.com/topic/Panchatantra-Indian-literature", "t": "Culture: literature"}, {"id": "Q717", "cat": "GK", "q": "Who belongs to the Gram Sabha of a village-level Panchayat?", "o": ["Only officials appointed by the state", "All people on its village electoral rolls", "All landowners, including non-residents", "Only its elected Panchayat members"], "a": 1, "x": "Article 243(b) defines the Gram Sabha by the people registered on the electoral rolls for the village within the Panchayat area. It is broader than the elected Gram Panchayat.", "s": "Indian Economic Service, Gram Sabha", "u": "https://ies.gov.in/arthapedia/concept/gram-sabha", "t": "Civics: village government"}, {"id": "Q718", "cat": "GK", "q": "You use your only free hour for a music lesson instead of your next-best choice, a swim. What is the opportunity cost?", "o": ["The money earned by the music teacher", "The total cost of every hobby you have", "The value of the lesson you attended", "The value of the swim you gave up"], "a": 3, "x": "Opportunity cost is the value of the next-best alternative given up when making a choice. Here, that alternative is the swim.", "s": "Federal Reserve Bank of St Louis, Opportunity cost", "u": "https://www.stlouisfed.org/open-vault/2020/march/three-ways-think-like-an-economist", "t": "Economy: choice"}, {"id": "Q719", "cat": "CA", "q": "Which issue was central to the UN World Habitat Day theme for 2026?", "o": ["Universal vaccination", "Adequate housing", "International food trade", "Affordable higher education"], "a": 1, "x": "The UN lists the 2026 World Habitat Day theme as Adequate Housing for All. This asks about the fixed 2026 campaign theme.", "s": "United Nations, World Habitat Day 2026", "u": "https://www.un.org/en/observances/habitat-day", "t": "Review: cities"}, {"id": "Q720", "cat": "CA", "q": "Which session number belongs on a report of the UN General Assembly high-level week in September 2026?", "o": ["81st", "83rd", "80th", "82nd"], "a": 0, "x": "The UN High-level Week 2026 page identifies the gathering with the General Assembly's 81st session.", "s": "United Nations, High-level Week 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "Review: United Nations"}, {"id": "Q721", "cat": "CA", "q": "World Space Week begins on 4 October. The 1957 launch of which satellite does this date commemorate?", "o": ["Explorer 1", "Luna 2", "Sputnik 1", "Vostok 1"], "a": 2, "x": "The United Nations identifies Sputnik 1 as the first human-made Earth satellite, launched on 4 October 1957. This anniversary starts World Space Week.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Review: space history"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
