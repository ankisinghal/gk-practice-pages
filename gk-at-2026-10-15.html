 ["Battle of Plassey", "First Battle of Panipat", "Battle of Buxar", "Battle of Haldighati"], "a": 0, "x": "The Battle of Plassey was fought on 23 June 1757. Clive led the East India Company forces against the forces of Siraj al-Dawlah.", "s": "Britannica, Battle of Plassey", "u": "https://www.britannica.com/event/Battle-of-Plassey", "t": "History and culture"}, {"id": "Q105", "cat": "GK", "q": "What is the minimum age an otherwise eligible Indian citizen must have reached on the qualifying date to register as a voter?", "o": ["16 years", "18 years", "21 years", "25 years"], "a": 1, "x": "The Election Commission states that a citizen must have attained 18 years on the qualifying date. Citizenship, ordinary residence and other eligibility requirements also apply.", "s": "Election Commission, voter registration", "u": "https://www.eci.gov.in/faq/en/how-to-register/", "t": "Civics"}, {"id": "Q106", "cat": "GK", "q": "Which currency would normally be used to pay in a shop in Japan?", "o": ["Won", "Baht", "Yen", "Yuan"], "a": 2, "x": "Japan's currency is the yen. The Bank of Japan lists its notes and coins in yen.", "s": "Bank of Japan, notes and coins", "u": "https://www.boj.or.jp/en/note_tfjgs/note/valid/index.htm", "t": "Everyday economy"}, {"id": "Q094", "cat": "CA", "q": "World Food Day brings attention to food security. Which UN agency announced its global ceremony for 16 October 2026?", "o": ["WHO", "ILO", "UNESCO", "FAO"], "a": 3, "x": "FAO is the Food and Agriculture Organization of the United Nations. Its announced World Food Day ceremony was scheduled for 16 October 2026.", "s": "FAO, World Food Day 2026", "u": "https://www.fao.org/webcast/detail/world-food-day-ceremony/en", "t": "World: food"}, {"id": "Q096", "cat": "GK", "q": "A ship passes south through the Suez Canal from the Mediterranean. Which sea does the canal lead into?", "o": ["Red Sea", "Black Sea", "Caspian Sea", "Arabian Sea"], "a": 0, "x": "The Suez Canal links the Mediterranean Sea to the Red Sea through Egypt.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/topic/Suez-Canal", "t": "Geography"}, {"id": "Q098", "cat": "GK", "q": "Under Article 324, which body supervises the preparation of electoral rolls for elections to Parliament?", "o": ["Comptroller and Auditor General", "Election Commission", "Finance Commission", "Union Public Service Commission"], "a": 1, "x": "Article 324 gives the Election Commission superintendence, direction and control over these electoral rolls and elections.", "s": "Constitution of India, Article 324", "u": "https://indiacode.ecourtsindia.com/constitution-of-india/article/324/", "t": "Civics"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
