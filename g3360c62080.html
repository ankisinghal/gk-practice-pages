<script>const D={"id": "g3360c62080", "date": "2026-10-24", "qs": [{"id": "Q155", "cat": "CA", "q": "The telecom ministry has announced which official theme for India Mobile Congress 2026?", "o": ["Imagine One Asia", "Scale Without Boundaries", "Rocket Revolution", "Adequate Housing for All"], "a": 1, "x": "The telecom ministry's PIB release gives Scale Without Boundaries as the official theme of India Mobile Congress 2026.", "s": "PIB, 5 October 2026; rechecked 11 October 2026; reworded 24 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319395&reg=48", "t": "India: technology"}, {"id": "Q156", "cat": "CA", "q": "World Post Day, which celebrates the 1874 founding of the Universal Postal Union, fell on which date in 2026?", "o": ["9 October", "5 October", "10 October", "24 October"], "a": 0, "x": "World Post Day is observed on 9 October, the anniversary of the Universal Postal Union's founding in 1874; PIB reported the 2026 observance.", "s": "PIB, 9 October 2026; rechecked 11 October 2026; reworded 24 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321604&lang=1&reg=1", "t": "World: postal services"}, {"id": "Q157", "cat": "CA", "q": "The 2026 Nobel Prize in Economic Sciences was shared by which pair of economists?", "o": ["Henri B. Kagan and Kenso Soai", "Paul Krugman and Joseph Stiglitz", "Robert E. Hall and Michael Woodford", "Kenneth J. Arrow and Paul A. Samuelson"], "a": 2, "x": "The Royal Swedish Academy of Sciences named Robert E. Hall and Michael Woodford as the 2026 Economic Sciences laureates for work improving stabilisation policy.", "s": "NobelPrize.org, 12 October 2026; reworded 24 October 2026", "u": "https://www.nobelprize.org/prizes/economic-sciences/2026/press-release/", "t": "World: economy"}, {"id": "Q158", "cat": "CA", "q": "In October 2026, the Union Cabinet approved renaming the National Social Assistance Programme (NSAP) to what?", "o": ["Pradhan Mantri Antyodaya Sahayata Yojana", "Pradhan Mantri Samajik Suraksha Yojana", "Pradhan Mantri Samajik Sahayata Yojana", "Bharatiya Samajik Kalyan Mission"], "a": 2, "x": "The Union Cabinet's 14 October 2026 decision continues the programme for 2026-27 to 2030-31 with an outlay of Rs 53,428 crore and renames NSAP as Pradhan Mantri Samajik Sahayata Yojana; sub-schemes such as IGNOAPS were also renamed.", "s": "PM India, Cabinet release, 14 October 2026; verified live 24 October 2026", "u": "https://www.pmindia.gov.in/en/news_updates/cabinet-approves-continuation-of-the-national-social-assistance-programme-for-five-years-from-2026-27-to-2030-31/", "t": "India: welfare"}, {"id": "Q159", "cat": "CA", "q": "Kashi Tamil Sangamam 5.0, to be held from 28 November to 12 December 2026, has which theme?", "o": ["Thirukkural Payilvom - Thirukkural Abhyas Karen", "Tamil Vattam - Circles of Learning", "Sangam Vani - Voices of Two Cities", "Kashi Katha - Bridging North and South"], "a": 0, "x": "Union Education Minister Pralhad Joshi launched the KTS 5.0 registration portal on 22 October 2026. The fifth edition's theme centres on the classical Tamil text Thirukkural, and the event celebrates the bonds between Tamil Nadu and Kashi.", "s": "PIB, 22 October 2026; verified live 24 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2326535&lang=1&reg=3", "t": "India: heritage"}, {"id": "Q160", "cat": "GK", "q": "Which is the largest organ of the human body?", "o": ["Heart", "Skin", "Liver", "Brain"], "a": 1, "x": "The skin is the body's largest organ overall; the liver is the largest internal organ.", "s": "Standard reference fact, compiled 24 October 2026", "u": "https://en.wikipedia.org/wiki/General_knowledge", "t": "Biology"}, {"id": "Q161", "cat": "GK", "q": "Which metal is liquid at room temperature?", "o": ["Iron", "Mercury", "Copper", "Aluminium"], "a": 1, "x": "Mercury is the only metal that stays liquid at room temperature.", "s": "Standard reference fact, compiled 24 October 2026", "u": "https://en.wikipedia.org/wiki/General_knowledge", "t": "Chemistry"}, {"id": "Q162", "cat": "GK", "q": "Which organisation developed the UPI digital payments system used across India?", "o": ["RBI", "ISRO", "SEBI", "NPCI"], "a": 3, "x": "The National Payments Corporation of India (NPCI) built the Unified Payments Interface; the RBI regulates payments but did not build UPI.", "s": "NPCI about-UPI page; verified 24 October 2026", "u": "https://www.npci.org.in/product/upi/about-upi", "t": "India: technology"}, {"id": "Q163", "cat": "GK", "q": "India's first passenger train ran in 1853 between which two places?", "o": ["Chennai and Arcot", "Kolkata and Howrah", "Delhi and Agra", "Mumbai and Thane"], "a": 3, "x": "The first passenger train ran from Bori Bunder in Mumbai to Thane on 16 April 1853, covering about 34 kilometres.", "s": "PIB railways press note; verified 24 October 2026", "u": "https://www.pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=158187&lang=1&reg=3", "t": "Railways"}, {"id": "Q164", "cat": "GK", "q": "Which Indian scientist and former President is known as the 'Missile Man of India'?", "o": ["A. P. J. Abdul Kalam", "Vikram Sarabhai", "C. V. Raman", "Homi Bhabha"], "a": 0, "x": "Dr A. P. J. Abdul Kalam led India's missile development programme and later served as the 11th President of India.", "s": "Standard reference fact, compiled 24 October 2026", "u": "https://en.wikipedia.org/wiki/General_knowledge", "t": "India: science"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
