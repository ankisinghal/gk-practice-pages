nventing the telephone?", "o": ["Thomas Edison", "Alexander Graham Bell", "Guglielmo Marconi", "Nikola Tesla"], "a": 1, "x": "Britannica describes Alexander Graham Bell as the scientist and teacher best remembered for inventing the telephone.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/biography/Alexander-Graham-Bell", "t": "History: inventions"}, {"id": "Q246", "cat": "GK", "q": "Which animal, famous for its speed, has had sprints measured at up to about 114 km/h?", "o": ["Cheetah", "Lion", "Leopard", "Tiger"], "a": 0, "x": "Britannica reports that cheetahs' sprints have been measured at a maximum of 114 km (71 miles) per hour, and that the cheetah is known especially for its speed.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/animal/cheetah-mammal", "t": "Animals and nature"}, {"id": "Q232", "cat": "GK", "q": "Which town is the southernmost tip of the Indian mainland?", "o": ["Rameswaram", "Thiruvananthapuram", "Puducherry", "Kanyakumari"], "a": 3, "x": "Kanyakumari in Tamil Nadu is the mainland's southernmost tip (Cape Comorin, at the tip of the Indian peninsula). Indira Point, on Great Nicobar Island in the Andaman and Nicobar Islands, lies farther south but is not on the mainland.", "s": "Britannica (Kanniyakumari) + DGLL, checked 29 October 2026", "u": "https://www.britannica.com/place/Kanniyakumari", "t": "Geography"}, {"id": "Q233", "cat": "GK", "q": "Who was the first Prime Minister of independent India?", "o": ["Rajendra Prasad", "Sardar Vallabhbhai Patel", "Lal Bahadur Shastri", "Jawaharlal Nehru"], "a": 3, "x": "Nehru took office on 15 August 1947 and remained Prime Minister until his death in 1964.", "s": "Britannica", "u": "https://www.britannica.com/biography/Jawaharlal-Nehru", "t": "History"}, {"id": "Q234", "cat": "GK", "q": "Every morning, a Delhi school assembly sings Jana Gana Mana. Who wrote the words of this song?", "o": ["Bankim Chandra Chatterjee", "Muhammad Iqbal", "Rabindranath Tagore", "Sarojini Naidu"], "a": 2, "x": "Tagore wrote Jana Gana Mana; the assembly song is India's national anthem. Bankim Chandra Chatterjee wrote Vande Mataram, a different national song.", "s": "Know India (Government of India)", "u": "https://knowindia.india.gov.in/hindi/national-identity-elements/national-anthem.php", "t": "History and culture"}, {"id": "Q235", "cat": "CA", "q": "A student designing a poster for World Space Week 2026 (4-10 October) looks up the year's official theme. What is it?", "o": ["Rocket revolution", "Journey to the poles", "Digital frontiers", "Oceans of the future"], "a": 0, "x": "UN News on 4 October named Rocket revolution as the World Space Week 2026 theme, about changes in how people reach space - the theme for the poster.", "s": "UN News, 4 October 2026", "u": "https://news.un.org/en/story/2026/10/1168517", "t": "World: space"}, {"id": "Q236", "cat": "GK", "q": "In his rock edicts, Ashoka expresses deep remorse over the suffering caused by one of his own conquests, after which he turned to dharma. Which conquest?", "o": ["Buxar", "Plassey", "Panipat", "Kalinga"], "a": 3, "x": "The edicts describe Ashoka's remorse after conquering Kalinga; Plassey, Panipat and Buxar were fought many centuries later.", "s": "Britannica", "u": "https://www.britannica.com/biography/Ashoka", "t": "History"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
