<h1>General awareness practice gfd2d20e880</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "gfd2d20e880", "date": "2026-11-22", "qs": [{"id": "gfd2d20e880-G01", "cat": "GK", "q": "An award card already names Henri B. Kagan as one of the two 2026 Chemistry Nobel laureates. Which name completes the card?", "o": ["Omar Yaghi", "Kenso Soai", "Akira Yoshino", "David Baker"], "a": 1, "x": "The Royal Swedish Academy of Sciences named Henri B. Kagan and Kenso Soai as the two chemistry laureates.", "s": "Nobel Prize, 7 October 2026", "u": "https://www.nobelprize.org/prizes/chemistry/2026/press-release/", "t": "World: awards"}, {"id": "gfd2d20e880-G02", "cat": "GK", "q": "Sample A is molten rock still below ground. Sample B is molten rock flowing outside a volcano. Which labels are correct?", "o": ["A: lava; B: magma", "A: pumice; B: ash", "A: magma; B: lava", "A: ash; B: pumice"], "a": 2, "x": "Molten rock is magma underground and lava after it emerges onto the surface.", "s": "Britannica Kids, lava", "u": "https://kids.britannica.com/kids/article/lava/353368", "t": "Earth science"}, {"id": "gfd2d20e880-G03", "cat": "GK", "q": "Which description fits a reef-building coral polyp?", "o": ["A salt crystal formed by evaporation", "A young fish inside a floating egg", "A small animal with a hard skeleton", "A plant that has underwater roots"], "a": 2, "x": "A coral polyp is a small marine animal. Reef-building polyps leave hard skeletons that contribute to the growing reef.", "s": "Britannica Kids, coral reef", "u": "https://kids.britannica.com/students/article/coral-reef/633865", "t": "Environment"}, {"id": "gfd2d20e880-G04", "cat": "CA", "q": "According to the 21 November 2026 PIB report, India completed a sixth round of CEPA trade negotiations with which country?", "o": ["Canada", "Brazil", "France", "Japan"], "a": 0, "x": "PIB reported that India and Canada completed their sixth negotiating round in New Delhi. This was a round of talks, not the signing of a final agreement.", "s": "PIB, 21 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2339731&lang=1&reg=3", "t": "India: trade"}, {"id": "gfd2d20e880-G05", "cat": "CA", "q": "India's HPV vaccination campaign reached a major milestone reported on 21 November 2026. It aims to help prevent which cancer?", "o": ["Liver cancer", "Cervical cancer", "Skin cancer", "Thyroid cancer"], "a": 1, "x": "The dated Health Ministry release describes HPV vaccination as prevention against HPV infection that can cause cervical cancer.", "s": "PIB, 21 November 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2339423&lang=2&reg=48", "t": "India: health"}, {"id": "gfd2d20e880-G06", "cat": "GK", "q": "The Bering Strait lies between which two continents?", "o": ["Asia and North America", "North America and South America", "Asia and Australia", "Europe and Africa"], "a": 0, "x": "The Bering Strait separates Asia and North America at their closest point.", "s": "Britannica, Bering Strait", "u": "https://kids.britannica.com/scholars/article/Bering-Strait/78777", "t": "Geography"}, {"id": "gfd2d20e880-G07", "cat": "GK", "q": "In 1400s Europe, Johannes Gutenberg helped make book production practical through which technology?", "o": ["Making photographs on glass plates", "Printing with movable metal type", "Recording speech on wax cylinders", "Sending messages by electric wire"], "a": 1, "x": "Gutenberg developed a practical printing press using movable metal type in Europe. He was not the first person in the world to print or to use movable type.", "s": "Britannica Kids, Johannes Gutenberg", "u": "https://kids.britannica.com/students/article/Johannes-Gutenberg/274706", "t": "History: printing"}, {"id": "gfd2d20e880-G08", "cat": "GK", "q": "The minimum attendance needed for a Lok Sabha sitting is its quorum. What fraction of the total membership is this?", "o": ["One-tenth", "One-third", "One-fourth", "One-fifth"], "a": 0, "x": "The Lok Sabha FAQ gives the quorum as one-tenth of the total membership of the House under Article 100(3). Quorum is the minimum attendance needed to constitute a sitting.", "s": "Lok Sabha FAQ, Article 100(3)", "u": "https://sansad.in/ls/faq", "t": "Civics: Parliament"}, {"id": "gfd2d20e880-G09", "cat": "GK", "q": "Oxygen leaves the air sacs in the lungs and enters which tiny surrounding blood vessels?", "o": ["Lymph vessels", "Arterioles", "Venules", "Capillaries"], "a": 3, "x": "Oxygen passes through the thin walls of the alveoli into surrounding capillaries. Alveoli are air sacs, while bronchi are airways.", "s": "NHLBI, How the Lungs Work", "u": "https://www.nhlbi.nih.gov/health/lungs/breathing-benefits", "t": "Science: respiration"}, {"id": "gfd2d20e880-G10", "cat": "GK", "q": "A bakery buys a dough-mixing machine to make bread. In economics, the machine is an example of what?", "o": ["A public good", "A consumer good", "A free good", "A capital good"], "a": 3, "x": "Capital goods include machinery used in production. The machine helps produce bread rather than being bread purchased for personal consumption.", "s": "Britannica, International trade", "u": "https://kids.britannica.com/scholars/article/international-trade/106321", "t": "Economy: production"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};

</script></body></html>
