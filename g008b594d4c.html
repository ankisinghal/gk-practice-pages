<h1>General awareness practice g008b594d4c</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "g008b594d4c", "date": "2026-10-12", "qs": [{"id": "Q049", "cat": "CA", "q": "Complete the India Mobile Congress 2026 theme: Scale Without ___.", "o": ["Limits", "Restrictions", "Constraints", "Boundaries"], "a": 3, "x": "The official theme was Scale Without Boundaries. The phrase concerns expanding digital possibilities.", "s": "PIB, 5 October 2026; checked 12 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319395&reg=48", "t": "India: technology"}, {"id": "Q061", "cat": "CA", "q": "World Post Day marks the founding of the Universal Postal Union. On which October date is it observed?", "o": ["10 October", "24 October", "9 October", "5 October"], "a": 2, "x": "World Post Day is observed on 9 October. The PIB report connects it with the founding of the Universal Postal Union in 1874.", "s": "PIB, 9 October 2026; checked 12 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321604&lang=1&reg=1", "t": "World: postal services"}, {"id": "Q068", "cat": "CA", "q": "The National Maritime Heritage Complex is being built at Lothal. In which Indian state is Lothal?", "o": ["West Bengal", "Tamil Nadu", "Gujarat", "Kerala"], "a": 2, "x": "The feature locates Lothal and the planned National Maritime Heritage Complex in Gujarat. It describes a lighthouse museum as part of the complex.", "s": "PIB, 10 October 2026; checked 12 October 2026", "u": "https://www.pib.gov.in/FeaturesDeatils.aspx?ModuleId=2&NoteId=160404&id=160404&lang=1&reg=1", "t": "India: heritage"}, {"id": "Q079", "cat": "CA", "q": "Who were named as the two 2026 Economic Sciences laureates in the official announcement on 12 October?", "o": ["Henri B. Kagan and Kenso Soai", "Robert E. Hall and Michael Woodford", "Kenneth J. Arrow and Paul A. Samuelson", "Paul Krugman and Joseph Stiglitz"], "a": 1, "x": "The Royal Swedish Academy of Sciences named Robert E. Hall and Michael Woodford for work improving stabilisation policy. This asks the laureate pair, not the technical theory.", "s": "NobelPrize.org, 12 October 2026", "u": "https://www.nobelprize.org/prizes/economic-sciences/2026/press-release/", "t": "World: economy"}, {"id": "Q080", "cat": "CA", "q": "Which Indian body announced its 33rd Foundation Day function for 12 October 2026?", "o": ["Reserve Bank of India", "Election Commission of India", "Indian Space Research Organisation", "National Human Rights Commission"], "a": 3, "x": "The dated PIB announcement identifies the National Human Rights Commission, India, whose Foundation Day function was planned for 12 October. NHRC works to protect and promote human rights.", "s": "PIB, 9 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321285&lang=1&reg=1", "t": "India: institutions"}, {"id": "Q081", "cat": "GK", "q": "Which imaginary line divides Earth into the Northern and Southern hemispheres?", "o": ["Tropic of Cancer", "Arctic Circle", "Equator", "Prime Meridian"], "a": 2, "x": "The Equator is the line at zero degrees latitude. It divides Earth into Northern and Southern hemispheres.", "s": "Britannica, checked 12 October 2026", "u": "https://www.britannica.com/place/Equator", "t": "Geography"}, {"id": "Q082", "cat": "GK", "q": "Which pigment in green plants absorbs light energy for photosynthesis?", "o": ["Chlorophyll", "Melanin", "Insulin", "Haemoglobin"], "a": 0, "x": "Chlorophyll absorbs light energy used in photosynthesis. It is found in the chloroplasts of green plants.", "s": "Britannica, checked 12 October 2026", "u": "https://www.britannica.com/science/chlorophyll", "t": "Science"}, {"id": "Q083", "cat": "GK", "q": "Emperor Ashoka belonged to which ancient Indian dynasty?", "o": ["Mughal", "Maurya", "Gupta", "Chola"], "a": 1, "x": "Ashoka ruled the Mauryan empire. His rock and pillar edicts give evidence about his reign and policies.", "s": "Britannica, checked 12 October 2026", "u": "https://www.britannica.com/summary/Ashoka", "t": "History"}, {"id": "Q084", "cat": "GK", "q": "Which House of India's Parliament is called the House of the People?", "o": ["Lok Sabha", "Legislative Council", "Supreme Court", "Rajya Sabha"], "a": 0, "x": "Lok Sabha means House of the People. Rajya Sabha is the Council of States. Parliament includes the President and both Houses.", "s": "Digital Sansad, checked 12 October 2026", "u": "https://sansad.in/ls/about/introduction", "t": "Civics"}, {"id": "Q085", "cat": "GK", "q": "Which institution issues India's Rs500 banknotes?", "o": ["State Bank of India", "Securities and Exchange Board of India", "Election Commission of India", "Reserve Bank of India"], "a": 3, "x": "The Reserve Bank of India issues banknotes such as Rs500. Do not confuse banknotes with coins or the special Rs1 note, which are issued by the Government of India.", "s": "RBI, checked 12 October 2026", "u": "https://rbi.org.in/scripts/FS_Overview.aspx?fn=2753", "t": "Economy"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
