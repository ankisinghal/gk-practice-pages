<h1>General awareness practice gaceb4be3a</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "gaceb4be3a", "date": "2026-10-31", "qs": [{"id": "Q274", "cat": "CA", "q": "The documentary 'Mothers of Courage', about women in Bihar working to keep girls in school, won which international award at a ceremony in Rome this week?", "o": ["The Nobel Peace Prize", "The 2026 UN SDG Action Award", "The Booker Prize", "A Cannes Film Festival award"], "a": 1, "x": "The Economic Times reported on 30 October 2026 that 'Mothers of Courage', part of the Shikshagraha movement, won the 2026 UN SDG Action Award in the Creativity category at Rome, chosen from over 7,000 applications from 190 countries.", "s": "The Economic Times, 30 October 2026", "u": "https://economictimes.indiatimes.com/news/india/mothers-of-courage-documentary-on-girls-education-in-bihar-wins-un-sdg-action-award/articleshow/135368133.cms", "t": "India: education"}, {"id": "Q275", "cat": "CA", "q": "Manisha Bhanwala became the first Indian woman to win a gold medal at which event, rallying to beat Abigail Nette of the USA 8-6 in the final in Astana?", "o": ["World Boxing Championships", "World Badminton Championships", "World Wrestling Championships", "World Weightlifting Championships"], "a": 2, "x": "PTI reported on 31 October 2026 that Manisha Bhanwala won the 59 kg final at the World Wrestling Championships in Astana, coming back from 1-6 down to win 8-6, the first Indian woman to take gold at this championship.", "s": "PTI via Mid-Day, 31 October 2026", "u": "https://www.mid-day.com/sports/other-sports/article/manisha-bhanwala-etches-her-name-in-historic-gold-23657814", "t": "Sports: wrestling"}, {"id": "Q276", "cat": "GK", "q": "Which instrument records the shaking of the ground during an earthquake?", "o": ["Thermometer", "Barometer", "Seismograph", "Anemometer"], "a": 2, "x": "A seismograph detects and records the ground's shaking during an earthquake. A thermometer measures temperature and a barometer measures air pressure, so they cannot record earthquakes.", "s": "Britannica, seismograph, checked 31 October 2026", "u": "https://www.britannica.com/technology/seismograph", "t": "General science"}, {"id": "Q277", "cat": "GK", "q": "Which is the largest freshwater lake in India?", "o": ["Dal Lake", "Chilika Lake", "Pangong Tso", "Wular Lake"], "a": 3, "x": "Wular Lake in Jammu and Kashmir is India's largest freshwater lake. Chilika is a brackish-water lagoon and Pangong Tso is saline, so they are not freshwater lakes.", "s": "Britannica, checked 31 October 2026", "u": "https://www.britannica.com/place/Wular-Lake", "t": "Geography"}, {"id": "Q278", "cat": "GK", "q": "What is the minimum age to be elected to the Lok Sabha?", "o": ["18 years", "25 years", "21 years", "30 years"], "a": 1, "x": "Article 84 of the Constitution sets 25 years as the minimum age for election to the Lok Sabha. 30 years is the minimum for the Rajya Sabha.", "s": "Constitution of India, Article 84, checked 31 October 2026", "u": "https://legislative.gov.in/constitution-of-india/", "t": "Civics: Constitution"}, {"id": "Q279", "cat": "GK", "q": "The ancient pyramids at Giza, built as royal tombs more than 4,000 years ago, stand in which country?", "o": ["Egypt", "Mexico", "Greece", "Peru"], "a": 0, "x": "The pyramids at Giza in Egypt were built as tombs for pharaohs. The Great Pyramid of Giza is the only surviving wonder of the ancient world.", "s": "Britannica, Pyramids of Giza, checked 31 October 2026", "u": "https://www.britannica.com/topic/Pyramids-of-Giza", "t": "History and culture"}, {"id": "Q280", "cat": "GK", "q": "How many players of one team are on the court at a time in a basketball game?", "o": ["Six", "Five", "Seven", "Eleven"], "a": 1, "x": "Basketball is played with five players per team on the court under FIBA rules.", "s": "FIBA, checked 31 October 2026", "u": "https://www.fiba.basketball/", "t": "Sports"}, {"id": "Q281", "cat": "RV", "q": "World Space Week is held every year from 4 to 10 October. The 4 October start remembers the 1957 launch of which spacecraft?", "o": ["Sputnik 1", "Explorer 1", "Vostok 1", "Telstar 1"], "a": 0, "x": "4 October 1957 marks the launch of Sputnik 1, the first human-made satellite. World Space Week also ends on 10 October, the day the 1967 Outer Space Treaty began.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Science and space"}, {"id": "Q282", "cat": "RV", "q": "Which feature was typical of Indus Valley cities such as Mohenjo-daro?", "o": ["Steel bridges", "Glass-windowed palaces", "Well-planned brick drains", "Concrete highways"], "a": 2, "x": "Indus cities had carefully planned brick bathrooms and covered drains. Steel bridges, glass windows and concrete belong to much later periods.", "s": "Britannica, checked 13 October 2026", "u": "https://www.britannica.com/place/India/The-Indus-civilization", "t": "History and culture"}, {"id": "Q283", "cat": "RV", "q": "Robert E. Hall and Michael Woodford, announced on 12 October 2026, won the 2026 Nobel Prize in which field?", "o": ["Physics", "Literature", "Peace", "Economic Sciences"], "a": 3, "x": "The Royal Swedish Academy of Sciences named Robert E. Hall and Michael Woodford as the 2026 Economic Sciences laureates on 12 October. This asks the field, the reverse of the earlier laureate-name question.", "s": "NobelPrize.org, 12 October 2026", "u": "https://www.nobelprize.org/prizes/economic-sciences/2026/press-release/", "t": "World: economy"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
