ng India's Rhysida species count to 23. Reported 20 October 2026.", "s": "Down To Earth, 20 October 2026", "u": "https://www.downtoearth.org.in/wildlife-biodiversity/three-new-centipede-species-discovered-in-western-ghats", "t": "India: wildlife"}, {"id": "Q129", "cat": "CA", "q": "AUSTRAHIND 2026, a joint military exercise that began in Kerala on 19 October 2026, is held between India and which country?", "o": ["Japan", "France", "United States", "Australia"], "a": 3, "x": "The 5th edition of AUSTRAHIND runs from 19 October to 1 November 2026 at Thiruvananthapuram, Kerala, with about 240 personnel from India and Australia. Reported 19 October 2026.", "s": "Press Information Bureau, 19 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2325246&lang=1&reg=3", "t": "India: international exercise"}, {"id": "Q130", "cat": "GK", "q": "What is the sum of the three interior angles of any triangle?", "o": ["90 degrees", "180 degrees", "270 degrees", "360 degrees"], "a": 1, "x": "The three angles inside any triangle always add up to 180 degrees.", "s": "Britannica, triangle", "u": "https://www.britannica.com/science/triangle-mathematics", "t": "Mathematics"}, {"id": "Q131", "cat": "GK", "q": "Which star is nearest to the Earth?", "o": ["The Sun", "The Moon", "Polaris", "Mars"], "a": 0, "x": "The Sun is our nearest star, about 150 million kilometres away. The Moon is not a star, and Mars is a planet.", "s": "Britannica, Sun", "u": "https://www.britannica.com/place/Sun", "t": "Science and space"}, {"id": "Q132", "cat": "GK", "q": "Which vitamin does sunlight help our skin make?", "o": ["Vitamin D", "Vitamin A", "Vitamin B12", "Vitamin C"], "a": 0, "x": "Sunlight on the skin helps the body make vitamin D, which keeps bones strong.", "s": "Britannica, vitamin D", "u": "https://www.britannica.com/science/vitamin-D", "t": "Science: health"}, {"id": "Q133", "cat": "GK", "q": "The Eiffel Tower stands in which city?", "o": ["London", "Rome", "Berlin", "Paris"],
