21201&lang=2&reg=48", "t": "India: health education"}, {"id": "Q057", "cat": "CA", "q": "The Great Indian Bustard release reported by PIB on 4 October took place in Desert National Park in which state?", "o": ["West Bengal", "Kerala", "Rajasthan", "Maharashtra"], "a": 2, "x": "The owning wildlife release places the release of two male Great Indian Bustards at Sam, Desert National Park, Jaisalmer, Rajasthan.", "s": "PIB, 4 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2318842&lang=1&reg=3", "t": "India: wildlife"}, {"id": "Q058", "cat": "GK", "q": "How many sides does a triangle have?", "o": ["Three", "Six", "Five", "Four"], "a": 0, "x": "A triangle is a polygon formed by three line segments.", "s": "Britannica, checked 9 October 2026", "u": "https://www.britannica.com/science/triangle-mathematics", "t": "Mathematics"}, {"id": "Q059", "cat": "GK", "q": "Which organs take oxygen from inhaled air into the blood?", "o": ["Liver", "Kidneys", "Stomach", "Lungs"], "a": 3, "x": "The lungs exchange gases: oxygen enters the blood and carbon dioxide leaves it.", "s": "Britannica, checked 9 October 2026", "u": "https://www.britannica.com/science/lung", "t": "Biology"}, {"id": "Q026", "cat": "CA", "q": "According to the PIB update of 4 October 2026, how many supercomputers had India deployed under the National Supercomputing Mission by September 2026?", "o": ["100", "40", "68", "14"], "a": 1, "x": "The dated PIB update reports 40 deployed supercomputers with a combined capacity of 68 petaflops as of September 2026. The count and capacity are different measures.", "s": "PIB, 4 October 2026; rechecked 6 October 2026; rechecked 7 October 2026; rechecked 8 October 2026; rechecked 9 October 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10085_20261004_17525901.pdf", "t": "India: science"}, {"id": "Q035", "cat": "CA", "q": "The PIB announcement of 5 October placed the HAL Koraput aero-engine milestone event in which
