ke", "u": "https://kids.britannica.com/scholars/article/oxbow-lake/57816", "t": "Geography: rivers"}, {"id": "Q736", "cat": "GK", "q": "A maker combines copper and zinc to form brass. What general name is given to a metal mixture of this kind?", "o": ["Alloy", "Element", "Isotope", "Ore"], "a": 0, "x": "An alloy is a mixture containing metals. Brass is an alloy made from copper and zinc.", "s": "Britannica Kids, Brass", "u": "https://kids.britannica.com/kids/article/brass/399376", "t": "Science: materials"}, {"id": "Q737", "cat": "GK", "q": "Which description best expresses universal adult franchise?", "o": ["Voting rights only for citizens who pay tax", "Voting rights only for citizens who own land", "Voting rights only for citizens with degrees", "Voting rights for every eligible adult citizen"], "a": 3, "x": "Universal adult franchise gives every eligible adult citizen the right to vote without discrimination based on wealth, education or social background. Registration and lawful eligibility requirements still apply.", "s": "NCERT, Universal Franchise and India's Electoral System", "u": "https://ncert.nic.in/textbook/pdf/hees105.pdf", "t": "Civics: elections"}, {"id": "Q738", "cat": "GK", "q": "Which example is a capital good used to produce other goods?", "o": ["A haircut for a customer", "A loaf for a family meal", "A factory weaving loom", "A ticket to a music show"], "a": 2, "x": "Capital goods include machinery used in production. A factory loom helps make cloth, rather than being a final personal-consumption purchase.", "s": "Britannica, International trade", "u": "https://kids.britannica.com/scholars/article/international-trade/106321", "t": "Economy: production"}, {"id": "Q739", "cat": "CA", "q": "Which phrase is the UN's theme for World Habitat Day 2026?", "o": ["Digital Services for All", "Adequate Housing for All", "Quality Education for All", "Clean Transport for All"], "a": 1, "x": "The United Nations lists Adequate Housing for All as the 2026 World Habitat Day theme. This is the fixed theme for that campaign year.", "s": "United Nations, World Habitat Day 2026", "u": "https://www.un.org/en/observances/habitat-day", "t": "Review: cities"}, {"id": "Q740", "cat": "CA", "q": "High-level meetings at the UN in September 2026 were part of which General Assembly session?", "o": ["82nd", "83rd", "80th", "81st"], "a": 3, "x": "The UN High-level Week 2026 page identifies that year's high-level meetings with the General Assembly's 81st session.", "s": "United Nations, High-level Week 2026", "u": "https://www.un.org/en/high-level-week-2026", "t": "Review: United Nations"}, {"id": "Q741", "cat": "CA", "q": "The 4 October opening date of World Space Week commemorates the 1957 launch of which satellite?", "o": ["Explorer 1", "Sputnik 1", "Vostok 1", "Luna 2"], "a": 1, "x": "On 4 October 1957, Sputnik 1 became the first human-made satellite of Earth. World Space Week begins on the anniversary of that launch.", "s": "United Nations, World Space Week", "u": "https://www.un.org/en/observances/world-space-week", "t": "Review: space history"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
