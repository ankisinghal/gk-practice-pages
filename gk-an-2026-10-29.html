<h1>General awareness practice gea7bab2fd2</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "gea7bab2fd2", "date": "2026-10-29", "qs": [{"id": "Q230", "cat": "CA", "q": "Under the Central Motor Vehicles Rules amendment notified in October 2026, flex-fuel vehicles may be certified for a fuel consisting of 100% ethanol. What is that fuel called?", "o": ["E85", "B20", "E20", "E100"], "a": 3, "x": "The MoRTH amendment notified on 26 October 2026 adds E100 (fuel comprising 100% ethanol) alongside E85 (up to 85% ethanol) in the Rule 115 certification tables. E20 is the ordinary petrol blend; B20 is a biodiesel blend.", "s": "The Hindu, 26 Oct 2026", "u": "https://www.thehindu.com/news/national/government-amends-motor-vehicle-rules-to-permit-pure-ethanol-flex-fuel-vehicles/article71626824.ece", "t": "India: energy"}, {"id": "Q231", "cat": "CA", "q": "The 12th BRICS Parliamentary Forum, which adopted a Joint Declaration in October 2026, was hosted by which city?", "o": ["Cape Town", "Moscow", "Beijing", "New Delhi"], "a": 3, "x": "The forum met in New Delhi on 26-27 October 2026 and adopted a Joint Declaration on people-centric development and global governance.", "s": "PIB Joint Declaration, 27 Oct 2026", "u": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/oct/doc_10279_20261027_16361601.pdf", "t": "World: diplomacy"}, {"id": "Q008", "cat": "GK", "q": "On which date did the Constitution of India come into effect?", "o": ["26 January 1950", "15 August 1947", "26 November 1949", "2 October 1950"], "a": 0, "x": "The Constitution came into effect on 26 January 1950, which India celebrates as Republic Day. It was adopted earlier, on 26 November 1949.", "s": "Britannica", "u": "https://www.britannica.com/topic/Constitution-of-India", "t": "Civics"}, {"id": "Q009", "cat": "GK", "q": "Which is the largest planet in our solar system?", "o": ["Saturn", "Neptune", "Jupiter", "Earth"], "a": 2, "x": "Jupiter is the largest planet. About 1,000 Earths could fit inside it.", "s": "NASA", "u": "https://science.nasa.gov/jupiter/jupiter-facts/", "t": "Science and space"}, {"id": "Q010", "cat": "GK", "q": "Which planet is often called the Red Planet?", "o": ["Mars", "Venus", "Mercury", "Jupiter"], "a": 0, "x": "Mars looks red because iron minerals in its soil and dust have rusted.", "s": "NASA", "u": "https://science.nasa.gov/mars/facts/", "t": "Science and space"}, {"id": "Q232", "cat": "GK", "q": "Which town is the southernmost tip of the Indian mainland?", "o": ["Rameswaram", "Puducherry", "Thiruvananthapuram", "Kanyakumari"], "a": 3, "x": "Kanyakumari in Tamil Nadu is the mainland's southernmost tip, where the Bay of Bengal, the Indian Ocean and the Arabian Sea meet. Indira Point in the Andaman Islands lies farther south but is not on the mainland.", "s": "Britannica", "u": "https://www.britannica.com/place/Kanyakumari", "t": "Geography"}, {"id": "Q233", "cat": "GK", "q": "Who was the first Prime Minister of independent India?", "o": ["Lal Bahadur Shastri", "Jawaharlal Nehru", "Rajendra Prasad", "Sardar Vallabhbhai Patel"], "a": 1, "x": "Nehru took office on 15 August 1947 and remained Prime Minister until his death in 1964. Rajendra Prasad was the first President; Shastri was the second Prime Minister.", "s": "Britannica", "u": "https://www.britannica.com/biography/Jawaharlal-Nehru", "t": "History"}, {"id": "Q234", "cat": "GK", "q": "Every morning, a Delhi school assembly sings Jana Gana Mana. Who wrote the words of this song?", "o": ["Sarojini Naidu", "Bankim Chandra Chatterjee", "Rabindranath Tagore", "Muhammad Iqbal"], "a": 2, "x": "Tagore wrote Jana Gana Mana; the assembly song is India's national anthem. Bankim Chandra Chatterjee wrote Vande Mataram, a different national song.", "s": "Know India (Government of India)", "u": "https://knowindia.india.gov.in/hindi/national-identity-elements/national-anthem.php", "t": "History and culture"}, {"id": "Q235", "cat": "CA", "q": "A student designing a poster for World Space Week 2026 (4-10 October) looks up the year's official theme. What is it?", "o": ["Digital frontiers", "Rocket revolution", "Journey to the poles", "Oceans of the future"], "a": 1, "x": "UN News on 4 October named Rocket revolution as the World Space Week 2026 theme, about changes in how people reach space - the theme for the poster.", "s": "UN News, 4 October 2026", "u": "https://news.un.org/en/story/2026/10/1168517", "t": "World: space"}, {"id": "Q236", "cat": "GK", "q": "In his rock edicts, Ashoka expresses deep remorse over the suffering caused by one of his own conquests, after which he turned to dharma. Which conquest?", "o": ["Buxar", "Plassey", "Kalinga", "Panipat"], "a": 2, "x": "The edicts describe Ashoka's remorse after conquering Kalinga; Plassey, Panipat and Buxar were fought many centuries later.", "s": "Britannica", "u": "https://www.britannica.com/biography/Ashoka", "t": "History"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
