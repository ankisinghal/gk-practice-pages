nal bird, as stated on the Government of India's Know India national bird page.", "s": "knowindia.india.gov.in, National Bird; checked 27 October 2026", "u": "https://knowindia.india.gov.in/national-identity-elements/national-bird.php", "t": "India: symbols"}, {"id": "Q202", "cat": "GK", "q": "Which is the largest mammal in the world?", "o": ["Giraffe", "Blue whale", "Hippopotamus", "African elephant"], "a": 1, "x": "The blue whale is the largest mammal - and the largest animal known to have lived on Earth.", "s": "Britannica, checked 27 October 2026", "u": "https://www.britannica.com/animal/blue-whale", "t": "Animals"}, {"id": "Q203", "cat": "GK", "q": "The original Sanskrit epic Ramayana was composed by which sage?", "o": ["Tulsidas", "Valmiki", "Ved Vyasa", "Kalidasa"], "a": 1, "x": "Valmiki composed the Sanskrit Ramayana. Ved Vyasa is linked with the Mahabharata and Tulsidas wrote the later Ramcharitmanas.", "s": "Britannica, Valmiki biography; checked 27 October 2026", "u": "https://www.britannica.com/biography/Valmiki", "t": "History and culture"}, {"id": "Q204", "cat": "GK", "q": "Which is the smallest state of India by area?", "o": ["Goa", "Sikkim", "Manipur", "Tripura"], "a": 0, "x": "Goa is India's smallest state by area (about 3,702 square kilometres), as stated on the Government of Goa portal.", "s": "goa.gov.in, About Goa State; checked 27 October 2026", "u": "https://www.goa.gov.in/know-goa/about-goa-state/", "t": "Geography: India"}, {"id": "Q205", "cat": "GK", "q": "The 2026 Nobel Prize in Literature, announced on 8 October, went to which author?", "o": ["Salman Rushdie", "Anne Carson", "Haruki Murakami", "Margaret Atwood"], "a": 1, "x": "The official Nobel website names Canadian author Anne Carson as the 2026 Literature laureate.", "s": "NobelPrize.org, 8 October 2026; rechecked 27 October 2026", "u": "https://www.nobelprize.org/prizes/literature/2026/press-release/", "t": "World: literature"}, {"id": "Q206", "cat": "GK", "q": "PIB's 5 October announcement said the Windergy India 2026 wind-energy trade fair would run from 7 to 9 October at the trade centre of which city?", "o": ["Jaipur", "Hyderabad", "Chennai", "Bengaluru"], "a": 2, "x": "PIB's 5 October announcement scheduled Windergy India 2026 at the Chennai Trade Centre from 7 to 9 October. Genuine reword: new stem and a new distractor set.", "s": "PIB, 5 October 2026; rechecked 27 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q207", "cat": "GK", "q": "Ashoka the Great, whose edicts were carved on rocks and pillars, was a king of which dynasty?", "o": ["Gupta", "Mughal", "Chola", "Maurya"], "a": 3, "x": "Ashoka ruled the Mauryan empire; his rock and pillar edicts record his reign and policies.", "s": "Britannica, checked 27 October 2026", "u": "https://www.britannica.com/summary/Ashoka", "t": "History"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
