e to former President A. P. J. Abdul Kalam.", "s": "President's Secretariat, 15 October 2026", "u": "https://dpl.rashtrapatibhavan.gov.in/view_datails/Mjk5NDI=", "t": "India: public life"}, {"id": "Q108", "cat": "CA", "q": "On which date did the UN mark the International Day of Rural Women in 2026?", "o": ["5 October", "24 October", "15 October", "11 October"], "a": 2, "x": "UN Women's statement of 13 October identifies the International Day of Rural Women as 15 October 2026. It recognises rural women's contributions to farming, communities and nature.", "s": "UN Women, 13 October 2026", "u": "https://www.unwomen.org/en/news-stories/statement/2026/10/un-women-statement-for-the-international-day-of-rural-women-15-october-2026", "t": "World: observances"}, {"id": "Q109", "cat": "GK", "q": "At standard sea-level atmospheric pressure, what is the approximate boiling point of pure water?", "o": ["125 degrees Celsius", "100 degrees Celsius", "50 degrees Celsius", "75 degrees Celsius"], "a": 1, "x": "Water boils at about 100 degrees Celsius at standard sea-level pressure. Its boiling point is lower at higher altitudes because the pressure is lower.", "s": "Britannica, boiling point", "u": "https://www.britannica.com/science/boiling-point", "t": "Science"}, {"id": "Q110", "cat": "GK", "q": "The Prime Meridian is the reference line for which value?", "o": ["90 degrees latitude", "0 degrees latitude", "0 degrees longitude", "180 degrees longitude"], "a": 2, "x": "A prime meridian is chosen as zero degrees longitude. Zero degrees latitude is the Equator. The historic Greenwich line and modern satellite reference meridian are slightly apart.", "s": "Royal Museums Greenwich, Prime Meridian", "u": "https://www.rmg.co.uk/stories/time/what-prime-meridian-why-it-greenwich", "t": "Geography"}, {"id": "Q111", "cat": "GK", "q": "The 1930 Dandi March challenged British laws controlling which everyday product?", "o": ["Salt", "Sugar", "Cotton", "Tea"], "a": 0, "x": "Gandhi and his followers went to Dandi and broke the British salt law by collecting salt. The march was part of civil disobedience against colonial rule.", "s": "Britannica, Salt March", "u": "https://www.britannica.com/event/Salt-March", "t": "History and culture"}, {"id": "Q112", "cat": "GK", "q": "Which institution is at the top of India's judicial system?", "o": ["Supreme Court", "District Court", "Sessions Court", "High Court"], "a": 0, "x": "The Supreme Court of India is the apex judicial body under the Constitution. High Courts and district-level courts are below it in the judicial system.", "s": "Supreme Court of India, history", "u": "https://www.sci.gov.in/about-department/history/", "t": "Civics"}, {"id": "Q113", "cat": "GK", "q": "Which sport uses a shuttlecock rather than a ball during play?", "o": ["Table tennis", "Squash", "Badminton", "Lawn tennis"], "a": 2, "x": "Badminton players hit a shuttlecock across a net with lightweight rackets. The other listed sports use balls.", "s": "Britannica, badminton", "u": "https://www.britannica.com/sports/badminton", "t": "Sports"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
