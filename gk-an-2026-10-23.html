<h1>General awareness practice gaa4ccee80e</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "gaa4ccee80e", "date": "2026-10-23", "qs": [{"id": "Q135", "cat": "CA", "q": "At the Asian Para Games in Nagoya, India's Sheetal Devi won two gold medals on 22 October 2026 in which sport?", "o": ["Archery", "Shooting", "Swimming", "Table tennis"], "a": 0, "x": "Sheetal Devi won two gold medals in archery at the Asian Para Games in Nagoya, Japan, as reported on 22 October 2026.", "s": "India Today, 22 Oct 2026", "u": "https://www.indiatoday.in/sports/asian-para-games/story/asian-para-games-sheetal-devi-dharmaraj-solairaj-india-medal-rush-nagoya-3022899-2026-10-22", "t": "Sports"}, {"id": "Q136", "cat": "CA", "q": "ISRO's NVS-03 navigation satellite has been cleared for a launch attempt on 30 October 2026. NVS-03 will join which Indian satellite navigation system?", "o": ["Galileo", "NavIC", "GPS", "GLONASS"], "a": 1, "x": "ISRO indicated on 22 October 2026 that NVS-03 is cleared for a launch attempt on 30 October from Sriharikota. NVS satellites form India's own NavIC system; GPS is American, Galileo European and GLONASS Russian.", "s": "Indian Express, 22 Oct 2026", "u": "https://indianexpress.com/article/india/isro-nvs-03-launch-date-oct-30-navic-satellite-10931999/", "t": "Science and space"}, {"id": "Q137", "cat": "GK", "q": "Which animal is traditionally called the 'Ship of the Desert'?", "o": ["Elephant", "Horse", "Yak", "Camel"], "a": 3, "x": "The camel is called the Ship of the Desert because it can carry people and loads across dry deserts for days without water.", "s": "Britannica Kids, camel", "u": "https://kids.britannica.com/students/article/camel/273469", "t": "Animals and nature"}, {"id": "Q138", "cat": "GK", "q": "How many days are there in a leap year?", "o": ["366", "364", "365", "367"], "a": 0, "x": "A leap year has 366 days; the extra day is 29 February. It keeps the calendar in step with Earth's journey around the Sun.", "s": "Britannica, leap year", "u": "https://kids.britannica.com/scholars/article/leap-year/47526", "t": "General science"}, {"id": "Q139", "cat": "GK", "q": "Which is the smallest continent in the world?", "o": ["South America", "Australia", "Europe", "Antarctica"], "a": 1, "x": "Australia is the smallest continent; Asia is the largest.", "s": "Britannica Kids, continent", "u": "https://kids.britannica.com/students/article/continent/273790", "t": "World geography"}, {"id": "Q140", "cat": "GK", "q": "How many colours are there in a rainbow?", "o": ["Five", "Six", "Seven", "Eight"], "a": 2, "x": "A rainbow shows seven colours: violet, indigo, blue, green, yellow, orange and red.", "s": "NCERT Class 10 Science, The Human Eye and the Colourful World", "u": "https://ncert.nic.in/textbook/pdf/jesc110.pdf", "t": "General science"}, {"id": "Q141", "cat": "GK", "q": "Which festival is known as the Festival of Lights?", "o": ["Holi", "Christmas", "Eid", "Diwali"], "a": 3, "x": "Diwali, the Festival of Lights, is celebrated with rows of lamps and candles; it falls in October or November.", "s": "Britannica, Diwali", "u": "https://kids.britannica.com/scholars/article/Diwali/30695", "t": "History and culture"}, {"id": "Q146", "cat": "CA", "q": "Rhysida quadrispinosa, Rhysida coorgensis and Rhysida neyyarensis, newly discovered in the Western Ghats, are three new species of which creature?", "o": ["Scorpion", "Millipede", "Centipede", "Spider"], "a": 2, "x": "The discoveries in Kerala and Karnataka forests, by ZSI's Western Ghats Regional Centre and Malabar Christian College, bring India's known Rhysida species to 23. Reported 20 October 2026.", "s": "Down To Earth, 20 October 2026", "u": "https://www.downtoearth.org.in/wildlife-biodiversity/three-new-centipede-species-discovered-in-western-ghats", "t": "India: wildlife"}, {"id": "Q143", "cat": "CA", "q": "Which state's Sirpur Cultural and Archaeological Landscape was added to UNESCO's tentative World Heritage list, as reported on 20 October 2026?", "o": ["Chhattisgarh", "Odisha", "Rajasthan", "Bihar"], "a": 0, "x": "Sirpur village lies in the Mahasamund district of Chhattisgarh, on the Mahanadi river, and is a nationally protected monument. The UNESCO tentative-list addition was reported on 20 October 2026.", "s": "UNESCO tentative list, reported 20 October 2026", "u": "https://whc.unesco.org/en/tentativelists/7054/", "t": "India: heritage"}, {"id": "Q142", "cat": "GK", "q": "The Prime Meridian, which passes through Greenwich, marks the zero point for which measurement?", "o": ["Latitude (0 degrees)", "Longitude (0 degrees)", "Greenwich Mean Time", "Altitude above sea level"], "a": 1, "x": "Longitude is measured east and west from the Prime Meridian at Greenwich, counted as 0 degrees. The zero line for latitude is the Equator. The historic Greenwich line and the modern satellite reference meridian differ slightly.", "s": "Royal Museums Greenwich, Prime Meridian", "u": "https://www.rmg.co.uk/stories/time/what-prime-meridian-why-it-greenwich", "t": "Geography"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
