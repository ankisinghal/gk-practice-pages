, "u": "https://knowindia.india.gov.in/hindi/national-identity-elements/national-anthem.php", "t": "History and culture"}, {"id": "Q017", "cat": "CA", "q": "Which satellite's launch on 4 October 1957 is commemorated by the opening date of World Space Week?", "o": ["Explorer 1", "Sputnik 1", "Vanguard 1", "Aryabhata"], "a": 1, "x": "Sputnik 1 was the first human-made Earth satellite. Its 4 October 1957 launch is one of the events marked by World Space Week.", "s": "UN, World Space Week; checked 13 October 2026", "u": "https://www.un.org/en/observances/world-space-week", "t": "Science and space"}, {"id": "Q050", "cat": "CA", "q": "A tiger-conservation programme at Buxa concerns a reserve in which Indian state?", "o": ["Madhya Pradesh", "Assam", "West Bengal", "Bihar"], "a": 2, "x": "Buxa Tiger Reserve is in West Bengal. The tigress reported in the October2 release came from Bihar, but the destination reserve is not in Bihar.", "s": "PIB, rechecked 13 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2318110&lang=1&reg=3", "t": "India: wildlife"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
