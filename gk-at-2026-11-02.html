urement?", "o": ["Altitude above sea level", "Longitude (0 degrees)", "Greenwich Mean Time", "Latitude (0 degrees)"], "a": 1, "x": "Longitude is measured east and west from the Prime Meridian at Greenwich, counted as 0 degrees. The zero line for latitude is the Equator. The historic Greenwich line and the modern satellite reference meridian differ slightly.", "s": "Royal Museums Greenwich, Prime Meridian", "u": "https://www.rmg.co.uk/stories/time/what-prime-meridian-why-it-greenwich", "t": "Geography"}, {"id": "Q236", "cat": "GK", "q": "In his rock edicts, Ashoka expresses deep remorse over the suffering caused by one of his own conquests, after which he turned to dharma. Which conquest?", "o": ["Panipat", "Kalinga", "Plassey", "Buxar"], "a": 1, "x": "The edicts describe Ashoka's remorse after conquering Kalinga; Plassey, Panipat and Buxar were fought many centuries later.", "s": "Britannica", "u": "https://www.britannica.com/biography/Ashoka", "t": "History"}, {"id": "Q278", "cat": "GK", "q": "What is the minimum age to be elected to the Lok Sabha?", "o": ["18 years", "30 years", "25 years", "21 years"], "a": 2, "x": "Article 84 of the Constitution sets 25 years as the minimum age for election to the Lok Sabha. 30 years is the minimum for the Rajya Sabha.", "s": "Constitution of India, Article 84, checked 31 October 2026", "u": "https://legislative.gov.in/constitution-of-india/", "t": "Civics: Constitution"}, {"id": "Q276", "cat": "GK", "q": "Which instrument records the shaking of the ground during an earthquake?", "o": ["Anemometer", "Barometer", "Thermometer", "Seismograph"], "a": 3, "x": "A seismograph detects and records the ground's shaking during an earthquake. A thermometer measures temperature and a barometer measures air pressure, so they cannot record earthquakes.", "s": "Britannica, seismograph, checked 31 October 2026", "u": "https://www.britannica.com/technology/seismograph", "t": "General science"}, {"id": "Q310", "cat": "CA", "q": "Navi Pillay was in the news in October 2026 for receiving which honour?", "o": ["The 2026 Ramon Magsaysay Award", "The 2026 Nobel Prize in Literature", "The 2026 Nobel Peace Prize", "The 2026 Booker Prize"], "a": 2, "x": "Navi Pillay was awarded the 2026 Nobel Peace Prize on 9 October 2026 (Nobel Committee and UN News). Review: new wording.", "s": "Nobel Committee, 9 October 2026", "u": "https://www.nobelprize.org/prizes/peace/2026/press-release/", "t": "World: peace"}, {"id": "Q311", "cat": "CA", "q": "PIB's 7 October announcement named which city as the venue of the second Sadhana Shrinkhla regional workshop on 9 October 2026?", "o": ["Guwahati", "Chandigarh", "Bhubaneswar", "Visakhapatnam"], "a": 0, "x": "The second Sadhana Shrinkhla regional workshop was scheduled for Guwahati on 9 October 2026 (PIB, 7 October 2026). Review: new wording.", "s": "PIB, 7 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319951&reg=3", "t": "India: training"}, {"id": "Q312", "cat": "GK", "q": "A visitor to the Ajanta caves finds paintings and monasteries linked mainly to which religion?", "o": ["Buddhism", "Hinduism", "Jainism", "Sikhism"], "a": 0, "x": "The rock-cut temples and monasteries of Ajanta are primarily Buddhist (Britannica). Review: new wording.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/place/Ajanta-Caves", "t": "History and culture"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
