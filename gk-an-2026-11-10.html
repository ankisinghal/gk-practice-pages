itsar", "Delhi", "Lucknow", "Lahore"], "a": 0, "x": "British troops fired on a gathering at Jallianwala Bagh in Amritsar, Punjab, on 13 April 1919. The event is also called the Amritsar massacre.", "s": "Britannica, Jallianwala Bagh Massacre", "u": "https://www.britannica.com/event/Jallianwala-Bagh-Massacre", "t": "History"}, {"id": "Q501", "cat": "GK", "q": "What is the minimum age at which an Indian citizen can register to vote in a Lok Sabha election?", "o": ["16 years", "21 years", "18 years", "25 years"], "a": 2, "x": "The Election Commission of India states that every Indian citizen who is 18 years or older on the qualifying date can be registered as a voter. Article 326 of the Constitution gives this right.", "s": "Election Commission of India", "u": "https://www.eci.gov.in", "t": "Civics"}, {"id": "Q502", "cat": "GK", "q": "In everyday banking, what does the abbreviation ATM stand for?", "o": ["All Time Money", "Any Time Money", "Automatic Transfer Machine", "Automated Teller Machine"], "a": 3, "x": "ATM stands for Automated Teller Machine, the machine that lets bank customers withdraw cash and do other transactions.", "s": "Bankrate banking guide", "u": "https://www.bankrate.com/banking/what-is-an-atm/", "t": "Everyday economy"}, {"id": "Q503", "cat": "GK", "q": "How many players of one volleyball team are on the court during play?", "o": ["9", "6", "7", "5"], "a": 1, "x": "Volleyball's governing body, the FIVB, states there are six players on court in a volleyball team, rotating clockwise after winning back service.", "s": "FIVB official rules", "u": "https://www.fivb.com/EN/Refereeing-Rules/RulesOfTheGame_VB.asp", "t": "Sports"}, {"id": "Q504", "cat": "CA", "q": "World Habitat Day is observed on the first Monday of October every year. On which date did it fall in 2026?", "o": ["10 October", "5 October", "1 October", "7 October"], "a": 1, "x": "The first Monday of October 2026 was 5 October, when World Habitat Day was marked under the theme 'Adequate Housing for All'.", "s": "UN-Habitat, World Habitat Day 2026", "u": "https://unhabitat.org/world-habitat-day-2026", "t": "UN observances"}, {"id": "Q505", "cat": "CA", "q": "The UN General Assembly held its first session in 1946 and meets every year. Which session opened its high-level week in September 2026?", "o": ["81st", "82nd", "80th", "79th"], "a": 0, "x": "Counting one session each year from 1946, the September 2026 high-level week belonged to the 81st session of the UN General Assembly.", "s": "United Nations, General Assembly sessions", "u": "https://www.un.org/en/ga/", "t": "United Nations"}, {"id": "Q506", "cat": "CA", "q": "World Space Week runs 4 to 10 October. Its opening date marks which 1957 event?", "o": ["The Apollo 11 Moon landing", "The first human journey into space", "The launch of India's Aryabhata satellite", "The launch of Sputnik 1, the first artificial satellite"], "a": 3, "x": "4 October 1957 saw the launch of Sputnik 1; 10 October marks the 1967 Outer Space Treaty. World Space Week joins the two dates.", "s": "World Space Week Association", "u": "https://www.worldspaceweek.org/", "t": "Space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
