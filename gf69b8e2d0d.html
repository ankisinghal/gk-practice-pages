<h1>General awareness practice gf69b8e2d0d</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "gf69b8e2d0d", "date": "2026-11-28", "qs": [{"id": "gf69b8e2d0d-G01", "cat": "CA", "q": "PIB reported on 26 November 2026 that the Chariot-1 foundation models, covering language and speech generation, were launched at Bharat Mandapam. Under which government mission is Chariot Artificial Intelligence building them?", "o": ["National Quantum Mission", "Digital India Bhashini Mission", "IndiaAI Mission", "Startup India Seed Fund"], "a": 2, "x": "Chariot-1 models are being built by Chariot Artificial Intelligence under the IndiaAI Mission (PIB 26 Nov 2026, MeitY Secretary S. Krishnan, Bharat Mandapam). Source: https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2341725&lang=1&reg=3", "s": "", "u": "", "t": "Recent news"}, {"id": "gf69b8e2d0d-G02", "cat": "CA", "q": "On 26 November 2026 the Directorate of Revenue Intelligence seized 19.39 kg of elephant ivory in West Champaran, Bihar. Under which Act was the ivory seized?", "o": ["Wildlife (Protection) Act, 1972", "Forest Conservation Act, 1980", "Biological Diversity Act, 2002", "Environment (Protection) Act, 1986"], "a": 0, "x": "DRI seized 19.39 kg of elephant ivory in West Champaran under the Wildlife (Protection) Act, 1972 (PIB 26 Nov 2026). Source: https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2341791&lang=2&reg=48", "s": "", "u": "", "t": "Recent news"}, {"id": "gf69b8e2d0d-G03", "cat": "CA", "q": "Which phrase is the India Mobile Congress 2026 theme, and not the slogan of some other major event?", "o": ["Imagine One Asia", "Together for a Shared Future", "One World One Dream", "Scale Without Boundaries"], "a": 3, "x": "PIB 5 Oct 2026: IMC 2026 theme is Scale Without Boundaries. Imagine One Asia is the Asian Games 2026 slogan; the others are slogans of other events. Source: repo bank Q049 (PIB, 5 October 2026).", "s": "", "u": "", "t": "Revision"}, {"id": "gf69b8e2d0d-G04", "cat": "CA", "q": "Which date is observed worldwide as World Post Day?", "o": ["4 October", "9 October", "5 October", "24 October"], "a": 1, "x": "World Post Day is observed on 9 October each year. Stable fact; 4 Oct, 5 Oct and 24 Oct are other observances.", "s": "", "u": "", "t": "Revision"}, {"id": "gf69b8e2d0d-G05", "cat": "CA", "q": "Which two economists were named by the Royal Swedish Academy of Sciences as the 2026 Economic Sciences laureates?", "o": ["Robert E. Hall and Michael Woodford", "Paul Milgrom and Robert Wilson", "Abhijit Banerjee and Esther Duflo", "Robert Merton and Myron Scholes"], "a": 0, "x": "Royal Swedish Academy of Sciences named Robert E. Hall and Michael Woodford the 2026 Economic Sciences laureates, 12 Oct 2026. Source: https://www.nobelprize.org/prizes/economic-sciences/2026/press-release/ (bank Q079).", "s": "", "u": "", "t": "Revision"}, {"id": "gf69b8e2d0d-G06", "cat": "GK", "q": "Who was the first woman to serve as Prime Minister of India?", "o": ["Sarojini Naidu", "Sucheta Kripalani", "Indira Gandhi", "Pratibha Patil"], "a": 2, "x": "Indira Gandhi was India's first woman Prime Minister. Stable fact.", "s": "", "u": "", "t": "General knowledge"}, {"id": "gf69b8e2d0d-G07", "cat": "GK", "q": "In which year did India first win the Cricket World Cup?", "o": ["1975", "1987", "1992", "1983"], "a": 3, "x": "India first won the Cricket World Cup in 1983. Stable fact.", "s": "", "u": "", "t": "General knowledge"}, {"id": "gf69b8e2d0d-G08", "cat": "GK", "q": "Which artist painted the Mona Lisa?", "o": ["Michelangelo", "Leonardo da Vinci", "Raphael", "Vincent van Gogh"], "a": 1, "x": "Leonardo da Vinci painted the Mona Lisa. Stable fact.", "s": "", "u": "", "t": "General knowledge"}, {"id": "gf69b8e2d0d-G09", "cat": "GK", "q": "Mount Kilimanjaro, the highest mountain in Africa, lies in which country?", "o": ["Tanzania", "Kenya", "Uganda", "Ethiopia"], "a": 0, "x": "Mount Kilimanjaro is in Tanzania. Stable fact.", "s": "", "u": "", "t": "General knowledge"}, {"id": "gf69b8e2d0d-G10", "cat": "GK", "q": "Which planet is often called the Morning Star because it shines brightly before sunrise?", "o": ["Mars", "Mercury", "Venus", "Jupiter"], "a": 2, "x": "Venus is called the Morning Star. Stable fact.", "s": "", "u": "", "t": "General knowledge"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+(q.u?'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span>":"")+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.getElementById("copy").textContent="Copy failed - code selected; copy manually"}};
</script></body></html>
