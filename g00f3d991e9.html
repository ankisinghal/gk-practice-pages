, "o": ["Malaria", "Measles", "Tuberculosis", "Polio"], "a": 2, "x": "The dated health ministry release describes youth-led community action by JOSH Teams to support tuberculosis elimination.", "s": "PIB, 8 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2320653&lang=1&reg=48", "t": "India: health"}, {"id": "Q048", "cat": "CA", "q": "Which city hosts Windergy India 2026, according to the PIB announcement of 5 October?", "o": ["Chennai", "New Delhi", "Ahmedabad", "Mumbai"], "a": 0, "x": "The dated announcement places Windergy India at Chennai Trade Centre from 7 to 9 October. This question asks the venue city, not whether an inauguration has finished.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319302&reg=3", "t": "India: energy"}, {"id": "Q049", "cat": "CA", "q": "What is the theme of India Mobile Congress 2026, according to PIB on 5 October?", "o": ["Rocket Revolution", "Adequate Housing for All", "Imagine One Asia", "Scale Without Boundaries"], "a": 3, "x": "The telecom ministry release gives Scale Without Boundaries as the theme of India Mobile Congress 2026.", "s": "PIB, 5 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2319395&reg=48", "t": "India: technology"}, {"id": "Q050", "cat": "CA", "q": "A PIB report on 2 October described a tigress release at Buxa Tiger Reserve. In which state is Buxa?", "o": ["Assam", "West Bengal", "Rajasthan", "Bihar"], "a": 1, "x": "The dated wildlife release locates Buxa Tiger Reserve in West Bengal and describes a phased tiger reintroduction programme.", "s": "PIB, 2 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2318110&lang=1&reg=3", "t": "India: wildlife"}, {"id": "Q051", "cat": "GK", "q": "Which gas makes up the largest share of Earth's atmosphere?", "o": ["Carbon dioxide", "Oxygen", "Nitrogen", "Helium"], "a": 2, "x": "NASA describes the air mixture as about 78 percent nitrogen and 21 percent oxygen. Nitrogen therefore makes up the largest share.", "s": "NASA, checked 8 October 2026", "u": "https://science.nasa.gov/solar-system/10-things-planetary-atmospheres/", "t": "Science"}, {"id": "Q052", "cat": "GK", "q": "During evaporation, liquid water changes into what?", "o": ["Salt", "Ice", "Liquid oxygen", "Water vapour"], "a": 3, "x": "Evaporation changes water from liquid into gas at the surface. Water vapour is the gaseous form of water.", "s": "Britannica, checked 8 October 2026", "u": "https://www.britannica.com/science/evaporation", "t": "Science"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
