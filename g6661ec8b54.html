<script>const D={"id": "g6661ec8b54", "date": "2026-11-23", "qs": [{"id": "g6661ec8b54-G01", "cat": "GK", "q": "A marsh formerly received seasonal river flooding. An embankment has cut off that flow, damaging its wetland habitat. Which plan best follows Ramsar wetland-restoration guidance?", "o": ["Keep the marsh permanently dry for tree plantations.", "Restore the seasonal flow appropriate to that marsh.", "Replace its shallow habitat with a deep concrete pool.", "Fill the marsh and install small ornamental fountains."], "a": 1, "x": "Ramsar guidance links wetland functions to the appropriate flow, quantity, quality and timing of water. Restoring this marsh's former seasonal hydrology is supported; this does not mean identical flooding suits every wetland.", "s": "Ramsar Resolution VII.18, paragraphs47-49", "u": "https://www.ramsar.org/sites/default/files/documents/library/key_res_vii.18e_0.pdf", "t": "Revision"}, {"id": "g6661ec8b54-G02", "cat": "GK", "q": "A boat floats freely in calm water, without touching the bottom. A cargo box is added. It still floats freely in the same water but sits lower. Why?", "o": ["It displaces more water to balance the added weight.", "Its upward buoyant force stays fixed despite the load.", "It loses its original weight when its sides become wet.", "The cargo makes the surrounding water less dense."], "a": 0, "x": "For a freely floating boat, buoyant force balances total weight. By Archimedes' principle, that force equals displaced-water weight. The added load therefore requires more displaced water in the same liquid.", "s": "Britannica, Archimedes' principle", "u": "https://kids.britannica.com/scholars/article/Archimedes-principle/9286", "t": "Revision"}, {"id": "g6661ec8b54-G03", "cat": "GK", "q": "For fiscal-deficit accounting, compare government expenditure with receipts excluding borrowing; record borrowing separately as financing. An analyst says, \"Borrowing covers the whole gap, so the fiscal deficit disappears.\" What is wrong?", "o": ["Borrowed funds must instead be recorded as tax revenue.", "Every interest payment must be omitted from expenditure.", "Financing the gap does not remove the measured deficit.", "All capital expenditure must be left out of the budget."], "a": 2, "x": "The official fiscal-deficit definition excludes debt capital receipts. Borrowing can finance that measured gap without erasing it. This statement applies to fiscal-deficit accounting, not every use of the word receipts.", "s": "Union Budget2025-26, Budget at a Glance, paragraph2", "u": "https://www.indiabudget.gov.in/budget2025-26/doc/Budget_at_Glance/bag1.pdf", "t": "Revision"}, {"id": "g6661ec8b54-G04", "cat": "CA", "q": "The 99th Fit India Sundays on Cycle, reported by PIB on 22 November 2026, marked which occasion?", "o": ["National Science Day", "World Environment Day", "International Yoga Day", "Samvidhan Divas"], "a": 3, "x": "PIB's 22 November 2026 report says the 99 th edition was celebrated with the theme of Samvidhan Divas. This refers to that edition, not every Sunday. Source dated 22 November 2026, fetched 23 November 2026.", "s": "PIB, 22 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2339875&lang=1&reg=1", "t": "Recent news"}, {"id": "g6661ec8b54-G05", "cat": "CA", "q": "A PIB report on 23 November 2026 announced a planned 25 November launch for the fifth edition of Nayi Chetna. What will be central to this fifth edition?", "o": ["Promoting space exploration and satellite technology", "Women's economic empowerment and equal opportunities", "Preserving ancient monuments and historic buildings", "Improving coastal navigation and port facilities"], "a": 1, "x": "As of 23 November 2026, PIB announced the 25 November launch as a future plan. The fifth edition places women's economic empowerment at the centre, within a gender campaign addressing discrimination and gender-based violence. Source dated 23 November 2026, fetched 23 November 2026.", "s": "PIB,23November2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2340195", "t": "Recent news"}, {"id": "g6661ec8b54-G06", "cat": "GK", "q": "A long, narrow sea inlet occupies a deep valley carved by a glacier. What is this landform called?", "o": ["A delta", "A fjord", "A sandbar", "An atoll"], "a": 1, "x": "A fjord forms when the sea floods a glacier-carved valley. Its glacial origin distinguishes it from a river-built delta or a coral atoll.", "s": "Britannica, Fjord", "u": "https://kids.britannica.com/scholars/article/fjord/34455", "t": "General knowledge"}, {"id": "g6661ec8b54-G07", "cat": "GK", "q": "Preserved shells, bones and footprints can provide evidence of life from long ago. What is the general name for these remains or traces?", "o": ["Sediments", "Mineral ores", "Fossils", "Crystals"], "a": 2, "x": "Fossils are preserved remains or traces of ancient living things. A footprint can be a fossil even though it is not a body part.", "s": "Britannica, Fossil", "u": "https://kids.britannica.com/kids/article/fossil/353144", "t": "General knowledge"}, {"id": "g6661ec8b54-G08", "cat": "GK", "q": "The ancient law collection known as the Code of Hammurabi is associated with a king of which civilization?", "o": ["Babylonia", "Ancient Egypt", "The Roman Empire", "Ancient China"], "a": 0, "x": "Hammurabi was a Babylonian king. His law code was recorded on stone and covered matters including trade, family relationships and crime.", "s": "Britannica, Code of Hammurabi", "u": "https://kids.britannica.com/students/article/Code-of-Hammurabi/319940", "t": "General knowledge"}, {"id": "g6661ec8b54-G09", "cat": "GK", "q": "Why does a democratic election use a secret ballot?", "o": ["To keep each voter's choice private", "To keep the names of candidates hidden", "To keep the final vote totals undisclosed", "To keep the polling date unannounced"], "a": 0, "x": "Secrecy protects an individual voter's choice. It does not mean hiding candidates, the polling date or the published election result.", "s": "Election Commission of India, Legal History of EVMs and VVPATs", "u": "https://www.eci.gov.in/eci-backend/public/uploads/monthly_2022_11/10386732_LegalHistoryofEVMsandVVPATs_pdf.a942a6ed2e36892f92adecb5e88f6d3d", "t": "General knowledge"}, {"id": "g6661ec8b54-G10", "cat": "GK", "q": "What does gross domestic product measure for a country over a given period?", "o": ["The total earnings of the country's citizens living abroad", "The combined resale value of all government-owned land", "The total balance of all household savings accounts", "The value of final domestic goods and services produced"], "a": 3, "x": "GDP measures production within a country's borders over a period. It counts final goods and services, rather than simply adding bank balances or the value of land.", "s": "International Monetary Fund, Gross Domestic Product", "u": "https://www.imf.org/external/pubs/ft/fandd/basics/14%5Fgdp.htm", "t": "General knowledge"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
