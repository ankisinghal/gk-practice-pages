<script>const D={"id": "g95a87ac12e", "date": "2026-10-07", "qs": [{"id": "Q039", "cat": "CA", "q": "Which pair received the 2026 Nobel Prize in Chemistry announced on 7 October?", "o": ["Francis Halzen and Peter Hegemann", "Henri B. Kagan and Kenso Soai", "Emmanuelle Charpentier and Jennifer Doudna", "Karl Deisseroth and Georg Nagel"], "a": 1, "x": "The official Nobel announcement names Henri B. Kagan and Kenso Soai for discoveries about non-linear effects and autocatalysis in asymmetric organic synthesis.", "s": "Nobel Academy, 7 October 2026", "u": "https://www.nobelprize.org/prizes/chemistry/2026/press-release/", "t": "World: science"}, {"id": "Q040", "cat": "CA", "q": "What is the name of the first indigenous Fleet Support Ship launched at Hindustan Shipyard in Visakhapatnam on 6 October 2026?", "o": ["Arihant", "Vikrant", "Vikramaditya", "Surya"], "a": 3, "x": "The 6 October report names the Fleet Support Ship Surya. The question asks the name, not its operational service status.", "s": "The Print, 6 October 2026; PIB release list, checked 7 October", "u": "https://theprint.in/defence/hindustan-shipyard-delivers-surya-1st-of-5-logistics-vessels-to-boost-navys-high-seas-endurance/3063366/", "t": "India: maritime"}, {"id": "Q041", "cat": "CA", "q": "What was the official slogan of the 2026 Asian Games in Aichi-Nagoya, according to PIB on 6 October?", "o": ["Imagine One Asia", "One World One Dream", "Faster Together", "United by Emotion"], "a": 0, "x": "The PIB overview dated 6 October identifies Imagine One Asia as the official slogan of the Aichi-Nagoya 2026 Asian Games.", "s": "PIB, 6 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2319703&lang=1&reg=3", "t": "Sports"}, {"id": "Q042", "cat": "CA", "q": "The PIB factsheet of 17 September 2026 describes ECMS as a scheme supporting manufacturing of what?", "o": ["Cotton clothing", "Agricultural fertilisers", "Electronic components", "Railway coaches"], "a": 2, "x": "ECMS means Electronics er soft-land on the Moon?", "o": ["2023", "2021", "2025", "2019"], "a": 0, "x": "Chandrayaan-3 soft-landed on the Moon on 23 August 2023.", "s": "ISRO; rechecked 6 October 2026; rechecked 7 October 2026", "u": "https://www.isro.gov.in/Chandrayaan3.html", "t": "Science and space"}, {"id": "Q013", "cat": "GK", "q": "What is the name of India's own independent satellite navigation system, earlier called IRNSS?", "o": ["BharatNav", "NavIC", "SwaDesh GPS", "Disha-1"], "a": 1, "x": "NavIC stands for Navigation with Indian Constellation. It was earlier known as the Indian Regional Navigation Satellite System (IRNSS).", "s": "ISRO; rechecked 6 October 2026; rechecked 7 October 2026", "u": "https://www.isro.gov.in/Navic.html", "t": "Science and space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
