<h1>General awareness practice g6a5e5d027c</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "g6a5e5d027c", "date": "2026-11-09", "qs": [{"id": "Q491", "cat": "CA", "q": "In November 2026, the Indian Air Force made the world's highest-altitude landing by this type of heavy transport aircraft at Nyoma airbase in Ladakh. Which aircraft was it?", "o": ["IL-76MD", "C-130J Super Hercules", "An-32", "C-17 Globemaster III"], "a": 0, "x": "The IAF IL-76MD landed at Nyoma in November 2026. The record is the highest-altitude landing by this aircraft model, not by every kind of aircraft.", "s": "Administration of UT Ladakh, 13,629 Feet: A New Height in Aviation History", "u": "https://ladakh.gov.in/13629-feet-a-new-height-in-aviation-history/", "t": "India: current affairs"}, {"id": "Q492", "cat": "CA", "q": "Which Indian state celebrated its Foundation Day on 9 November 2026, with greetings from the Prime Minister?", "o": ["Haryana", "Uttarakhand", "Jharkhand", "Chhattisgarh"], "a": 1, "x": "Uttarakhand celebrated its Foundation Day on 9 November 2026. The Prime Minister sent greetings to the people of the state.", "s": "PM India, statehood-day greetings, 9 November 2026", "u": "https://www.pmindia.gov.in/en/news_updates/pm-extends-greetings-to-the-people-of-uttarakhand-on-statehood-day/", "t": "India: current affairs"}, {"id": "Q493", "cat": "GK", "q": "Which is the only mammal that can truly fly?", "o": ["The eagle", "The flying squirrel", "The sugar glider", "The bat"], "a": 3, "x": "Bats are the only mammals capable of true flight. Flying squirrels and sugar gliders glide rather than fly; eagles are birds.", "s": "Britannica, bat", "u": "https://www.britannica.com/animal/bat-mammal", "t": "General knowledge"}, {"id": "Q494", "cat": "GK", "q": "What is the capital of Japan?", "o": ["Tokyo", "Kyoto", "Beijing", "Osaka"], "a": 0, "x": "Tokyo is the capital of Japan.", "s": "Britannica, Tokyo", "u": "https://www.britannica.com/place/Tokyo", "t": "General knowledge"}, {"id": "Q495", "cat": "GK", "q": "Which is the largest bird in the world?", "o": ["The peacock", "The ostrich", "The eagle", "The penguin"], "a": 1, "x": "The ostrich is the largest living bird.", "s": "Britannica, ostrich", "u": "https://www.britannica.com/animal/ostrich", "t": "General knowledge"}, {"id": "Q496", "cat": "GK", "q": "Which light gas is filled in party balloons to make them float in the air?", "o": ["Oxygen", "Helium", "Carbon dioxide", "Nitrogen"], "a": 1, "x": "Helium is lighter than air and does not catch fire, so it lifts balloons safely.", "s": "Royal Society of Chemistry, Periodic Table: Helium", "u": "https://periodic-table.rsc.org/element/2/helium", "t": "General knowledge"}, {"id": "Q480", "cat": "GK", "q": "Who was the first President of India?", "o": ["Dr. S. Radhakrishnan", "Dr. B. R. Ambedkar", "Dr. Rajendra Prasad", "Jawaharlal Nehru"], "a": 2, "x": "Dr. Rajendra Prasad became India's first President in 1950; Radhakrishnan was the first Vice-President, Nehru the first Prime Minister (Britannica).", "s": "Britannica reference", "u": "https://www.britannica.com/biography/Rajendra-Prasad", "t": "History: modern India"}, {"id": "Q471", "cat": "CA", "q": "A school noticeboard marks World Habitat Day 2026. Which theme should it show?", "o": ["Sustainable Transport for All", "Green Energy for All", "Adequate Housing for All", "Clean Water for All"], "a": 2, "x": "World Habitat Day 2026 (5 October) carried the theme 'Adequate Housing for All' (UN-Habitat).", "s": "UN-Habitat, October 2026", "u": "https://unhabitat.org/world-habitat-day", "t": "World: cities"}, {"id": "Q472", "cat": "CA", "q": "A current-affairs quiz asks about the UN high-level week of September 2026. Which General Assembly session number is the right answer?", "o": ["82nd", "80th", "78th", "81st"], "a": 3, "x": "The September 2026 high-level week belonged to the 81st session of the UN General Assembly (UN).", "s": "UN General Assembly, September 2026", "u": "https://www.un.org/en/ga/", "t": "World"}, {"id": "Q473", "cat": "CA", "q": "World Space Week opens every 4 October. A student asks why that date was picked. Which 1957 event does it mark?", "o": ["The founding of NASA", "The first human journey into space", "The first Moon flyby", "The launch of Sputnik 1"], "a": 3, "x": "4 October 1957 saw the launch of Sputnik 1, the first human-made satellite; World Space Week starts on that anniversary (UN).", "s": "UN World Space Week", "u": "https://www.worldspaceweek.org/", "t": "World: space"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
