<h1>General awareness practice gca0f9473c</h1><p>10 questions &middot; current affairs and general knowledge &middot; easy level. Pick one answer for every question, then press Submit. Facts are as of the date in each explanation.</p>

<script>const D={"id": "gca0f9473c", "date": "2026-11-15", "qs": [{"id": "G01", "cat": "GK", "q": "A block of dry ice leaves no puddle as it shrinks into gas. Which change explains this?", "o": ["Evaporation", "Sublimation", "Condensation", "Freezing"], "a": 1, "x": "Dry ice turns straight from a solid into a gas, which is sublimation, so it leaves no liquid puddle. Evaporation is liquid to gas, condensation is gas to liquid and freezing is liquid to solid.", "s": "Britannica Kids, sublimation", "u": "https://kids.britannica.com/students/assembly/view/195774", "t": "Science: states of matter"}, {"id": "G02", "cat": "GK", "q": "A student says the gall bladder makes bile. Which organ actually makes it?", "o": ["Heart", "Spleen", "Kidney", "Liver"], "a": 3, "x": "Bile is made in the liver and stored in the gall bladder before it passes to the small intestine. The gall bladder only stores it.", "s": "Britannica Kids, bile", "u": "https://kids.britannica.com/scholars/article/bile/79196", "t": "Human body"}, {"id": "G03", "cat": "GK", "q": "Which city, planned by the American architect Walter Burley Griffin after a worldwide design competition, is Australia's capital?", "o": ["Canberra", "Sydney", "Melbourne", "Adelaide"], "a": 0, "x": "After a worldwide competition, the American architect Walter Burley Griffin won with the plan for Canberra, the federal capital of Australia.", "s": "Britannica Kids, Canberra", "u": "https://kids.britannica.com/scholars/article/Canberra/19937", "t": "World geography"}, {"id": "G04", "cat": "CA", "q": "Since which year has 15 November been observed in India as Janjatiya Gaurav Diwas?", "o": ["2014", "2017", "2021", "2023"], "a": 2, "x": "PIB says the Government of India designated 15 November as Janjatiya Gaurav Diwas in 2021, the birth anniversary of Bhagwan Birsa Munda.", "s": "PIB, 15 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2336424&lang=2&reg=48", "t": "India: tribal heritage"}, {"id": "G05", "cat": "CA", "q": "Under which scheme did Union Minister Shivraj Singh Chouhan announce five lakh pucca houses for poor families in Odisha on 14 November 2026?", "o": ["Jal Jeevan Mission", "Ayushman Bharat", "Pradhan Mantri Awas Yojana-Gramin", "Pradhan Mantri Kisan Samman Nidhi"], "a": 2, "x": "PIB says Shri Shivraj Singh Chouhan announced five lakh pucca houses for poor families in Odisha under the Pradhan Mantri Awas Yojana-Gramin, at a programme in Balangir on 14 November 2026.", "s": "PIB, 14 November 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2336269&lang=2&reg=48", "t": "India: rural housing"}, {"id": "G06", "cat": "GK", "q": "Bodh Gaya, where the Buddha attained Enlightenment under the Bodhi tree, is in which Indian state?", "o": ["Bihar", "Assam", "Odisha", "Gujarat"], "a": 0, "x": "According to Buddhist tradition the Buddha attained Enlightenment under the Bodhi tree at Bodh Gaya in Bihar.", "s": "Britannica Kids, Bodhi tree", "u": "https://kids.britannica.com/scholars/article/Bodhi-tree/15801", "t": "India: history and culture"}, {"id": "G07", "cat": "GK", "q": "Which instrument is used to measure atmospheric pressure?", "o": ["Thermometer", "Voltmeter", "Hygrometer", "Barometer"], "a": 3, "x": "A barometer measures atmospheric pressure.", "s": "Britannica Kids, barometer", "u": "https://kids.britannica.com/scholars/article/barometer/13436", "t": "Science: instruments"}, {"id": "G08", "cat": "GK", "q": "Lightning is a visible discharge of which form of energy from a charged cloud?", "o": ["Magnetism", "Electricity", "Sound", "Heat from the Sun"], "a": 1, "x": "Lightning is the visible discharge of electricity from a cloud that has built up excess electrical charge.", "s": "Britannica Kids, lightning", "u": "https://kids.britannica.com/scholars/article/lightning/48228", "t": "Science: weather"}, {"id": "G09", "cat": "GK", "q": "The Indian monsoon blows from the southwest in the warmest months. From which direction does it blow in the cooler months?", "o": ["Northeast", "Southeast", "Northwest", "South"], "a": 0, "x": "The Indian monsoon blows from the northeast during the cooler months and reverses to blow from the southwest in the warmest months.", "s": "Britannica Kids, Indian monsoon", "u": "https://kids.britannica.com/scholars/article/Indian-monsoon/475324", "t": "India: climate"}, {"id": "G10", "cat": "GK", "q": "Which continent has an ice sheet covering nearly all of it?", "o": ["Australia", "South America", "Asia", "Antarctica"], "a": 3, "x": "An ice sheet covers nearly all of Antarctica, with thick ice over about 98 percent of the land.", "s": "Britannica Kids, Antarctica", "u": "https://kids.britannica.com/students/article/Antarctica/272892", "t": "World geography"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.cat=="CA"?"Current affairs":"General knowledge")+" &middot; "+esc(q.t)+"</span><br><b>"+(i+1)+". "+esc(q.q)+"</b>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+"<br>"+esc(q.x)+'<br><span class="tag">Source: <a href="'+q.u+'" target="_blank" rel="noopener">'+esc(q.s)+"</a></span></div>"});
document.getElementById("score").textContent="Score: "+s+"/10";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="GKQ|"+D.id+"|"+s+"/10|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
