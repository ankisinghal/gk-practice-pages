ut 23.5 degrees north of the Equator. The Tropic of Capricorn is at the corresponding southern latitude.", "s": "Britannica, Tropic of Cancer", "u": "https://www.britannica.com/place/Tropic-of-Cancer", "t": "Geography"}, {"id": "Q118", "cat": "GK", "q": "Emperor Akbar belonged to which ruling dynasty?", "o": ["Maurya", "Mughal", "Chola", "Gupta"], "a": 1, "x": "Akbar was a Mughal emperor. The Maurya and Gupta dynasties ruled much earlier, while the Cholas were a southern dynasty.", "s": "Britannica, Akbar", "u": "https://www.britannica.com/biography/Akbar", "t": "History and culture"}, {"id": "Q119", "cat": "GK", "q": "Under Article 32, a person can move the Supreme Court directly to enforce which of these?", "o": ["Parliamentary privileges", "Fundamental Duties", "Fundamental Rights", "Directive Principles"], "a": 2, "x": "Article 32 provides the right to move the Supreme Court for enforcement of Fundamental Rights. The Court can issue appropriate directions, orders or writs.", "s": "Supreme Court, jurisdiction", "u": "https://www.sci.gov.in/jurisdiction/", "t": "Civics"}, {"id": "Q120", "cat": "GK", "q": "What is the purpose of the thin wire inside an electrical fuse?", "o": ["To increase voltage when a circuit is overloaded", "To store charge and release it when current stops", "To melt and break the circuit if current is excessive", "To keep current flowing when a wire is damaged"], "a": 2, "x": "A fuse uses a metal strip or wire that melts when current exceeds its intended level. The break interrupts the circuit and helps protect it.", "s": "Britannica, fuse", "u": "https://www.britannica.com/technology/fuse-electronic-device", "t": "Science: electricity"}, {"id": "Q095", "cat": "GK", "q": "An alarm vibrates inside a sealed vessel. Less sound reaches a microphone as the air is pumped out. Why?", "o": ["The sound loses its magnetic charge", "The remaining air blocks all vibration", "There is less light to carry the sound", "There is less matter to carry the sound"], "a": 3, "x": "Sound needs a material medium. Removing air reduces the matter available to carry the vibration; a vacuum does not carry sound.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/science/How-Does-Sound-Travel", "t": "Science"}, {"id": "Q097", "cat": "GK", "q": "Which description correctly matches the Ajanta caves?", "o": ["Sikh caves with royal burial chambers", "Buddhist caves with monasteries and paintings", "Jain caves built mainly for coronations", "Hindu caves built mainly as observatories"], "a": 1, "x": "Ajanta in Maharashtra is known for Buddhist cave temples, monasteries and paintings. Ellora, not Ajanta, includes several religious traditions.", "s": "Britannica, checked 14 October 2026", "u": "https://www.britannica.com/place/Ajanta-Caves", "t": "History and culture"}, {"id": "Q074", "cat": "CA", "q": "The PIB announcement of 10 October placed the programme including the IIT Madras Brain Centre in which city?", "o": ["Hyderabad", "Pune", "Kolkata", "Chennai"], "a": 3, "x": "The 10 October PIB announcement located this 11 October programme in Chennai. This question concerns the dated announcement, not proof that every planned event took place.", "s": "PIB, 10 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321671&lang=1&reg=3", "t": "India: science"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
