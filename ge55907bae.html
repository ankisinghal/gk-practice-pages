, 10 October 2026", "u": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2321694&lang=2&reg=48", "t": "India: international cooperation"}, {"id": "Q074", "cat": "CA", "q": "The PIB announcement of 10 October places the Prime Minister's 11 October programme, including the IIT Madras Brain Centre, in which city?", "o": ["Mumbai", "Bengaluru", "Hyderabad", "Chennai"], "a": 3, "x": "The dated announcement places the programme in Chennai, Tamil Nadu. It is an announced programme, not a claim that all events have finished.", "s": "PIB, 10 October 2026", "u": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2321671&lang=1&reg=3", "t": "India: science"}, {"id": "Q209", "cat": "GK", "q": "In the final medal table of the 2026 Asian Games, which position did India finish in?", "o": ["Second", "Fourth", "Third", "Fifth"], "a": 1, "x": "India finished fourth, ahead of Uzbekistan on more silver medals after both won 21 golds; China, Japan and South Korea took the top three spots.", "s": "Sportstar (The Hindu), final medal tally, 4 October 2026", "u": "https://sportstar.thehindu.com/asian-games/india-final-medal-tally-asian-games-2026-fourth-place-standings-gold-silver-bronze-count/article71542939.ece", "t": "Sports"}, {"id": "Q242", "cat": "GK", "q": "Which animal is the national animal of India?", "o": ["Lion", "Elephant", "Tiger", "Peacock"], "a": 2, "x": "Know India, the Government of India portal, says the tiger's combination of grace, strength, agility and power has earned it the place of national animal of India. The peacock is the national bird, a different symbol.", "s": "Know India (Government of India), checked 29 October 2026", "u": "https://knowindia.india.gov.in/national-identity-elements/national-animal.php", "t": "India: symbols"}, {"id": "Q076", "cat": "GK", "q": "After which conquest did Emperor Ashoka renounce armed conquest and favour rule through dharma?", "o": ["Kalinga", "Plassey", "Panipat", "Buxar"], "a": 0, "x": "The suffering caused by the Kalinga conquest led Ashoka to renounce armed conquest. The other battles belong to much later periods.", "s": "Britannica, checked 11 October 2026", "u": "https://www.britannica.com/biography/Ashoka", "t": "History"}, {"id": "Q245", "cat": "GK", "q": "Who is best remembered for inventing the telephone?", "o": ["Thomas Edison", "Nikola Tesla", "Alexander Graham Bell", "Guglielmo Marconi"], "a": 2, "x": "Britannica describes Alexander Graham Bell as the scientist and teacher best remembered for inventing the telephone.", "s": "Britannica, checked 29 October 2026", "u": "https://www.britannica.com/biography/Alexander-Graham-Bell", "t": "History: inventions"}, {"id": "Q014", "cat": "GK", "q": "Who wrote the song Jana Gana Mana, which is India's national anthem?", "o": ["Rabindranath Tagore", "Bankim Chandra Chatterjee", "Sarojini Naidu", "Muhammad Iqbal"], "a": 0, "x": "Rabindranath Tagore wrote Jana Gana Mana in Bengali. The Constituent Assembly adopted it as the national anthem on 24 January 1950.", "s": "Know India (Government of India)", "u": "https://knowindia.india.gov.in/hindi/national-identity-elements/national-anthem.php", "t": "History and culture"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
